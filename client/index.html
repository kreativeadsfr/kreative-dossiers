<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Espace client · Kreative</title>
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="stylesheet" href="/ui/app.css">
<script src="/ui/app.js"></script>
<script src="/ui/review.js"></script>
</head>
<body>
<div id="racine"><div class="chargement">Chargement de votre espace…</div></div>
<script>
/* ============================================================
   PORTAIL CLIENT KREATIVE
   Accueil, projets (avancement en 5 étapes, validation, avis),
   brief (Fillout intégré), factures, commander (paiement Stripe,
   configurateur du pack Custom), profil, contact.
   Les données viennent de /api/client/moi. Le statut et les étapes
   sont calculés par le serveur (une seule source de vérité).
   ============================================================ */
const LIENS = {
  whatsapp: 'https://api.whatsapp.com/send?phone=33756921042',
  trustpilot: 'https://www.trustpilot.com/evaluate/kreativeads.fr',
  fillout: {
    starter: 'https://kreative-forms.fillout.com/t/hSWiGFjTVhus',
    growth: 'https://kreative-forms.fillout.com/t/soMTps1WZmus',
    scale: 'https://kreative-forms.fillout.com/t/sPx62jwVQqus',
    custom: 'https://kreative-forms.fillout.com/t/oQN3qKRznVus',
    suivant: 'https://kreative-forms.fillout.com/t/9pEDzM8K9Tus'
  }
};
const { i, esc } = K;
let D = null;                 // les données du client
let formule = 'mensuel';      // onglet de la page Commander

const params = new URLSearchParams(location.search);
if (params.get('client')) K.suffixe = '?client=' + encodeURIComponent(params.get('client'));

const wa = texte => LIENS.whatsapp + '&text=' + encodeURIComponent(texte);
const nomPack = c => 'Pack ' + ((D.packs[c.pack] || {}).nom || c.pack);
const nom = c => K.nomCommande(c);
const coeur = c => c.etapes.filter(e => !e.option);
const etat = c => K.etatCle(c);
const enCours = () => D.commandes.filter(c => !['valide', 'annule'].includes(etat(c)));
const prenom = () => (D.client.contact || '').trim().split(/\s+/)[0] || D.client.marque;
const facturesDe = c => (D.factures || []).filter(f => f.commande_id === c.id);

function conf() {
  return {
    cta: { texte: 'Commander des créas', href: '#/commander' },
    sections: [{ titre: 'Espace client', liens: [
      { id: 'accueil', texte: 'Accueil', icone: 'accueil', href: '#/' },
      { id: 'projets', texte: 'Mes projets', icone: 'dossier', href: '#/projets', nb: D.commandes.length || '' },
      { id: 'brief', texte: 'Mon brief', icone: 'doc', href: '#/brief' },
      { id: 'factures', texte: 'Factures', icone: 'recu', href: '#/factures', nb: payees(D.factures).length || '' }
    ] }, { titre: 'Kreative', liens: [
      { id: 'contact', texte: 'Nous contacter', icone: 'message', href: '#/contact' },
      { id: 'avis', texte: 'Laisser un avis', icone: 'etoile', href: '#/avis' }
    ] }],
    qui: { nom: D.client.marque, role: D.client.contact || D.client.email || 'Client', tuile: true, photo: urlPhoto() },
    menu: ['<a href="#/profil">' + i.utilisateur + 'Mon profil</a>'],
    sansTheme: true,
    sortie: D.apercu ? '/admin/#/clients/' + D.client.id : '/client/sortie'
  };
}

function apercu() {
  return D.apercu ? '<div class="bandeau amb"><span class="ic">' + i.oeil + '</span><div><b>Aperçu de l\'espace de ' + esc(D.client.marque) + '</b>' +
    '<small>Vous voyez exactement ce que voit votre client. Rien de ce que vous faites ici ne lui est envoyé.</small></div>' +
    '<a class="btn btn-sm" href="/admin/#/clients/' + esc(D.client.id) + '">Retour à l\'admin</a></div>' : '';
}
const urlPhoto = () => D.client.photo_le ? '/api/client/photo' + (K.suffixe ? K.suffixe + '&' : '?') + 'v=' + D.client.photo_le : '';
async function recharger() { D = await K.api('/api/client/moi'); K.rendre(); }

// ---------- ACCUEIL ----------
function ecranAccueil() {
  const cours = enCours();
  const principal = cours[0] || D.commandes[0];
  const attente = D.commandes.find(c => etat(c) === 'confirmee');
  const aReviewer = D.commandes.find(c => c.a_reviewer), aValider = aReviewer || D.commandes.find(c => etat(c) === 'livre');
  let h = apercu();
  if (aValider) h += '<div class="bandeau"><span class="ic">' + i.image + '</span><div><b>Vos créatives sont prêtes</b>' +
    '<small>' + esc(nom(aValider)) + ' : regardez chaque créative, commentez ce qui doit bouger, approuvez le reste.</small></div>' +
    '<a class="btn" href="#/projets/' + esc(aValider.id) + (aValider.creatives ? '/creatives' : '') + '">Voir mes créatives</a></div>';
  else if (attente) h += '<div class="bandeau"><span class="ic">' + i.doc + '</span><div><b>Il reste une étape : votre brief</b>' +
    '<small>Comptez une quinzaine de minutes. Il lance la production de votre ' + esc(nom(attente)) + '.</small></div>' +
    '<a class="btn" href="#/brief/' + esc(attente.id) + '">Remplir mon brief</a></div>';
  h += '<div class="ph"><div><h1>Bonjour, ' + esc(prenom()) + '</h1><p>Suivez l\'avancement de vos projets chez Kreative.</p></div></div>';

  h += '<div class="sec" style="margin-top:0"><div><h2>Mes projets</h2><p>Cliquez sur un projet pour voir son avancement, votre brief et vos créatives.</p></div></div>';
  h += D.commandes.length ? '<div class="projets">' + D.commandes.slice(0, 3).map(carteProjet).join('') + '</div>'
    : '<div class="card"><div class="vide">' + i.dossier + 'Aucun projet pour l\'instant.<br><a class="btn btn-p btn-sm" style="margin-top:14px" href="#/commander">Commander mes premières créas</a></div></div>';

  if (principal) {
    const pas = prochaineEtape(principal), F = payees(D.factures), derniere = F[0];
    h += '<div class="grid g3" style="margin-top:14px">' +
      '<a class="card kpi lien-kpi" href="#/projets/' + esc(principal.id) + '"><div class="lab">Prochaine étape</div><div class="v s">' + esc(pas.titre) + '</div><div class="d">' + esc(pas.texte) + '</div></a>' +
      '<div class="card kpi"><div class="lab">Livraison prévue</div><div class="v s">' + (principal.deadline ? esc(K.jour(principal.deadline)) : 'Dès votre brief') + '</div><div class="d">' +
        esc(principal.deadline ? nom(principal) : 'Le délai démarre à la réception du brief') + '</div></div>' +
      '<a class="card kpi lien-kpi" href="#/factures"><div class="lab">Factures</div><div class="v s">' + (derniere ? K.euros(derniere.montant) : 'Aucune') + '</div><div class="d">' +
        (derniere ? 'Dernière le ' + esc(K.date(derniere.emise_le, { year: undefined })) + ' · ' + F.length + ' au total' : 'Elles arrivent ici après chaque paiement') + '</div></a></div>';
    h += '<div class="card" style="margin-top:14px"><div class="card-h"><h3>Activité récente</h3></div><div class="card-b liste">' +
      (D.activite.length ? D.activite.slice(0, 6).map(a => '<div class="li"><span class="ic">' + (ICONES_ACT[a.type] || i.coche) + '</span><span class="t">' + esc(a.texte) + '</span><small>' + esc(K.ilya(a.le)) + '</small></div>').join('')
        : '<div class="vide">Rien pour l\'instant.</div>') + '</div></div>';
  }
  return h;
}
// ce qui se passe maintenant sur un projet, en une phrase
function prochaineEtape(c) {
  const e = etat(c);
  if (e === 'confirmee') return { titre: 'Votre brief', texte: 'À remplir pour lancer la production' };
  if (e === 'production') { const x = c.etapes.find(y => y.cle === 'production'); return { titre: 'Production', texte: (x && x.detail) || 'On s\'occupe de tout' }; }
  if (e === 'livre') return { titre: 'Votre validation', texte: 'Vos créatives sont prêtes' };
  if (e === 'revisions') return { titre: 'Retouches', texte: 'En cours chez Kreative' };
  return { titre: 'Projet terminé', texte: c.avis_le ? 'Merci pour votre avis' : 'Un avis nous aiderait beaucoup' };
}
const ICONES_ACT = { commande: i.sac, brief: i.doc, livre: i.image, revisions: i.crayon, valide: i.coche, production: i.pinceau, client: i.accueil, lien: i.lien,
  facture: i.recu, paiement: i.carte, avis: i.etoile, profil: i.utilisateur };

function carteProjet(c) {
  return '<a class="card projet" href="#/projets/' + esc(c.id) + '"><div class="hd"><span class="ic">' + i.calques + '</span>' + K.pillCommande(c) + '</div>' +
    '<div class="lab">#' + esc(c.ref) + ' · ' + c.nb_creas + ' créatives</div><h3>' + esc(nom(c)) + '</h3>' +
    '<div class="muted" style="font-size:13px">Commandé le ' + esc(K.date(c.cree_le)) + (c.formule === 'mensuel' ? ' · abonnement' : '') + '</div>' +
    '<div class="barre" style="margin-top:12px"><i style="width:' + c.progression + '%"></i></div><div class="pc">' + c.progression + ' % d\'avancement</div>' +
    '<span class="btn btn-p btn-sm">Voir le projet ' + i.fleche + '</span></a>';
}

// ---------- PROJETS ----------
function ecranProjets() {
  let h = apercu() + '<div class="ph"><div><h1>Mes projets</h1><p>Toutes vos commandes et leur avancement.</p></div>' +
    '<div class="act"><a class="btn btn-p" href="#/commander">' + i.plus + 'Nouvelle commande</a></div></div>';
  if (!D.commandes.length) return h + '<div class="card"><div class="vide">' + i.dossier + 'Aucun projet pour l\'instant.</div></div>';
  h += '<div class="card"><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Projet</th><th>Volume</th><th>Statut</th><th>Avancement</th><th>Livraison</th><th></th></tr></thead><tbody>' +
    D.commandes.map(c => '<tr class="clic" onclick="location.hash=\'#/projets/' + esc(c.id) + '\'"><td><b>' + esc(nom(c)) + '</b><span class="sub">#' + esc(c.ref) + ' · ' + esc(K.date(c.cree_le)) + '</span></td>' +
      '<td>' + c.nb_creas + ' créatives<span class="sub">' + (c.formule === 'mensuel' ? 'Abonnement mensuel' : 'Commande unique') + '</span></td>' +
      '<td>' + K.pillCommande(c) + '</td><td style="min-width:150px"><div class="barre' + (c.progression === 100 ? ' g' : '') + '"><i style="width:' + c.progression + '%"></i></div><span class="sub">' + c.progression + ' %</span></td>' +
      '<td>' + (c.deadline ? esc(K.date(c.deadline)) : '<span class="muted">Dès le brief</span>') + '</td><td class="fin">' + i.fleche.replace('<svg', '<svg width="16" height="16" style="opacity:.4"') + '</td></tr>').join('') +
    '</tbody></table></div></div>';
  return h;
}

function ecranProjet(id) {
  const c = D.commandes.find(x => x.id === id);
  if (!c) return '<a class="retour" href="#/projets">' + i.gauche + 'Mes projets</a><div class="card"><div class="vide">Projet introuvable.</div></div>';
  CREAS.commande = null;   // en revenant sur les créatives, elles se rechargent
  const e = etat(c), ce = coeur(c), fait = k => (c.etapes.find(x => x.cle === k) || {}).fait;
  let h = apercu() + '<a class="retour" href="#/projets">' + i.gauche + 'Retour à mes projets</a>' +
    '<div class="ph"><div><h1 class="avec-pill">' + esc(nom(c)) + ' ' + K.pillCommande(c) + '</h1>' +
    '<p>Commande #' + esc(c.ref) + ' du ' + esc(K.date(c.cree_le)) + ' · ' + c.nb_creas + ' créatives' + (c.deadline && !fait('livraison') ? ' · livraison prévue le ' + esc(K.jour(c.deadline)) : '') + '</p></div></div>';
  // l'avancement, comme avant : la barre et les étapes, avec l'étape en cours bien visible
  const iCours = ce.findIndex(x => !x.fait), cours = ce[iCours];
  h += '<div class="card pad"><div style="display:flex;justify-content:space-between;align-items:baseline;gap:12px"><div><h3 style="font-size:16px">Avancement</h3>' +
    '<p class="muted" style="font-size:13px;margin-top:3px">' + ce.filter(x => x.fait).length + ' étapes sur ' + ce.length + (cours ? ' · en cours : ' + esc(cours.titre) + (cours.detail ? ', ' + esc(cours.detail.charAt(0).toLowerCase() + cours.detail.slice(1)) : '') : ' · projet terminé') + '</p></div>' +
    '<b style="font:600 22px var(--titre)">' + c.progression + ' %</b></div>' +
    '<div class="barre' + (c.progression === 100 ? ' g' : '') + '" style="margin-top:16px;height:7px"><i style="width:' + c.progression + '%"></i></div>' +
    '<div class="coches">' + ce.map((x, n) => '<div class="coche' + (x.fait ? ' fait' : n === iCours ? ' cours' : '') + '"><span class="o">' + (x.fait ? i.coche : '') + '</span>' + esc(x.titre) + (n === iCours ? '<span class="pill b" style="margin-left:4px">En cours</span>' : '') + '</div>').join('') + '</div></div>';

  h += '<div class="sec"><div><h2>Vos actions</h2><p>Ce qui dépend de vous sur ce projet.</p></div></div><div class="actions">';
  h += action(fait('brief') ? 'ok' : 'on', i.doc, 'Étape 2', 'Votre brief', 'Les informations sur votre marque qui lancent la production.',
    fait('brief') ? '<div class="etat ok">✓ Brief envoyé</div>' : '<a class="btn btn-p btn-sm" href="#/brief/' + esc(c.id) + '">Remplir mon brief</a>');
  h += action(c.creatives || fait('livraison') ? (c.a_reviewer ? 'on' : 'ok') : 'off', i.image, 'Étape 4', 'Vos créatives',
    c.nb_creas + ' créatives en 3 formats (1:1, 4:5, 9:16).',
    c.creatives ? '<a class="btn ' + (c.a_reviewer ? 'btn-p' : 'btn-s') + ' btn-sm" href="#/projets/' + esc(c.id) + '/creatives">Voir mes créatives</a>' :
    fait('livraison') ? '<a class="btn btn-s btn-sm" href="' + wa('Bonjour Kreative, je voudrais récupérer les créatives de mon projet ' + nom(c) + ' (#' + c.ref + ')') + '" target="_blank" rel="noopener">Recevoir mes créatives</a>'
      : '<div class="etat">' + (c.deadline ? 'Prévues le ' + esc(K.date(c.deadline, { year: undefined })) : 'Après votre brief') + '</div>');
  h += action(e === 'valide' ? 'ok' : ['livre', 'revisions'].includes(e) ? 'on' : 'off', i.coche, 'Étape 5', 'Validation',
    e === 'revisions' ? 'Vos retouches sont en cours. Validez quand tout vous convient.' : 'Vous validez la version finale, ou demandez une retouche avant.',
    e === 'valide' ? '<div class="etat ok">✓ Validé' + (c.valide_le ? ' le ' + esc(K.date(c.valide_le, { year: undefined })) : '') + '</div>'
      : c.a_reviewer ? '<a class="btn btn-p btn-sm" href="#/projets/' + esc(c.id) + '/creatives">Ouvrir la review</a>'
      : c.creatives && e === 'revisions' ? '<div class="etat">Retours envoyés · nouvelle version en préparation</div>'
      : ['livre', 'revisions'].includes(e) ? '<button class="btn btn-p btn-sm" data-valider="' + esc(c.id) + '">Valider la livraison</button>' +
        '<a class="btn btn-g btn-sm" style="margin-top:6px" href="' + wa('Bonjour Kreative, je voudrais une retouche sur mon projet ' + nom(c) + ' (#' + c.ref + ') : ') + '" target="_blank" rel="noopener">Demander une retouche</a>'
      : '<div class="etat">Après la livraison</div>');
  h += action(c.avis_le ? 'ok' : e === 'valide' ? 'on' : 'off', i.etoile, 'Trustpilot', 'Votre avis', 'Une minute pour nous dire comment ça s\'est passé.',
    c.avis_le ? '<div class="etat ok">✓ Merci pour votre avis</div>' : e === 'valide' ? '<button class="btn btn-tp btn-sm" data-avis="' + esc(c.id) + '">Laisser mon avis</button>' : '<div class="etat">À la fin du projet</div>');
  h += '</div>';
  const F = payees(facturesDe(c));
  if (F.length) h += '<div class="sec"><div><h2>Factures</h2><p>Les factures de ce projet.</p></div></div><div class="card"><div class="tbl-wrap">' + tableFactures(F) + '</div></div>';
  return h;
}
function action(etatCarte, icone, lab, titre, texte, pied) {
  return '<div class="card action ' + etatCarte + '"><span class="ic">' + icone + '</span><div class="lab">' + esc(lab) + '</div><h3>' + esc(titre) + '</h3><p>' + esc(texte) + '</p>' + pied + '</div>';
}
function brancherProjet() {
  document.querySelectorAll('[data-valider]').forEach(b => b.onclick = async () => {
    const c = D.commandes.find(x => x.id === b.dataset.valider);
    if (!await K.confirmer('Valider la livraison ?', 'Vos ' + c.nb_creas + ' créatives deviennent définitives. Pour une retouche, écrivez-nous avant de valider.', 'Valider la livraison')) return;
    try { await K.api('/api/client/commandes/' + c.id + '/valider', { methode: 'POST' }); await recharger(); fenetreAvis(D.commandes.find(x => x.id === c.id)); }
    catch (e) { K.toast(e.message); }
  });
  document.querySelectorAll('[data-avis]').forEach(b => b.onclick = () => fenetreAvis(D.commandes.find(x => x.id === b.dataset.avis)));
}

// ---------- LES CRÉATIVES : la review du client ----------
const CREAS = { commande: null, donnees: null, choix: null };
async function chargerCreatives(id) {
  CREAS.commande = id;
  try { CREAS.donnees = await K.api('/api/client/commandes/' + id + '/creatives'); } catch (e) { CREAS.donnees = { livraisons: [], erreur: e.message }; }
  const L = CREAS.donnees.livraisons;
  if (!L.find(l => l.id === CREAS.choix)) CREAS.choix = (L.find(l => l.statut === 'envoyee') || L[0] || {}).id || null;
  K.rendre();
}
const nomVersion = l => (l.partie ? 'Livraison ' + l.partie.n + '/' + l.partie.sur + ' · ' : '') + 'Version ' + l.version;
function ecranCreatives(id) {
  const c = D.commandes.find(x => x.id === id);
  if (!c) return '<a class="retour" href="#/projets">' + i.gauche + 'Mes projets</a><div class="card"><div class="vide">Projet introuvable.</div></div>';
  let h = apercu() + '<a class="retour" href="#/projets/' + esc(c.id) + '">' + i.gauche + 'Retour au projet</a>';
  if (CREAS.commande !== id) { CREAS.commande = id; CREAS.donnees = null; setTimeout(() => chargerCreatives(id), 0); }
  if (!CREAS.donnees) return h + '<div class="card"><div class="vide">Chargement de vos créatives…</div></div>';
  const L = CREAS.donnees.livraisons, l = L.find(x => x.id === CREAS.choix);
  if (!l) return h + '<div class="card"><div class="vide">' + i.image + 'Vos créatives arrivent ici dès qu\'elles sont prêtes.</div></div>';
  h += RV.puces(L, l.id, nomVersion);
  const enReview = l.statut === 'envoyee' && !D.apercu;
  if (l.statut === 'review_terminee') h += '<div class="rv-note">' + i.coche + '<div><b>Review envoyée' + (l.review_le ? ' le ' + esc(K.date(l.review_le, { year: undefined })) : '') + '.</b> Vos retours sont chez Kreative : la nouvelle version arrive ici.</div></div>';
  if (l.statut === 'approuvee') h += '<div class="rv-note">' + i.coche + '<div><b>Livraison approuvée.</b> Vos créatives sont définitives, téléchargez-les quand vous voulez.</div></div>';
  return h + RV.grille(l, { mode: 'client', titre: nom(c) + (L.length > 1 ? ' · ' + nomVersion(l) : ''),
    actions: enReview ? '<button class="btn btn-s" data-tout-ok>' + i.coche + 'Tout approuver</button><button class="btn btn-d" data-terminer>' + i.envoi + 'Review terminée</button>' : '' });
}
const RV = K.rv;
function brancherCreatives(params) {
  const L = (CREAS.donnees && CREAS.donnees.livraisons) || [], l = L.find(x => x.id === CREAS.choix), c = D.commandes.find(x => x.id === params[0]);
  if (!l || !c) return;
  document.querySelectorAll('[data-rv-version]').forEach(b => b.onclick = () => { CREAS.choix = b.dataset.rvVersion; K.rendre(); });
  RV.brancher(l, { mode: 'client', nomZip: (D.client.marque + '-' + nomVersion(l)).replace(/[^A-Za-z0-9]+/g, '-'), rendre: () => K.rendre(),
    auteur: D.client.contact || D.client.marque,
    peutCommenter: x => x.statut === 'envoyee' && !D.apercu, peutApprouver: x => x.statut === 'envoyee' && !D.apercu,
    api: {
      commenter: (f, texte, forme, couleur) => K.api('/api/client/commentaires', { methode: 'POST', corps: { fichier_id: f.id, texte, forme, couleur } }),
      supprimer: id => K.api('/api/client/commentaires/' + id, { methode: 'DELETE' }),
      approuver: (f, oui) => K.api('/api/client/fichiers/' + f.id + '/approuver', { methode: 'POST', corps: { oui } })
    } });
  const t = document.querySelector('[data-tout-ok]');
  if (t) t.onclick = async () => {
    if (!await K.confirmer('Tout approuver ?', 'Les ' + l.fichiers.length + ' fichiers de cette version sont marqués comme approuvés. Vous terminez ensuite votre review.', 'Tout approuver')) return;
    try { await K.api('/api/client/livraisons/' + l.id + '/tout-approuver', { methode: 'POST' }); l.fichiers.forEach(f => { f.approuve_le = f.approuve_le || Date.now(); }); K.rendre(); K.toast('Tout est approuvé'); } catch (e) { K.toast(e.message); }
  };
  const fin = document.querySelector('[data-terminer]');
  if (fin) fin.onclick = async () => {
    const reste = l.fichiers.filter(f => !f.approuve_le).length, coms = l.fichiers.reduce((s, f) => s + f.commentaires.length, 0);
    const ok = reste ? await K.confirmer('Envoyer vos retours ?', coms + ' commentaire' + (coms > 1 ? 's' : '') + ', ' + (l.fichiers.length - reste) + ' fichier' + (l.fichiers.length - reste > 1 ? 's' : '') + ' approuvé' + (l.fichiers.length - reste > 1 ? 's' : '') + ' sur ' + l.fichiers.length + '. Kreative prépare une nouvelle version avec vos retours.', 'Envoyer mes retours')
      : await K.confirmer('Tout est approuvé', 'Vous validez cette livraison : vos créatives deviennent définitives.', 'Valider la livraison');
    if (!ok) return;
    try {
      const r = await K.api('/api/client/livraisons/' + l.id + '/terminer', { methode: 'POST' });
      await recharger(); await chargerCreatives(c.id);
      if (r.valide) fenetreAvis(D.commandes.find(x => x.id === c.id));
      else K.toast(r.approuvee ? 'Livraison approuvée, merci' : 'Vos retours sont envoyés à Kreative');
    } catch (e) { K.toast(e.message); }
  };
}

// ---------- LE PANIER : le pack choisi, sa formule, ses options ----------
// même calcul que le serveur (devis) ; le serveur recalcule de toute façon le prix
const CFG = { pack: 'growth', nb: 30, formule: 'mensuel', options: [] };
function devis(o) {
  o = o || CFG;
  const m = o.formule === 'mensuel', r = D.custom.remise_mensuel, opts = D.options.filter(x => o.options.includes(x.id)), lignes = [];
  let base, nb, u;
  if (o.pack !== 'custom') {
    const P = D.packs[o.pack]; nb = P.creas; base = m ? P.mensuel : P.unique; u = Math.round(base / nb);
    lignes.push(['Pack ' + P.nom + ' · ' + nb + ' créatives', base]);
    opts.filter(x => x.type === 'par_crea').forEach(x => { const v = nb * x.valeur; lignes.push([x.nom + ' · ' + nb + ' × ' + x.valeur + ' €', v]); base += v; });
  } else {
    nb = o.nb; u = D.custom.paliers.filter(x => nb >= x[0]).pop()[1];
    base = nb * u; lignes.push([nb + ' créatives × ' + u + ' €', base]);
    opts.filter(x => x.type === 'par_crea').forEach(x => { const v = nb * x.valeur; lignes.push([x.nom + ' · ' + nb + ' × ' + x.valeur + ' €', v]); base += v; });
    if (m) { lignes.push(['Remise mensuelle −' + Math.round(r * 100) + ' %', -base * r]); base *= 1 - r; }
  }
  opts.filter(x => x.type === 'pct').forEach(x => { const v = base * x.valeur / 100; lignes.push([x.nom + ' (+' + x.valeur + ' %)', v]); base += v; });
  opts.filter(x => x.type === 'fixe').forEach(x => { lignes.push([x.nom, x.valeur]); base += x.valeur; });
  return { lignes, total: Math.round(base), nb, unitaire: u };
}
// le délai de livraison après le brief : celui du pack, ou selon le volume pour le Custom ; l'express le divise par deux
function delai(o) {
  o = o || CFG;
  let h = o.pack === 'custom' ? (D.custom.delais.find(x => o.nb <= x[0]) || D.custom.delais[D.custom.delais.length - 1])[1] : D.packs[o.pack].delai;
  if (o.options.includes('express')) h = Math.round(h / 2);
  return h <= 72 ? h + ' h' : Math.round(h / 24) + ' jours';
}

// ---------- LE PAIEMENT : dans le portail (Stripe intégré), sinon la page Stripe dans le même onglet ----------
let PAIEMENT = null;
async function payer(corps, bouton) {
  if (D.apercu) { K.toast('Aperçu : le paiement s\'ouvre seulement pour le client.'); return; }
  const avant = bouton.innerHTML; bouton.disabled = true; bouton.textContent = 'Ouverture du paiement…';
  // 1. la page Stripe au montant exact (pack, formule et options), créée par le portail
  if (D.paiement) {
    try { const r = await K.api('/api/client/paiement', { methode: 'POST', corps: corps }); location.href = r.url; return; }
    catch (e) { K.toast(e.message); bouton.disabled = false; bouton.innerHTML = avant; return; }
  }
  // 2. sans la clé Stripe : le lien de paiement du pack (sans option)
  const lien = corps.pack !== 'custom' && !(corps.options || []).length && D.liens && D.liens[corps.pack] && D.liens[corps.pack][corps.formule];
  if (lien) { location.href = lien + '?client_reference_id=' + encodeURIComponent(D.client.id) + (D.client.email ? '&prefilled_email=' + encodeURIComponent(D.client.email) : '') + '&locale=fr'; return; }
  // 3. sinon : WhatsApp
  location.href = wa('Bonjour Kreative, je souhaite commander : ' + corps.texte);
}
function ecranPaiement() {
  if (!PAIEMENT) return '<a class="retour" href="#/commander">' + i.gauche + 'Retour aux offres</a><div class="card"><div class="vide">' + i.carte + 'Choisissez d\'abord votre pack.</div></div>';
  return '<a class="retour" href="#/commander/' + esc(CFG.pack) + '">' + i.gauche + 'Modifier ma commande</a>' +
    '<div class="ph"><div><h1>Paiement</h1><p>' + esc(PAIEMENT.texte) + ' · ' + K.euros(PAIEMENT.total) + '</p></div></div>' +
    '<div class="card paiement"><div id="stripe-paiement"><div class="vide">Chargement du paiement sécurisé…</div></div></div>';
}
let stripeJs = null, paiementMonte = null;
async function brancherPaiement() {
  if (!PAIEMENT) return;
  try {
    if (!stripeJs) stripeJs = new Promise((ok, ko) => { const sc = document.createElement('script'); sc.src = 'https://js.stripe.com/v3/'; sc.onload = ok; sc.onerror = () => ko(new Error('Stripe ne répond pas')); document.head.appendChild(sc); });
    await stripeJs;
    if (paiementMonte) { try { paiementMonte.destroy(); } catch (e) {} }
    const secret = PAIEMENT.secret;
    paiementMonte = await window.Stripe(D.stripe_public).initEmbeddedCheckout({ fetchClientSecret: async () => secret });
    const zone = document.getElementById('stripe-paiement');
    if (!zone) return;
    zone.innerHTML = ''; paiementMonte.mount('#stripe-paiement');
  } catch (e) { const z = document.getElementById('stripe-paiement'); if (z) z.innerHTML = '<div class="vide">Le paiement n\'a pas pu s\'afficher. ' + esc(e.message) + '</div>'; }
}

// ---------- APRÈS LE PAIEMENT ----------
function ecranMerci() {
  return '<div class="card pad" style="max-width:620px;margin:40px auto;text-align:center;padding:40px 32px"><div class="avis-fen" style="padding:0"><div class="rond">' + i.coche + '</div>' +
    '<h2>Paiement reçu, merci</h2><p>Votre commande apparaît dans votre espace dans quelques secondes. Prochaine étape : votre brief, il lance la production.</p></div>' +
    '<div style="display:flex;gap:10px;justify-content:center;margin-top:24px;flex-wrap:wrap"><a class="btn btn-p btn-lg" href="#/brief">Remplir mon brief</a><a class="btn btn-s btn-lg" href="#/projets">Mes projets</a></div></div>';
}
let attenteMerci = 0;
function brancherMerci() {
  if (attenteMerci) return;
  const avant = D.commandes.length; let n = 0;
  attenteMerci = setInterval(async () => {
    n++;
    try { const d = await K.api('/api/client/moi'); if (d.commandes.length > avant || n > 6) { clearInterval(attenteMerci); attenteMerci = 0; D = d; if (d.commandes.length > avant) K.toast('Votre commande est enregistrée'); } } catch (e) {}
  }, 2500);
}

// ---------- PROFIL ----------
function ecranProfil() {
  const c = D.client;
  const ch = (id, l, v, t, ph, aide) => '<div class="champ"><label for="' + id + '">' + l + '</label><input class="in" id="' + id + '" type="' + (t || 'text') + '" value="' + esc(v || '') + '" placeholder="' + esc(ph || '') + '">' + (aide ? '<div class="aide">' + aide + '</div>' : '') + '</div>';
  return apercu() + '<div class="ph"><div><h1>Mon profil</h1><p>Les informations de votre compte Kreative.</p></div></div>' +
    '<div class="profil grid" style="gap:14px"><div class="card"><h3 style="font-size:16px;margin-bottom:18px">Vos informations</h3>' +
    '<div class="photo-l"><span class="rond" style="background:' + K.teinte(c.marque) + '">' + (urlPhoto() ? '<img src="' + esc(urlPhoto()) + '" alt="">' : esc(K.initiales(c.marque))) + '</span>' +
    '<div><b style="font-size:14px">Photo de profil</b><div class="muted" style="font-size:12.5px">Votre logo, ou la photo de votre choix.</div>' +
    '<div class="bts"><button class="btn btn-s btn-sm" id="p-photo">' + i.image + (urlPhoto() ? 'Changer' : 'Ajouter une photo') + '</button>' +
    (urlPhoto() ? '<button class="btn btn-g btn-sm" id="p-photo-x">Retirer</button>' : '') + '</div>' +
    '<input type="file" id="p-fichier" accept="image/*" hidden></div></div>' +
    ch('p-marque', 'Marque', c.marque, 'text', 'Le nom de votre marque') +
    '<div class="grid g2" style="gap:12px">' + ch('p-contact', 'Votre nom', c.contact, 'text', 'Prénom et nom') + ch('p-tel', 'Téléphone', c.telephone, 'tel', '06…') + '</div>' +
    ch('p-email', 'Email', c.email, 'email', 'vous@marque.fr') +
    ch('p-site', 'Site', c.site, 'url', 'https://…') +
    '<div style="display:flex;justify-content:flex-end;margin-top:8px"><button class="btn btn-p" id="p-ok">Enregistrer</button></div></div>' +
    '<div class="card" style="display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap"><div><h3 style="font-size:15px">Se déconnecter</h3>' +
    '<p class="muted" style="font-size:13px;margin-top:4px">Votre lien d\'accès reste valable : il vous reconnecte quand vous le souhaitez.</p></div>' +
    '<a class="btn btn-s" href="' + (D.apercu ? '/admin/#/clients/' + esc(c.id) : '/client/sortie') + '">' + i.sortie + 'Se déconnecter</a></div></div>';
}
// la photo est recadrée en carré et réduite à 256 px dans le navigateur avant l'envoi
function reduirePhoto(fichier) {
  return new Promise((ok, ko) => {
    const img = new Image(), u = URL.createObjectURL(fichier);
    img.onload = () => {
      const c = document.createElement('canvas'), t = 256, cote = Math.min(img.width, img.height);
      c.width = c.height = t;
      c.getContext('2d').drawImage(img, (img.width - cote) / 2, (img.height - cote) / 2, cote, cote, 0, 0, t, t);
      URL.revokeObjectURL(u); ok(c.toDataURL('image/jpeg', 0.86));
    };
    img.onerror = () => { URL.revokeObjectURL(u); ko(new Error('Cette image ne peut pas être lue.')); };
    img.src = u;
  });
}
function brancherProfil() {
  const f = document.getElementById('p-fichier'), bp = document.getElementById('p-photo'), bx = document.getElementById('p-photo-x');
  if (bp) bp.onclick = () => f.click();
  if (f) f.onchange = async () => {
    if (!f.files[0]) return;
    try { const photo = await reduirePhoto(f.files[0]); await K.api('/api/client/moi', { methode: 'PATCH', corps: { photo } }); K.toast('Photo enregistrée'); await recharger(); }
    catch (e) { K.toast(e.message); }
  };
  if (bx) bx.onclick = async () => { try { await K.api('/api/client/moi', { methode: 'PATCH', corps: { photo: '' } }); K.toast('Photo retirée'); await recharger(); } catch (e) { K.toast(e.message); } };
  const b = document.getElementById('p-ok');
  if (!b) return;
  b.onclick = async () => {
    b.disabled = true;
    try {
      await K.api('/api/client/moi', { methode: 'PATCH', corps: { marque: K.$('#p-marque').value, contact: K.$('#p-contact').value, telephone: K.$('#p-tel').value, email: K.$('#p-email').value, site: K.$('#p-site').value } });
      K.toast('Profil enregistré'); await recharger();
    } catch (e) { K.toast(e.message); b.disabled = false; }
  };
}

// ---------- CONTACT, AVIS ----------
function ecranContact() {
  return apercu() + '<div class="ph"><div><h1>Nous contacter</h1><p>Une question, une urgence, un ajustement : on répond sur WhatsApp, en général dans l\'heure.</p></div></div>' +
    '<div class="card" style="max-width:760px;overflow:hidden"><div style="background:linear-gradient(140deg,#25D366,#128C7E);padding:30px;color:#fff">' +
    '<div class="wa-grand">' + i.whatsapp + '</div>' +
    '<h2 style="font-size:24px;margin-top:16px;color:#fff">WhatsApp</h2><p style="opacity:.92;margin-top:6px;max-width:420px">Le plus rapide. Votre message arrive directement à l\'équipe.</p></div>' +
    '<div style="padding:20px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap">' +
    '<div style="display:flex;gap:28px;flex-wrap:wrap"><div><div class="lab">Numéro</div><b>07 56 92 10 42</b></div><div><div class="lab">Réponse moyenne</div><b>Moins d\'une heure</b></div></div>' +
    '<a class="btn btn-lg btn-wa" href="' + wa('Bonjour Kreative, ') + '" target="_blank" rel="noopener">' + i.whatsapp + 'Nous écrire</a></div></div>';
}
function ecranAvis() {
  const etoile = '<svg viewBox="0 0 24 24"><path d="m12 2.5 2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3l-5.9 3.3 1.3-6.6-4.9-4.6 6.6-.8Z"/></svg>';
  return apercu() + '<div class="ph"><div><h1>Laissez-nous votre avis</h1><p>Un avis prend une minute et nous aide énormément.</p></div></div>' +
    '<div class="card" style="max-width:520px"><div class="avis-fen"><h2>Comment s\'est passé votre projet ?</h2>' +
    '<div class="etoiles">' + [1, 2, 3, 4, 5].map(n => '<a href="' + LIENS.trustpilot + '" target="_blank" rel="noopener" class="on" aria-label="' + n + ' étoiles">' + etoile + '</a>').join('') + '</div>' +
    '<a class="btn btn-tp btn-bloc btn-lg" href="' + LIENS.trustpilot + '" target="_blank" rel="noopener">Écrire mon avis sur Trustpilot</a>' +
    '<p class="muted" style="font-size:12.5px;margin-top:12px">Vous arrivez directement sur notre page Trustpilot.</p></div></div>';
}

// ---------- RENDU ----------
// [menu actif, icône, fil d'Ariane (fonction des paramètres), écran, branchement]
const nomProjetDe = id => { const c = D.commandes.find(x => x.id === id); return c ? nom(c) : 'Projet'; };
const ECRANS = {
  '': ['accueil', 'accueil', () => ['Accueil'], () => ecranAccueil()],
  projets: ['projets', 'dossier', p => p[1] === 'creatives' ? ['Mes projets', nomProjetDe(p[0]), 'Créatives'] : p[0] ? ['Mes projets', nomProjetDe(p[0])] : ['Mes projets'],
    p => p[1] === 'creatives' ? ecranCreatives(p[0]) : p[0] ? ecranProjet(p[0]) : ecranProjets(), p => p[1] === 'creatives' ? brancherCreatives(p) : brancherProjet()],
  brief: ['brief', 'doc', () => ['Mon brief'], p => ecranBrief(p[0])],
  factures: ['factures', 'recu', () => ['Factures'], () => ecranFactures()],
  commander: ['commander', 'panier', p => p[0] === 'paiement' ? ['Commander des créas', 'Paiement'] : p[0] && D.packs[p[0]] ? ['Commander des créas', 'Pack ' + D.packs[p[0]].nom] : ['Commander des créas'],
    p => p[0] === 'paiement' ? ecranPaiement() : p[0] ? ecranPanier(p[0]) : ecranCommander(), p => p[0] === 'paiement' ? brancherPaiement() : p[0] ? brancherPanier() : null],
  merci: ['projets', 'panier', () => ['Commander des créas', 'Paiement reçu'], () => ecranMerci(), brancherMerci],
  profil: ['profil', 'utilisateur', () => ['Mon profil'], () => ecranProfil(), brancherProfil],
  contact: ['contact', 'message', () => ['Nous contacter'], () => ecranContact()],
  avis: ['avis', 'etoile', () => ['Laisser un avis'], () => ecranAvis()]
};
K.rendre = () => {
  if (!D) return;
  const r = K.route(), e = ECRANS[r.ecran] || ECRANS[''];
  const c = conf(), fil = e[2](r.params);
  document.getElementById('racine').innerHTML = K.coquille(c, e[0], K.ariane(e[1], ...fil), e[3](r.params), r.ecran === 'brief' ? true : r.ecran === 'commander' ? 'centre' : false);
  K.brancherCoquille(c);
  if (e[4]) e[4](r.params);
  document.title = 'Espace client · Kreative';
};
// retour de Stripe (paiement intégré) : on arrive sur « Paiement reçu »
if (params.get('paiement') === 'ok') history.replaceState(null, '', location.pathname + (K.suffixe || '') + '#/merci');
(async () => {
  try {
    D = await K.api('/api/client/moi'); K.rendre();
    // un projet validé sans avis : la fenêtre Trustpilot revient une fois par visite
    const sansAvis = D.commandes.find(c => etat(c) === 'valide' && !c.avis_le && !c.avis_ignore_le);
    let vu = false; try { vu = sessionStorage.getItem('k-avis') === '1'; } catch (e) {}
    if (sansAvis && !D.apercu && !vu) { try { sessionStorage.setItem('k-avis', '1'); } catch (e) {} setTimeout(() => fenetreAvis(sansAvis), 700); }
  } catch (e) {
    if (e.statut === 401) location.href = '/client/connexion';
    else document.getElementById('racine').innerHTML = '<div class="chargement">Impossible de charger votre espace. ' + esc(e.message) + '</div>';
  }
})();
</script>
