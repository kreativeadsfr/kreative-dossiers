<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Espace stratégiste · Kreative</title>
<link rel="icon" type="image/png" sizes="32x32" href="../favicon-32.png">
<link rel="stylesheet" href="../ui/kreative.css">
<style>
/* ============================================================
   ESPACE STRATÉGISTE
   Tous les projets du stratégiste au même endroit : les fiches à
   remplir avec leur échéance, le dossier de production, les retours
   du client et la fiche ; puis les projets partis en production.
   La page lit les fichiers publics du dépôt (projets.json, et pour
   chaque projet donnees.json, envois.json, livraison.json, retour.json).
   ============================================================ */
.w{max-width:1060px;margin:0 auto;padding:0 24px 90px}
.hero{margin:54px 0 30px}
.hero h1{font:600 48px/1.02 var(--k-titre);letter-spacing:-.045em;margin:0}
.hero h1 em{font-style:normal;color:var(--k-blue)}
.hero p{margin:12px 0 0;color:var(--k-tx2);font-size:16px;max-width:620px}
.titre{display:flex;align-items:center;gap:12px;margin:40px 0 16px}
.titre h2{font:600 26px/1.1 var(--k-titre);letter-spacing:-.025em;margin:0}
.titre .nb{min-width:28px;height:28px;padding:0 9px;border-radius:999px;background:var(--k-blue);color:#fff;
  font:600 13px/28px var(--k-texte);text-align:center}
.titre .nb.gris{background:var(--k-soft);color:var(--k-tx2)}
.liste{display:flex;flex-direction:column;gap:14px}
.p{background:var(--k-pan);border:1px solid var(--k-line);border-radius:var(--k-r);box-shadow:var(--k-ombre);padding:22px 24px}
.p .l1{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.p .nom{font:600 23px/1.15 var(--k-titre);letter-spacing:-.025em;margin:0}
.p .meta{color:var(--k-tx2);font-size:14.5px;margin-top:4px}
.p .meta b{color:var(--k-ink);font-weight:600}
.p .act{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;letter-spacing:.02em;
  padding:5px 11px;border-radius:999px;background:var(--k-blue-soft);color:var(--k-blue)}
.pill.urgent{background:#1f1f1f;color:#fff}
.pill.retard{background:#fde8e6;color:#b3261e}
.pill.ok{background:var(--k-soft);color:var(--k-tx2)}
.liv{display:none;margin-top:18px;padding:20px;border-radius:18px;background:var(--k-dark);color:#fff}
.p.ouvert .liv{display:block}
.liv p{margin:0 0 12px;color:rgba(255,255,255,.75);font-size:14px}
.liv input,.liv textarea{display:block;width:100%;font:inherit;font-size:14.5px;padding:13px 16px;margin:0 0 10px;
  border:1px solid rgba(255,255,255,.14);border-radius:14px;background:rgba(255,255,255,.06);color:#fff;outline:0}
.liv input::placeholder,.liv textarea::placeholder{color:rgba(255,255,255,.45)}
.liv input:focus,.liv textarea:focus{border-color:var(--k-blue)}
.liv .etat{margin:10px 0 0;font-size:14px;color:rgba(255,255,255,.85);min-height:18px}
.vide{padding:30px;text-align:center;color:var(--k-tx3);background:var(--k-pan);border:1px dashed var(--k-line2);border-radius:var(--k-r)}
.charge{color:var(--k-tx3);padding:20px 0}
.p.fait{padding:16px 22px}
.p.fait .nom{font-size:18px}
@media(max-width:720px){
  .w{padding:0 16px 70px}
  .hero h1{font-size:36px}
  .p .act{margin-left:0;width:100%}
}
</style>
</head>
<body class="k">
<header class="k-top"><span class="k-top-t">Espace stratégiste</span><a class="k-btn2" href="/_deconnexion">Se déconnecter</a></header>
<div class="w">
  <div class="hero">
    <h1>Tes <em>projets</em></h1>
    <p>Les fiches à remplir, avec leur échéance. Pour chaque projet : le dossier de production, le brief du client quand il y en a (livraisons suivantes et abonnements), et la fiche.</p>
  </div>
  <div class="titre"><h2>À faire</h2><span class="nb" id="nbF">0</span></div>
  <div class="liste" id="afaire"><div class="charge">Chargement de tes projets…</div></div>
  <div class="titre"><h2>Envoyés</h2><span class="nb gris" id="nbL">0</span></div>
  <div class="liste" id="faits"></div>
</div>
<script>
const $ = id => document.getElementById(id);
const esc = t => String(t == null ? '' : t).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const lire = async u => { try { const r = await fetch(u + '?t=' + Date.now(), {cache: 'no-store'}); return r.ok ? await r.json() : null; } catch (e) { return null; } };
const H = 3600000;
const quand = ms => new Date(ms).toLocaleString('fr-FR', {weekday: 'long', day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit', timeZone: 'Europe/Paris'});
const jour = ms => new Date(ms).toLocaleDateString('fr-FR', {day: 'numeric', month: 'long', timeZone: 'Europe/Paris'});

function badge(t){
  if (!t) return '';
  const reste = t - Date.now();
  if (reste < 0) return '<span class="pill retard">En retard</span>';
  if (reste < 12 * H) return '<span class="pill urgent">Dans ' + Math.max(1, Math.round(reste / H)) + ' h</span>';
  const j = Math.round(reste / 24 / H);
  return '<span class="pill">Dans ' + j + ' jour' + (j > 1 ? 's' : '') + '</span>';
}

function nomDe(x){
  const l = x.d.livraison;
  return esc(x.d.brand_name || x.dossier) + (l && l.sur > 1 ? ' <span style="color:var(--k-tx3);font-weight:500">· livraison ' + l.n + '/' + l.sur + '</span>' : '');
}

/* 15/10 : le nom du brief selon le type de projet :
   sur-mesure -> « Brief de la livraison 2/4 », abonnement -> « Brief de novembre » */
function nomBrief(d){
  const M=["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
  const l=d&&d.livraison;
  if(d&&(d.abonnement||(l&&l.type==="abonnement"))){
    const m=M[new Date(Date.parse(d.deadline||"")||Date.now()).getMonth()];
    return "Brief "+(/^[aeiouâ]/.test(m)?"d'":"de ")+m;
  }
  if(l&&l.sur>1) return "Brief de la livraison "+l.n+"/"+l.sur;
  return "Brief du client";
}
function carte(x){
  const d = x.d, dossierProd = (d.livraison && d.livraison.projet) || x.dossier;
  return '<article class="p"><div class="l1"><div><h3 class="nom">' + nomDe(x) + '</h3>' +
    '<div class="meta"><b>' + esc(d.nb_creas || '?') + ' créas</b>' + (x.strat ? ' · fiche avant ' + esc(quand(x.strat)) : '') + '</div></div>' +
    badge(x.strat) +
    '<div class="act"><a class="k-btn2" href="../' + esc(dossierProd) + '/" target="_blank" rel="noopener">Dossier</a>' +
    (x.retour ? '<a class="k-btn2" href="../retours/?projet=' + encodeURIComponent(x.dossier) + '" target="_blank" rel="noopener">' + esc(nomBrief(x.d)) + '</a>' : '') +
    '<a class="k-btn" href="../fiche/?projet=' + encodeURIComponent(x.dossier) + '" target="_blank" rel="noopener">Ouvrir la fiche</a></div></div></article>';
}

function carteFaite(x){
  const etat = x.livre ? 'Livré ✓' : 'En production';
  return '<article class="p fait"><div class="l1"><div><h3 class="nom">' + nomDe(x) + '</h3>' +
    '<div class="meta">' + esc(x.d.nb_creas || '?') + ' créas · fiche envoyée le ' + esc(jour(x.envoyeLe)) + '</div></div>' +
    '<span class="pill ' + (x.livre ? 'ok' : '') + '">' + etat + '</span>' +
    '<div class="act"><a class="k-btn2" href="../' + esc(x.dossier) + '/creas/" target="_blank" rel="noopener">Voir les visuels</a></div></div></article>';
}

async function go(){
  let projets = await lire('../projets.json');
  if (!Array.isArray(projets)) projets = [];
  const tous = (await Promise.all(projets.filter(p => p && p.dossier && !/^TEST_/i.test(p.dossier)).map(async p => {
    const [d, envois, liv, retour] = await Promise.all(['donnees', 'envois', 'livraison', 'retour'].map(f => lire('../' + p.dossier + '/' + f + '.json')));
    if (!d) return null;
    const e = (envois && Array.isArray(envois.envois)) ? envois.envois : [];
    return {dossier: p.dossier, d, envoye: e.length > 0, envoyeLe: e.length ? Date.parse(e[e.length - 1]) : 0,
            livre: !!(liv && liv.livre), retour: !!(retour && retour.dossier === p.dossier),
            strat: Date.parse(d.deadline_strategiste || '') || 0};
  }))).filter(Boolean);

  const afaire = tous.filter(x => !x.envoye).sort((a, b) => (a.strat || 9e15) - (b.strat || 9e15));
  const faits = tous.filter(x => x.envoye).sort((a, b) => b.envoyeLe - a.envoyeLe).slice(0, 20);
  $('nbF').textContent = afaire.length; $('nbL').textContent = faits.length;
  $('afaire').innerHTML = afaire.length ? afaire.map(carte).join('') : '<div class="vide">Aucune fiche à remplir pour le moment. Les nouveaux projets apparaissent ici dès que leur dossier est prêt.</div>';
  $('faits').innerHTML = faits.length ? faits.map(carteFaite).join('') : '<div class="vide">Aucune fiche envoyée pour le moment.</div>';
}
go();
</script>
</body>
</html>
