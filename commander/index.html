<!DOCTYPE html>
<html lang="fr" data-clair>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Votre pack · Kreative</title>
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png"><link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png"><link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/ui/app.css">
<script src="/ui/app.js"></script>
<script src="/ui/panier.js"></script>
<style>
/* Le panier public de la landing : on choisit ses options, puis le paiement Stripe s'ouvre.
   Après le paiement : la page /merci-<pack>, et l'espace client est créé tout seul. */
body{background:var(--bg)}
.pub{max-width:1180px;margin:0 auto;padding:0 22px 60px}
.pub-tete{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:22px 0 30px}
.pub-tete img{height:28px;display:block}
.pub-tete a.site{font-size:13.5px;color:var(--tx2);text-decoration:none;display:inline-flex;align-items:center;gap:7px;padding:9px 14px;border:1px solid var(--line);border-radius:999px;background:var(--panel)}
.pub-tete a.site:hover{color:var(--ink);border-color:var(--line2)}
.pub-tete a.site svg{width:15px;height:15px}
.pub .ph{animation:pub-monte .45s ease-out both}
.pub .config{animation:pub-monte .5s ease-out .06s both}
.pub-pied{display:flex;justify-content:center;gap:8px 22px;flex-wrap:wrap;margin-top:30px;font-size:13px;color:var(--tx3)}
.pub-pied span{display:inline-flex;align-items:center;gap:7px}
.pub-pied svg{width:15px;height:15px;color:var(--green)}
@keyframes pub-monte{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media(max-width:860px){.pub .config{grid-template-columns:1fr}.pub .recap{position:static}}
</style>
</head>
<body>
<main class="pub">
  <header class="pub-tete"><a href="https://kreativeads.fr/"><img src="/ui/logo-kreative-noir.png" alt="Kreative"></a>
    <a class="site" href="https://kreativeads.fr/#offres" id="retour-site"></a></header>
  <div id="panier"><div class="chargement">Chargement…</div></div>
  <div class="pub-pied" id="pied"></div>
</main>
<script>
(async () => {
  const PN = K.panier, i = K.i;
  const pack = (location.pathname.match(/\/commander\/(starter|growth|scale|custom)/) || [])[1] || 'growth';
  document.getElementById('retour-site').innerHTML = i.gauche + 'Retour au site';
  try { PN.d = await (await fetch('/api/offres')).json(); }
  catch (e) { document.getElementById('panier').innerHTML = '<div class="card"><div class="vide">Les offres ne se chargent pas. Réessayez dans un instant.</div></div>'; return; }
  PN.choisir(pack, 'unique');   // sur le site : paiement en une fois
  const q = new URLSearchParams(location.search);
  if (q.get('creas')) PN.cfg.nb = Math.min(PN.d.custom.max, Math.max(PN.d.custom.min, Number(q.get('creas')) || PN.d.custom.min));
  const rendre = () => {
    document.getElementById('panier').innerHTML = PN.html({ formules: false, bouton: { texte: 'Commander' } });
    document.title = (pack === 'custom' ? 'Votre pack Custom' : 'Pack ' + PN.d.packs[pack].nom) + ' · Kreative';
    PN.brancher({
      // le bouton mène directement à la page de paiement Stripe, au montant exact
      surChange: (corps, lien) => {
        lien.removeAttribute('target');
        lien.href = '/payer/' + corps.pack + '?' + new URLSearchParams(Object.assign({}, corps.pack === 'custom' ? { creas: corps.nb_creas } : {}, corps.options.length ? { options: corps.options.join(',') } : {})).toString();
      },
      surClic: (corps, lien) => { lien.classList.add('envoi'); lien.textContent = 'Ouverture du paiement…'; }
    });
  };
  rendre();
  document.getElementById('pied').innerHTML = '<span>Paiement unique, sans engagement.</span><span>' + i.coche + 'Satisfait ou remboursé</span>';
})();
</script>
</body>
</html>
