<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Espace Wimmov · Kreative</title>
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png"><link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png"><link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/client/manifest.webmanifest">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kreative"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="/ui/app.css">

<style>
.nav a{white-space:nowrap}
.w-retour{padding:20px 22px}
.w-retour + .w-retour{margin-top:12px}
.w-retour .tete{display:flex;justify-content:space-between;gap:12px;align-items:baseline;flex-wrap:wrap}
.w-retour .tete b{font-size:15px}
.w-retour .texte{font-size:14px;line-height:1.6;margin-top:10px;white-space:pre-wrap;color:var(--tx)}
.w-liens{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.w-liens a{font-size:13.5px;color:var(--blue-tx);word-break:break-all}
.w-pieces{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.w-piece{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 12px;border:1px solid var(--line);border-radius:10px;font-size:13px;color:var(--tx);background:#fff;max-width:100%}
.w-piece span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:260px}
.w-piece svg{width:15px;height:15px;flex:none;color:var(--tx3)}
.w-piece button{border:0;background:none;padding:0;margin-left:2px;cursor:pointer;color:var(--tx3);display:flex}
.w-lien-l{display:flex;gap:8px;margin-top:8px}
.w-lien-l .in{flex:1}
.w-offres{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-top:6px}
.w-offre{padding:22px 20px;display:flex;flex-direction:column}
.w-offre h3{font-size:16px}
.w-offre .prix{font:700 30px/1 var(--titre);letter-spacing:-.04em;margin-top:14px}
.w-offre .unit{font-size:12.5px;color:var(--tx3);margin-top:8px;line-height:1.5;flex:1}
.w-offre .btn{margin-top:16px}
.w-offre .in{margin-top:12px}
.w-mail{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.w-mail:first-child{border-top:0}
.w-lien-acces{display:flex;gap:8px;align-items:center;margin-top:12px}
.w-lien-acces .in{flex:1;font-size:13px;color:var(--tx2)}
@media(max-width:1000px){.w-offres{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:560px){.w-offres{grid-template-columns:1fr}.w-lien-acces{flex-direction:column;align-items:stretch}}
@media(max-width:700px){.w-mc{display:none}}
</style>
</head>
<body>
<div id="racine"><div class="chargement">Chargement de votre espace…</div></div>
<script>
/* ============================================================
   ESPACE WIMMOV (client à part, contrat spécial)
   Servi à la place de l'espace client classique quand le client
   connecté a une adresse @wimmov.com. Rien ici n'est utilisé par
   les autres clients. Les données : /api/client/wimmov.
   - les créatives livrées chaque semaine (lecture et téléchargement) ;
   - « Vos retours de la semaine » : texte, liens, fichiers, pour Kreative ;
   - des créatives en plus, à ses anciens prix ;
   - les factures ; l'accès partagé avec son media buyer.
   ============================================================ */
const WA = 'https://api.whatsapp.com/send?phone=33756921042';
const { i, esc } = K;
let D = null;
const params = new URLSearchParams(location.search);
if (params.get('client')) K.suffixe = '?client=' + encodeURIComponent(params.get('client'));
const wa = t => WA + '&text=' + encodeURIComponent(t);
// espace partagé (Hugo, le media buyer) : on salue avec le nom que la personne a tapé sur cet appareil
const prenom = () => (D.client.contact || '').trim().split(/\s+/)[0] || D.client.marque;
const MOIS = ['janvier', 'février', 'mars', 'avril', 'mai', 'juin', 'juillet', 'août', 'septembre', 'octobre', 'novembre', 'décembre'];
const moisDe = ms => { const d = new Date(ms || Date.now()); return MOIS[d.getMonth()] + ' ' + d.getFullYear(); };
const nomCmd = c => c.formule === 'mensuel' ? 'Abonnement · ' + moisDe(c.cree_le) : 'Créatives en plus · ' + c.nb_creas + ' créatives';
const livrees = () => D.commandes.flatMap(c => c.livraisons.map(l => ({ ...l, c }))).sort((a, b) => (b.envoye_le || 0) - (a.envoye_le || 0));
const urlPhoto = () => D.client.photo_le ? '/api/client/photo' + (K.suffixe ? K.suffixe + '&' : '?') + 'v=' + D.client.photo_le : '';
const payees = F => (F || []).filter(f => f.statut === 'payee' || f.source !== 'stripe');
const taille = n => n > 1e6 ? (n / 1e6).toFixed(1).replace('.', ',') + ' Mo' : Math.max(1, Math.round((n || 0) / 1e3)) + ' ko';
async function recharger() { D = await K.api('/api/client/wimmov'); K.rendre(); }

function conf() {
  return {
    sections: [{ titre: 'Espace ' + D.client.marque, liens: [
      { id: 'accueil', texte: 'Accueil', icone: 'accueil', href: '#/' },
      { id: 'creatives', texte: 'Créatives', icone: 'image', href: '#/creatives', nb: livrees().length || '' },
      { id: 'retours', texte: 'Retours de la semaine', icone: 'message', href: '#/retours' },
      { id: 'commander', texte: 'Commander des créatives', icone: 'panier', href: '#/commander' },
      { id: 'factures', texte: 'Factures', icone: 'recu', href: '#/factures', nb: payees(D.factures).length || '' }
    ] }, { titre: 'Kreative', liens: [
      { id: 'acces', texte: 'Partager l\'accès', icone: 'gens', href: '#/acces' },
      { id: 'contact', texte: 'Nous contacter', icone: 'telephone', href: '#/contact' }
    ].concat(APP.mobile() ? [{ id: 'app', texte: 'App', icone: 'telephone', href: '#/app' }] : []) }],
    qui: { nom: D.client.marque, role: D.client.contact || D.client.email || 'Client', tuile: true, photo: urlPhoto() },
    menu: ['<a href="#/acces">' + i.gens + 'Partager l\'accès</a>'],
    sansTheme: true,
    sortie: D.apercu ? '/admin/wimmov.html' : '/client/sortie'
  };
}
function apercu() {
  return D.apercu ? '<div class="bandeau amb"><span class="ic">' + i.oeil + '</span><div><b>Aperçu de l\'espace de ' + esc(D.client.marque) + '</b>' +
    '<small>Vous voyez exactement ce que voit votre client. Rien de ce que vous faites ici ne lui est envoyé.</small></div>' +
    '<a class="btn btn-sm" href="/admin/wimmov.html">Retour à l\'admin</a></div>' : '';
}

// ---------- ACCUEIL ----------
function ecranAccueil() {
  const L = livrees(), recente = L.find(l => l.envoye_le && Date.now() - l.envoye_le < 8 * 864e5);
  const mois = D.commandes.find(c => c.formule === 'mensuel' && c.statut !== 'annule');
  const dernier = (D.retours || [])[0];
  let h = apercu();
  if (recente) h += '<div class="bandeau"><span class="ic">' + i.image + '</span><div><b>Livraison ' + recente.n + ' disponible</b><small>' + esc(nomCmd(recente.c)) + '</small></div>' +
    '<a class="btn" href="#/creatives/' + esc(recente.c.id) + '/' + recente.n + '">Voir les créatives</a></div>';
  h += '<div class="ph"><div><h1>Bonjour, ' + esc(prenom()) + '</h1><p>L\'espace ' + esc(D.client.marque) + ' chez Kreative : vos créatives de la semaine, vos retours, vos commandes.</p></div></div>';
  const envoyees = mois ? mois.livraisons.filter(l => l.statut !== 'brouillon').length : 0;
  h += '<div class="grid g2">' +
    '<a class="card kpi lien-kpi" href="#/creatives"><div class="lab">Ce mois-ci</div><div class="v s">' + (mois ? envoyees + ' livraison' + (envoyees > 1 ? 's' : '') + ' sur ' + D.contrat.livraisons_mois : 'Pas encore') + '</div>' +
      '<div class="d">' + (mois ? (mois.livrees || 0) + ' créatives livrées sur ' + mois.nb_creas : 'Votre mois démarre au prochain paiement') + '</div></a>' +
    '<a class="card kpi lien-kpi" href="#/retours"><div class="lab">Retours de la semaine</div><div class="v s">' + (dernier ? esc(K.date(dernier.envoye_le, { year: undefined })) : 'Pas encore') + '</div>' +
      '<div class="d">' + (dernier ? 'Derniers retours envoyés' : 'Déposez-les pour la prochaine livraison') + '</div></a></div>';
  h += '<div class="sec"><div><h2>Dernières livraisons</h2><p>Chaque livraison s\'ouvre en un clic, tous les fichiers se téléchargent.</p></div>' + (L.length ? '<a class="btn btn-g btn-sm" href="#/creatives">Toutes les créatives</a>' : '') + '</div>';
  h += L.length ? tableLivraisons(L.slice(0, 6)) : '<div class="card"><div class="vide">' + i.image + 'Vos créatives arrivent ici chaque semaine.</div></div>';
  h += '<div class="card pad" style="margin-top:14px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap"><div><h3 style="font-size:16px">Vos retours de la semaine</h3>' +
    '<p class="muted" style="font-size:13.5px;margin-top:4px;max-width:560px">Ce qui a fonctionné, ce que vous voulez pour la semaine prochaine, vos rapports et vos fichiers : tout arrive directement chez Kreative.</p></div>' +
    '<a class="btn btn-p" href="#/retours">' + i.message + 'Déposer mes retours</a></div>';
  return h;
}
function tableLivraisons(L) {
  return '<div class="card"><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Livraison</th><th class="num w-mc">Créatives</th><th class="w-mc">Envoyée le</th><th></th></tr></thead><tbody>' +
    L.map(l => '<tr class="clic" onclick="location.hash=\'#/creatives/' + esc(l.c.id) + '/' + l.n + '\'"><td><b>Livraison ' + l.n + (l.version > 1 ? ' · version ' + l.version : '') + '</b><span class="sub">' + esc(nomCmd(l.c)) + '</span></td>' +
      '<td class="num w-mc">' + (l.creatives || 0) + '</td><td class="w-mc">' + (l.envoye_le ? esc(K.dateHeure(l.envoye_le)) : 'Pas de date') + '</td>' +
      '<td class="fin"><span class="btn btn-s btn-sm">' + i.image + 'Voir</span></td></tr>').join('') + '</tbody></table></div></div>';
}

// ---------- CRÉATIVES ----------
// comme l'espace client normal : la liste des livraisons, puis une livraison avec « Retour »
const CR = { commande: null, donnees: null };
async function chargerCreatives(id) {
  CR.commande = id;
  try { CR.donnees = await K.api('/api/client/commandes/' + id + '/creatives'); } catch (e) { CR.donnees = { livraisons: [], erreur: e.message }; }
  K.rendre();
}
const numero = d => Number((String(d).match(/_L(\d+)$/) || [])[1]) || 1;
// la dernière version de la livraison n de la commande c
function livraisonVue(p) {
  const c = D.commandes.find(x => x.id === p[0]);
  if (!c || !CR.donnees || CR.commande !== c.id) return { c };
  const n = Number(p[1]) || 1;
  const l = CR.donnees.livraisons.filter(x => numero(x.dossier) === n).sort((x, y) => y.version - x.version)[0];
  return { c, l, n };
}
// comme l'espace client normal : un tableau de toutes les livraisons, un clic ouvre la livraison
function livraisonOuverte(p) {
  if (!CR.donnees) return null;
  const n = Number(p[1]) || 1, par = {};
  for (const l of CR.donnees.livraisons) if (numero(l.dossier) === n && (!par.l || par.l.version < l.version)) par.l = l;
  return par.l || null;
}
function ecranCreatives(p) {
  if (!p[0]) {
    const L = livrees();
    let h = apercu() + '<div class="ph"><div><h1>Vos créatives</h1><p>Toutes vos livraisons. Chaque livraison s\'ouvre en un clic, tous les fichiers se téléchargent.</p></div></div>';
    return h + (L.length ? tableLivraisons(L) : '<div class="card"><div class="vide">' + i.image + 'Vos créatives arrivent ici chaque semaine.</div></div>');
  }
  const c = D.commandes.find(x => x.id === p[0]);
  let h = apercu() + '<a class="retour" href="#/creatives">' + i.gauche + 'Retour à mes créatives</a>';
  if (!c) return h + '<div class="card"><div class="vide">Livraison introuvable.</div></div>';
  if (CR.commande !== c.id) { CR.commande = c.id; CR.donnees = null; setTimeout(() => chargerCreatives(c.id), 0); }
  if (!CR.donnees) return h + '<div class="card"><div class="vide">Chargement de vos créatives…</div></div>';
  const l = livraisonOuverte(p);
  if (!l) return h + '<div class="card"><div class="vide">Livraison introuvable.</div></div>';
  return h + K.rv.grille(l, { mode: 'client', sansCompte: true, titre: nomCmd(c) + ' · Livraison ' + numero(l.dossier),
    sousTitre: l.fichiers.length + ' fichier' + (l.fichiers.length > 1 ? 's' : '') + ' · envoyée le ' + K.date(l.envoye_le, { month: 'long' }) });
}
function brancherCreatives(p) {
  const c = D.commandes.find(x => x.id === p[0]), l = c && livraisonOuverte(p);
  if (!l) return;
  K.rv.brancher(l, { mode: 'client', nomZip: (D.client.marque + '-' + nomCmd(c) + '-livraison-' + numero(l.dossier)).replace(/[^A-Za-z0-9]+/g, '-'), rendre: () => K.rendre(),
    auteur: D.client.contact || D.client.marque, peutCommenter: () => false, peutApprouver: () => false, api: {} });
}

// ---------- RETOURS DE LA SEMAINE ----------
const R = { id: null, pieces: [], envois: [], liens: [''], texte: '' };
function ecranRetours() {
  let h = apercu() + '<div class="ph"><div><h1>Vos retours de la semaine</h1><p>Ce qui a fonctionné, ce que vous voulez pour la semaine prochaine, vos rapports et vos fichiers. Tout arrive directement chez Kreative.</p></div></div>';
  h += '<div class="grid g2" style="align-items:start"><div class="card pad">' +
    '<div class="champ"><label for="w-texte">Vos retours</label><textarea class="in" id="w-texte" rows="7" placeholder="Les créatives qui ont le mieux marché, celles à ne pas refaire, les nouveautés, ce que vous voulez voir la semaine prochaine…">' + esc(R.texte) + '</textarea></div>' +
    '<div class="champ"><label>Liens</label><div class="aide" style="margin:0 0 4px">Votre rapport créatif, un dossier partagé, une page produit…</div><div id="w-liens">' +
      R.liens.map((x, n) => '<div class="w-lien-l"><input class="in" data-lien="' + n + '" value="' + esc(x) + '" placeholder="https://…">' + (R.liens.length > 1 ? '<button class="btn btn-g btn-sm" data-lien-x="' + n + '" aria-label="Retirer ce lien">' + i.croix + '</button>' : '') + '</div>').join('') +
      '</div><button class="btn btn-s btn-sm" id="w-lien-plus" style="margin-top:8px">' + i.plus + 'Ajouter un lien</button></div>' +
    '<div class="champ"><label>Fichiers</label><div class="depot" id="w-depot">' + i.telecharger + '<b>Glissez vos fichiers ici, ou cliquez pour les choisir</b><small>Créatives qui ont marché, rapports, images, vidéos, PDF… Jusqu\'à 30 fichiers.</small>' +
      '<input type="file" id="w-fichiers" multiple hidden></div>' +
      '<div class="envois" id="w-envois">' + R.envois.map(e => '<div class="envoi-l"><span>' + esc(e.nom) + '</span><div class="barre' + (e.ok ? ' g' : '') + '"><i style="width:' + e.pc + '%"></i></div><small class="muted">' + esc(e.etat) + '</small></div>').join('') + '</div>' +
      (R.pieces.length ? '<div class="w-pieces">' + R.pieces.map(p => '<span class="w-piece">' + i.doc + '<span title="' + esc(p.nom) + '">' + esc(p.nom) + '</span><button data-piece-x="' + esc(p.id) + '" aria-label="Retirer ' + esc(p.nom) + '">' + i.croix + '</button></span>').join('') + '</div>' : '') + '</div>' +
    '<button class="btn btn-p btn-bloc btn-lg" id="w-envoyer">' + i.envoi + 'Envoyer à Kreative</button></div>';
  h += '<div><div class="sec" style="margin-top:0"><div><h2>Déjà envoyés</h2><p>Vos retours des semaines précédentes.</p></div></div>' +
    ((D.retours || []).length ? D.retours.map(carteRetour).join('') : '<div class="card"><div class="vide">' + i.message + 'Vos retours apparaîtront ici.</div></div>') + '</div></div>';
  return h;
}
function carteRetour(r) {
  return '<div class="card w-retour"><div class="tete"><b>' + esc(K.dateHeure(r.envoye_le)) + '</b></div>' +
    (r.texte ? '<div class="texte">' + esc(r.texte) + '</div>' : '') +
    (r.liens && r.liens.length ? '<div class="w-liens">' + r.liens.map(l => '<a href="' + esc(l) + '" target="_blank" rel="noopener">' + esc(l) + '</a>').join('') + '</div>' : '') +
    (r.pieces && r.pieces.length ? '<div class="w-pieces">' + r.pieces.map(p => '<a class="w-piece" href="' + esc(p.url) + '?dl=1' + (K.suffixe ? '&' + K.suffixe.slice(1) : '') + '">' + i.telecharger + '<span>' + esc(p.nom) + '</span><small class="muted">' + taille(p.taille) + '</small></a>').join('') + '</div>' : '') + '</div>';
}
const lireForm = () => {
  const t = document.getElementById('w-texte'); if (t) R.texte = t.value;
  document.querySelectorAll('[data-lien]').forEach(x => { R.liens[Number(x.dataset.lien)] = x.value; });
};
async function brouillon() {
  if (!R.id) R.id = (await K.api('/api/client/wimmov/retours', { methode: 'POST' })).id;
  return R.id;
}
function envoyerPiece(id, f, suivi) {
  return new Promise((ok, ko) => {
    const x = new XMLHttpRequest();
    x.open('PUT', '/api/client/wimmov/pieces?retour=' + encodeURIComponent(id) + '&nom=' + encodeURIComponent(f.name));
    x.setRequestHeader('Content-Type', f.type || 'application/octet-stream');
    x.upload.onprogress = e => { if (e.lengthComputable) suivi(Math.round(e.loaded * 100 / e.total)); };
    x.onload = () => { let r = {}; try { r = JSON.parse(x.responseText); } catch (e) {} if (x.status < 300) ok(r); else ko(new Error(r.erreur || 'Envoi impossible (' + x.status + ')')); };
    x.onerror = () => ko(new Error('Connexion perdue'));
    x.send(f);
  });
}
async function deposer(fichiers) {
  if (D.apercu) return K.toast('Aperçu : rien n\'est envoyé à la place du client.');
  lireForm();
  let id; try { id = await brouillon(); } catch (e) { return K.toast(e.message); }
  const file = Array.from(fichiers).map(f => ({ f, nom: f.name, pc: 0, etat: 'en attente', ok: false }));
  R.envois = file; K.rendre();
  const maj = () => { const z = document.getElementById('w-envois'); if (z) z.innerHTML = R.envois.map(e => '<div class="envoi-l"><span>' + esc(e.nom) + '</span><div class="barre' + (e.ok ? ' g' : '') + '"><i style="width:' + e.pc + '%"></i></div><small class="muted">' + esc(e.etat) + '</small></div>').join(''); };
  let n = 0;
  const travailleur = async () => {
    while (n < file.length) {
      const e = file[n++];
      try { const r = await envoyerPiece(id, e.f, pc => { e.pc = pc; e.etat = pc + ' %'; maj(); }); e.pc = 100; e.ok = true; e.etat = 'Ajouté'; R.pieces.push({ id: r.id, nom: r.nom || e.nom }); }
      catch (err) { e.etat = err.message; }
      maj();
    }
  };
  await Promise.all([travailleur(), travailleur()]);
  R.envois = file.filter(e => !e.ok);
  K.rendre();
}
function brancherRetours() {
  const zone = document.getElementById('w-depot'), champ = document.getElementById('w-fichiers');
  if (zone && champ) {
    zone.onclick = () => champ.click();
    champ.onchange = () => deposer(champ.files);
    zone.ondragover = e => { e.preventDefault(); zone.classList.add('survol'); };
    zone.ondragleave = () => zone.classList.remove('survol');
    zone.ondrop = e => { e.preventDefault(); zone.classList.remove('survol'); deposer(e.dataTransfer.files); };
  }
  const plus = document.getElementById('w-lien-plus');
  if (plus) plus.onclick = () => { lireForm(); R.liens.push(''); K.rendre(); const d = document.querySelectorAll('[data-lien]'); if (d.length) d[d.length - 1].focus(); };
  document.querySelectorAll('[data-lien-x]').forEach(b => b.onclick = () => { lireForm(); R.liens.splice(Number(b.dataset.lienX), 1); K.rendre(); });
  document.querySelectorAll('[data-piece-x]').forEach(b => b.onclick = async () => {
    lireForm();
    try { await K.api('/api/client/wimmov/pieces/' + b.dataset.pieceX, { methode: 'DELETE' }); R.pieces = R.pieces.filter(p => p.id !== b.dataset.pieceX); K.rendre(); } catch (e) { K.toast(e.message); }
  });
  const env = document.getElementById('w-envoyer');
  if (env) env.onclick = async () => {
    if (D.apercu) return K.toast('Aperçu : rien n\'est envoyé à la place du client.');
    lireForm();
    const liens = R.liens.map(x => x.trim()).filter(Boolean);
    if (!R.texte.trim() && !liens.length && !R.pieces.length) return K.toast('Écrivez vos retours, ajoutez un lien ou un fichier.');
    if (R.envois.some(e => !e.ok && e.etat === 'en attente')) return K.toast('Attendez la fin de l\'envoi des fichiers.');
    env.disabled = true;
    try {
      const id = await brouillon();
      await K.api('/api/client/wimmov/retours/' + id + '/envoyer', { methode: 'POST', corps: { texte: R.texte, liens } });
      Object.assign(R, { id: null, pieces: [], envois: [], liens: [''], texte: '' });
      K.toast('Merci, vos retours sont chez Kreative'); await recharger();
    } catch (e) { K.toast(e.message); env.disabled = false; }
  };
}

// ---------- COMMANDER DES CRÉATIVES : ses tarifs ----------
// sur mesure : de 30 à 100 créatives, par 5 (comme le Custom du site)
const LIBRE = { min: 30, max: 100, pas: 5 };
let libre = LIBRE.min;
function ecranCommander() {
  const T = D.tarifs;
  let h = apercu() + '<div class="ph"><div><h1>Commander des créatives</h1><p>Si vous manquez de créatives, vous pouvez en prendre en plus.</p></div></div>';
  h += '<div class="w-offres">' + T.packs.map(p => '<div class="card w-offre"><h3>Pack ' + esc(p.nom) + '</h3><div class="prix">' + K.euros(p.prix) + '</div>' +
    '<div class="unit">' + p.nb + ' créatives · ' + Math.floor(p.prix / p.nb) + ' € la créative<br>Livrées en 1:1, 4:5 et 9:16</div>' +
    '<button class="btn btn-p btn-bloc" data-commander="' + p.nb + '">Commander</button></div>').join('') +
    '<div class="card w-offre"><h3>Pack Sur mesure</h3><div class="prix">Sur mesure</div>' +
    '<div class="unit">De ' + LIBRE.min + ' à ' + LIBRE.max + ' créatives · ' + T.au_dela + ' € la créative<br>Livrées en 1:1, 4:5 et 9:16</div>' +
    '<select class="in" id="w-libre" aria-label="Nombre de créatives">' + Array.from({ length: (LIBRE.max - LIBRE.min) / LIBRE.pas + 1 }, (_, n) => LIBRE.min + n * LIBRE.pas)
      .map(n => '<option value="' + n + '"' + (n === libre ? ' selected' : '') + '>' + n + ' créatives</option>').join('') + '</select>' +
    '<button class="btn btn-p btn-bloc" data-commander="libre">Commander</button></div></div>';
  h += '<p class="muted" style="font-size:13px;margin-top:18px">Après le paiement, dites-nous ce que vous voulez dans « Vos retours de la semaine ». La page de paiement Stripe s\'ouvre dans un nouvel onglet.</p>';
  return h;
}
function brancherCommander() {
  const champ = document.getElementById('w-libre');
  if (champ) champ.onchange = () => { libre = Number(champ.value) || LIBRE.min; };
  document.querySelectorAll('[data-commander]').forEach(b => b.onclick = async () => {
    if (D.apercu) return K.toast('Aperçu : le paiement s\'ouvre seulement pour le client.');
    const nb = b.dataset.commander === 'libre' ? libre : Number(b.dataset.commander);
    if (b.dataset.commander === 'libre' && (nb < LIBRE.min || nb > LIBRE.max || nb % LIBRE.pas)) return K.toast('Entre ' + LIBRE.min + ' et ' + LIBRE.max + ' créatives.');
    const w = window.open('', '_blank');
    b.disabled = true;
    try {
      const r = await K.api('/api/client/wimmov/paiement', { methode: 'POST', corps: { nb_creas: nb } });
      if (w) { try { w.opener = null; } catch (x) {} w.location.href = r.url; } else location.href = r.url;
      suivrePaiement();
    } catch (e) { if (w) w.close(); K.toast(e.message); }
    b.disabled = false;
  });
}
let suivi = null;
function suivrePaiement() {
  if (suivi) return;
  const avant = D.commandes.length;
  suivi = async () => {
    if (document.visibilityState !== 'visible') return;
    try { const d = await K.api('/api/client/wimmov'); if (d.commandes.length > avant) { D = d; document.removeEventListener('visibilitychange', suivi); window.removeEventListener('focus', suivi); suivi = null; location.hash = '#/merci'; } } catch (e) {}
  };
  document.addEventListener('visibilitychange', suivi); window.addEventListener('focus', suivi);
}
function ecranMerci() {
  return '<div class="card pad" style="max-width:620px;margin:40px auto;text-align:center;padding:40px 32px"><div class="avis-fen" style="padding:0"><div class="rond">' + i.coche + '</div>' +
    '<h2>Paiement reçu, merci</h2><p>Vos créatives en plus sont ajoutées à votre espace. Dites-nous ce que vous voulez dans vos retours de la semaine.</p></div>' +
    '<div style="display:flex;gap:10px;justify-content:center;margin-top:24px;flex-wrap:wrap"><a class="btn btn-p btn-lg" href="#/retours">Déposer mes retours</a><a class="btn btn-s btn-lg" href="#/">Accueil</a></div></div>';
}

// ---------- FACTURES ----------
function ecranFactures() {
  const F = payees(D.factures);
  let h = apercu() + '<div class="ph"><div><h1>Factures</h1><p>Toutes vos factures Kreative, à télécharger quand vous le souhaitez.</p></div></div>';
  if (!F.length) return h + '<div class="card"><div class="vide">' + i.recu + 'Vos factures apparaissent ici après chaque paiement.</div></div>';
  return h + '<div class="card"><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Facture</th><th class="w-mc">Objet</th><th class="num">Montant</th><th class="w-mc">Date</th><th></th></tr></thead><tbody>' +
    F.map(f => { const c = D.commandes.find(x => x.id === f.commande_id);
      return '<tr><td><b>' + esc(f.numero || 'Facture') + '</b></td><td class="w-mc">' + (c ? esc(nomCmd(c)) : '') + '</td><td class="num">' + K.euros(f.montant) + '</td><td class="w-mc">' + esc(K.date(f.emise_le)) + '</td>' +
        '<td class="fin"><button class="btn btn-s btn-sm" data-fdl="' + esc(f.id) + '">' + i.telecharger + 'Télécharger</button></td></tr>'; }).join('') + '</tbody></table></div></div>';
}
document.addEventListener('click', e => {
  const b = e.target.closest && e.target.closest('[data-fdl]');
  if (!b || !D) return;
  const f = (D.factures || []).find(x => x.id === b.dataset.fdl); if (!f) return;
  const c = D.commandes.find(x => x.id === f.commande_id);
  K.telechargerFacture(f, { client: D.client.marque, email: D.client.email, commande: c ? c.ref : '', projet: c ? nomCmd(c) : '' });
});

// ---------- PARTAGER L'ACCÈS ----------
function ecranAcces() {
  let h = apercu() + '<div class="ph"><div><h1>Partager l\'accès</h1><p>Toute votre équipe utilise le même espace ' + esc(D.client.marque) + '. Ajoutez l\'adresse de votre media buyer : il reçoit le lien de l\'espace, puis chaque nouvelle livraison par email.</p></div></div>';
  h += '<div class="grid g2" style="align-items:start"><div class="card pad"><h3 style="font-size:16px">Qui reçoit les emails</h3>' +
    '<div style="margin-top:10px"><div class="w-mail"><div><b>' + esc(D.client.contact || D.client.marque) + '</b><div class="muted" style="font-size:13px">' + esc(D.client.email) + '</div></div><span class="pill"><i></i>Compte principal</span></div>' +
    (D.emails || []).map(m => '<div class="w-mail"><div>' + esc(m) + '</div><button class="btn btn-g btn-sm" data-mail-x="' + esc(m) + '">Retirer</button></div>').join('') + '</div>' +
    '<div class="champ" style="margin-top:14px"><label for="w-mail">Ajouter une adresse</label><div class="w-lien-l" style="margin-top:0"><input class="in" id="w-mail" type="email" placeholder="mediabuyer@wimmov.com"><button class="btn btn-p" id="w-mail-ok">Ajouter</button></div>' +
    '<div class="aide">La personne reçoit tout de suite le lien de l\'espace.</div></div></div>' +
    '<div class="card pad"><h3 style="font-size:16px">Le lien de l\'espace</h3><p class="muted" style="font-size:13.5px;margin-top:6px">Il ouvre l\'espace ' + esc(D.client.marque) + ' sur ordinateur et sur téléphone. Partagez-le seulement avec votre équipe.</p>' +
    '<div class="w-lien-acces"><input class="in" readonly value="' + esc(D.lien) + '"><button class="btn btn-s" id="w-copier">' + i.copier + 'Copier le lien</button></div>' +
    '<p class="muted" style="font-size:13px;margin-top:18px">Une question sur votre abonnement ? <a href="' + wa('Bonjour Kreative, une question sur l\'abonnement ' + D.client.marque + ' : ') + '" target="_blank" rel="noopener" style="color:var(--blue-tx)">Écrivez-nous sur WhatsApp</a>.</p></div></div>';
  return h;
}
function brancherAcces() {
  const enregistrer = async emails => {
    if (D.apercu) return K.toast('Aperçu : rien n\'est enregistré à la place du client.');
    try { const r = await K.api('/api/client/wimmov/acces', { methode: 'PATCH', corps: { emails } }); D.emails = r.emails; K.rendre(); return true; } catch (e) { K.toast(e.message); return false; }
  };
  const ok = document.getElementById('w-mail-ok'), champ = document.getElementById('w-mail');
  if (ok) ok.onclick = async () => {
    const m = champ.value.trim().toLowerCase();
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(m)) return K.toast('Adresse email invalide.');
    if (await enregistrer((D.emails || []).concat(m))) K.toast('Lien de l\'espace envoyé à ' + m);
  };
  if (champ) champ.onkeydown = e => { if (e.key === 'Enter') ok.click(); };
  document.querySelectorAll('[data-mail-x]').forEach(b => b.onclick = async () => {
    if (!await K.confirmer('Retirer cette adresse ?', b.dataset.mailX + ' ne recevra plus les emails de l\'espace. Le lien de l\'espace reste le même.', 'Retirer')) return;
    if (await enregistrer((D.emails || []).filter(x => x !== b.dataset.mailX))) K.toast('Adresse retirée');
  });
  const c = document.getElementById('w-copier');
  if (c) c.onclick = () => K.copier(D.lien, 'Lien copié');
}

// ---------- CONTACT ----------
function ecranContact() {
  return apercu() + '<div class="ph"><div><h1>Nous contacter</h1><p>Une question, une urgence, un ajustement : on répond sur WhatsApp, en général dans l\'heure.</p></div></div>' +
    '<div class="card pad" style="max-width:640px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap">' +
    '<div><div class="lab">WhatsApp</div><b style="font-size:18px">07 56 92 10 42</b></div>' +
    '<a class="btn btn-lg btn-wa" href="' + wa('Bonjour Kreative, ') + '" target="_blank" rel="noopener">Nous écrire</a></div>';
}

// ---------- L'APP : l'espace sur l'écran d'accueil du téléphone (comme les autres clients) ----------
const APP = {
  installation: null,
  mobile: () => matchMedia('(max-width: 860px)').matches || /iPhone|iPad|Android/i.test(navigator.userAgent),
  installee: () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true,
  ios: () => /iPhone|iPad|iPod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1),
  safari: () => /Safari/i.test(navigator.userAgent) && !/CriOS|FxiOS|EdgiOS|GSA|Instagram|FBAN|FBAV/i.test(navigator.userAgent)
};
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); APP.installation = e; if (/^#\/app/.test(location.hash)) K.rendre(); });
window.addEventListener('appinstalled', () => { APP.installation = null; K.toast('L\'app Kreative est sur votre écran d\'accueil'); if (/^#\/app/.test(location.hash)) K.rendre(); });
function ecranApp() {
  const ios = APP.ios();
  let h = apercu() + '<div class="ph"><div><h1>L\'app Kreative</h1><p>Votre espace ' + esc(D.client.marque) + ' sur l\'écran d\'accueil de votre téléphone, en un geste.</p></div></div>';
  h += '<div class="card app-carte"><div class="app-icone"><img src="/app-icon-192.png" alt=""><span>Kreative</span></div>';
  if (APP.installee()) {
    h += '<div class="app-etat ok">' + i.coche + 'L\'app est installée</div>';
  } else if (APP.installation) {
    h += '<button class="btn btn-d btn-bloc btn-lg" id="app-installer">Installer l\'app</button><p class="aide">Gratuit, sans passer par un store. Elle s\'ajoute à votre écran d\'accueil.</p>';
  } else if (ios && !APP.safari()) {
    h += '<p class="aide fort">Ouvrez cette page dans Safari pour installer l\'app.</p><button class="btn btn-s btn-bloc" id="app-copier">' + i.copier + 'Copier le lien</button>';
  } else if (ios) {
    h += '<button class="btn btn-d btn-bloc btn-lg" id="app-guide">Installer l\'app</button><p class="aide">Gratuit, sans passer par l\'App Store.</p>' +
      '<ol class="app-etapes" id="app-etapes" hidden><li><span>' + i.partager + '</span><div>Touchez <b>Partager</b>, en bas de Safari</div></li><li><span>' + i.plusCarre + '</span><div>Choisissez <b>Sur l\'écran d\'accueil</b></div></li><li><span>' + i.coche + '</span><div>Touchez <b>Ajouter</b> : l\'app Kreative est installée</div></li></ol>';
  } else {
    h += '<p class="aide fort">Ouvrez votre espace sur votre téléphone pour installer l\'app.</p><p class="aide">Sur Android : le menu ⋮ de Chrome, puis « Installer l\'application ».</p>';
  }
  return h + '</div>';
}
function brancherApp() {
  if (APP.installee() && !D.apercu && !sessionStorage.getItem('k-app')) { try { sessionStorage.setItem('k-app', '1'); } catch (e) {} K.api('/api/client/app', { methode: 'POST' }).catch(() => {}); }
  const b = document.getElementById('app-installer');
  if (b) b.onclick = async () => { const p = APP.installation; if (!p) return; p.prompt(); const r = await p.userChoice.catch(() => ({})); APP.installation = null; if (r.outcome === 'accepted') K.toast('C\'est installé !'); K.rendre(); };
  const g = document.getElementById('app-guide');
  if (g) g.onclick = () => { const e = document.getElementById('app-etapes'); e.hidden = false; g.hidden = true; e.classList.add('montre'); };
  const c = document.getElementById('app-copier');
  if (c) c.onclick = () => K.copier(location.origin + '/client/#/app', 'Lien copié : collez-le dans Safari');
}

// ---------- RENDU ----------
const ECRANS = {
  '': ['accueil', 'accueil', () => ['Accueil'], () => ecranAccueil()],
  creatives: ['creatives', 'image', p => p[0] ? ['Créatives', 'Livraison ' + (Number(p[1]) || 1)] : ['Créatives'], p => ecranCreatives(p), p => brancherCreatives(p)],
  retours: ['retours', 'message', () => ['Retours de la semaine'], () => ecranRetours(), () => brancherRetours()],
  commander: ['commander', 'panier', () => ['Commander des créatives'], () => ecranCommander(), () => brancherCommander()],
  merci: ['commander', 'panier', () => ['Commander des créatives', 'Paiement reçu'], () => ecranMerci()],
  factures: ['factures', 'recu', () => ['Factures'], () => ecranFactures()],
  acces: ['acces', 'gens', () => ['Partager l\'accès'], () => ecranAcces(), () => brancherAcces()],
  contact: ['contact', 'telephone', () => ['Nous contacter'], () => ecranContact()],
  app: ['app', 'telephone', () => ['App'], () => ecranApp(), () => brancherApp()]
};
K.rendre = () => {
  if (!D) return;
  const r = K.route(), e = ECRANS[r.ecran] || ECRANS[''];
  const c = conf();
  document.getElementById('racine').innerHTML = K.coquille(c, e[0], K.ariane(e[1], ...e[2](r.params)), e[3](r.params), false);
  K.brancherCoquille(c);
  if (e[4]) e[4](r.params);
  document.title = 'Espace ' + D.client.marque + ' · Kreative';
};
// l'espace suit les livraisons en direct (relu toutes les 30 s), jamais pendant une saisie ou la visionneuse
function suivreEnDirect() {
  const sig = d => JSON.stringify([d.commandes, d.retours, d.factures, d.emails]);
  let derniere = sig(D);
  const verifier = async () => {
    if (document.visibilityState !== 'visible' || !D) return;
    const a = document.activeElement;
    if (a && (a.tagName === 'TEXTAREA' || a.tagName === 'INPUT') || document.querySelector('#k-fen, .rv-v, .app.menu-ouvert') || R.envois.length) return;
    let d; try { d = await K.api('/api/client/wimmov'); } catch (e) { return; }
    const s = sig(d); if (s === derniere) return;
    derniere = s; D = d; CR.commande = null; const y = window.scrollY; K.rendre(); window.scrollTo(0, y);
  };
  setInterval(verifier, 30000);
  document.addEventListener('visibilitychange', verifier);
}
if ('serviceWorker' in navigator) navigator.serviceWorker.register('/client/sw.js', { scope: '/client/' }).catch(() => {});
(async () => {
  try { D = await K.api('/api/client/wimmov'); K.rendre(); suivreEnDirect(); }
  catch (e) {
    if (e.statut === 401) location.href = '/client/connexion';
    else document.getElementById('racine').innerHTML = '<div class="chargement">Impossible de charger votre espace. ' + esc(e.message) + '</div>';
  }
})();
</script>
