<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Admin · Kreative</title>
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="stylesheet" href="/ui/app.css">
<script src="/ui/app.js"></script>
</head>
<body>
<div id="racine"><div class="chargement">Chargement…</div></div>
<script>
/* ============================================================
   ADMIN KREATIVE
   Vue d'ensemble · Clients (fiche, lien d'accès, commandes) ·
   Commandes · Projets en production (suivi, kanban) · Dossiers ·
   Équipe. Les clients et commandes vivent dans la base Cloudflare,
   la production dans le dépôt (projets.json, donnees.json...).
   ============================================================ */
const { i, esc } = K;
const S = { clients: null, commandes: null, resume: null, prod: null, dossiers: null, equipe: null, moi: null,
  factures: null, vueProjets: 'suivi', filtreClients: 'tous', chClients: '', chDossiers: '', filtreCmd: 'en_cours', filtreFact: 'toutes' };
const PACKS_NOMS = { starter: 'Starter', growth: 'Growth', scale: 'Scale', custom: 'Custom' };
// le statut d'une commande, le même que celui que voit le client
const STATUTS = { brief: ['Confirmée · brief attendu', 'a'], production: ['En production', 'b'], livre: ['Livré · à valider', 'g'], revisions: ['Retouches en cours', 'v'], valide: ['Validé', 'g'], annule: ['Annulée', ''] };
const FACT = { payee: ['Payée', 'g'], ouverte: ['En attente', 'a'], impayee: ['Impayée', 'r'], annulee: ['Annulée', ''] };
const FORMULES = { unique: 'Commande unique', mensuel: 'Abonnement mensuel' };
const H = 36e5;
// la tuile d'un client : sa photo s'il en a mis une, sinon ses initiales
const tuileClient = (c, lg) => c && c.photo_le ? '<span class="tuile img' + (lg ? ' lg' : '') + '"><img src="/api/admin/clients/' + esc(c.id) + '/photo?v=' + c.photo_le + '" alt=""></span>' : K.tuile(c.marque, lg);

// ---------- chargements ----------
async function charger(quoi, force) {
  const t = {
    clients: () => K.api('/api/admin/clients'),
    commandes: () => K.api('/api/admin/commandes'),
    resume: () => K.api('/api/admin/resume'),
    equipe: () => K.api('/api/admin/equipe'),
    factures: () => K.api('/api/admin/factures'),
    moi: () => K.lireJson('/_moi'),
    dossiers: async () => { const l = await K.lireJson('/_admin/dossiers.json'); return Array.isArray(l) ? l.sort((a, b) => (/^TEST|^REDO/.test(a) - /^TEST|^REDO/.test(b)) || a.localeCompare(b)) : []; },
    prod: chargerProduction
  };
  if (force || S[quoi] == null) {
    try { S[quoi] = await t[quoi](); }
    catch (e) { S[quoi] = quoi === 'resume' ? {} : []; if (e.statut !== 401) K.toast(e.message); }
  }
  return S[quoi];
}
async function chargerProduction() {
  let projets = await K.lireJson('/projets.json');
  if (!Array.isArray(projets)) projets = [];
  return (await Promise.all(projets.filter(p => p && p.dossier).map(async p => {
    const [d, envois, liv, retour] = await Promise.all(['donnees', 'envois', 'livraison', 'retour'].map(f => K.lireJson('/' + p.dossier + '/' + f + '.json')));
    if (!d) return null;
    const ev = (envois && Array.isArray(envois.envois)) ? envois.envois : [];
    const livs = (liv && liv.livraisons) || [], der = livs[livs.length - 1] || {};
    return { dossier: p.dossier, d, retour: !!retour, envoye: ev.length > 0, envoyeLe: Date.parse(typeof ev[ev.length - 1] === 'string' ? ev[ev.length - 1] : (ev[ev.length - 1] || {}).le || '') || 0,
      livre: !!(liv && liv.livre), livreLe: Date.parse(der.le || '') || 0, zip: der.lien || '',
      strat: Date.parse(d.deadline_strategiste || '') || 0, desi: Date.parse(d.deadline_designer || '') || 0, client: Date.parse(d.deadline || '') || 0 };
  }))).filter(Boolean);
}
function rafraichir(...quoi) { quoi.forEach(q => { S[q] = null; }); K.rendre(); }

// ---------- production : état d'un projet ----------
function commandeDe(x) { return (S.commandes || []).find(c => c.dossier === x.dossier || (x.d.livraison && c.dossier === x.d.livraison.projet)); }
function etatProd(x) {
  const now = Date.now(), c = commandeDe(x);
  const auClient = c && ['livre', 'revisions', 'valide'].includes(c.statut);
  if (auClient) return { cle: 'client', texte: STATUTS[c.statut][0], pill: STATUTS[c.statut][1] };
  if (x.livre) return { cle: 'livrer', texte: 'À livrer au client', pill: 'n' };
  if (!x.envoye) return x.strat && x.strat < now ? { cle: 'strat', texte: 'Fiche en retard', pill: 'r', retard: true } : { cle: 'strat', texte: 'Chez le stratégiste', pill: 'b' };
  return x.desi && x.desi < now ? { cle: 'desi', texte: 'Designer en retard', pill: 'r', retard: true } : { cle: 'desi', texte: 'Chez le designer', pill: 'v' };
}
function etapesProd(x) {
  const c = commandeDe(x);
  return [{ t: 'Dossier prêt', f: true }, { t: 'Fiche envoyée', f: x.envoye }, { t: 'Visuels générés', f: x.envoye }, { t: 'Livré par le designer', f: x.livre },
    { t: 'Livré au client', f: !!(c && ['livre', 'revisions', 'valide'].includes(c.statut)) }, { t: 'Validé', f: !!(c && c.statut === 'valide') }];
}
const nomProjet = x => (x.d.brand_name || x.dossier) + (x.d.livraison && x.d.livraison.sur > 1 ? ' · livraison ' + x.d.livraison.n + '/' + x.d.livraison.sur : '');
function liensProjet(x, petit) {
  const prod = (x.d.livraison && x.d.livraison.projet) || x.dossier, b = [];
  const l = (h, t, cls) => '<a class="btn ' + (cls || 'btn-s') + ' btn-sm" href="' + esc(h) + '" target="_blank" rel="noopener">' + t + '</a>';
  b.push(l('/' + prod + '/', 'Dossier'));
  b.push(l('/fiche/?projet=' + encodeURIComponent(x.dossier), 'Fiche'));
  if (x.retour) b.push(l('/retours/?projet=' + encodeURIComponent(x.dossier), esc(nomBrief(x.d))));
  if (x.envoye) { b.push(l('/' + x.dossier + '/creas/', 'Aperçu')); if (!petit) b.push(l('/' + x.dossier + '/creas/telecharger.html', 'Téléchargement')); }
  if (x.zip) b.push(l(x.zip, 'Créas livrées', 'btn-p'));
  return '<div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end">' + b.join('') + '</div>';
}
function nomBrief(d) {
  const M = ['janvier', 'février', 'mars', 'avril', 'mai', 'juin', 'juillet', 'août', 'septembre', 'octobre', 'novembre', 'décembre'];
  const l = d && d.livraison;
  if (d && (d.abonnement || (l && l.type === 'abonnement'))) { const m = M[new Date(Date.parse(d.deadline || '') || Date.now()).getMonth()]; return 'Brief ' + (/^[aeiouâ]/.test(m) ? "d'" : 'de ') + m; }
  if (l && l.sur > 1) return 'Brief de la livraison ' + l.n + '/' + l.sur;
  return 'Brief du client';
}

// ---------- coquille ----------
function conf() {
  const enCours = (S.prod || []).filter(x => etatProd(x).cle !== 'client').length;
  return {
    cta: { texte: 'Nouveau client', href: '#/clients/nouveau' },
    sections: [
      { titre: 'Espace', liens: [{ id: 'accueil', texte: 'Vue d\'ensemble', icone: 'accueil', href: '#/' }] },
      { titre: 'Commercial', liens: [
        { id: 'clients', texte: 'Clients', icone: 'gens', href: '#/clients', nb: S.clients ? S.clients.length || '' : '' },
        { id: 'commandes', texte: 'Commandes', icone: 'sac', href: '#/commandes' },
        { id: 'factures', texte: 'Factures', icone: 'recu', href: '#/factures' }] },
      { titre: 'Production', liens: [
        { id: 'projets', texte: 'Projets', icone: 'dossier', href: '#/projets', nb: enCours || '' },
        { id: 'dossiers', texte: 'Tous les dossiers', icone: 'calques', href: '#/dossiers' },
        { id: 'fiche', texte: 'Fiche créas', icone: 'doc', href: '/fiche/' },
        { id: 'strat', texte: 'Espace stratégiste', icone: 'ampoule', href: '/strategiste/' },
        { id: 'desi', texte: 'Designer space', icone: 'pinceau', href: '/designer/' }] },
      { titre: 'Équipe', liens: [{ id: 'equipe', texte: 'Équipe', icone: 'bouclier', href: '#/equipe' }] }
    ],
    qui: { nom: S.moi && S.moi.nom ? S.moi.nom.charAt(0).toUpperCase() + S.moi.nom.slice(1) : 'Admin', role: 'Fondateur · admin' },
    sortie: '/_deconnexion',
    recherche: rechercher
  };
}
function rechercher(q) {
  q = q.toLowerCase(); if (!q) return [];
  const r = [];
  (S.clients || []).filter(c => (c.marque + ' ' + (c.contact || '') + ' ' + (c.email || '')).toLowerCase().includes(q)).slice(0, 5)
    .forEach(c => r.push({ texte: c.marque, type: 'Client', icone: 'gens', href: '#/clients/' + c.id }));
  (S.commandes || []).filter(c => ('#' + c.ref + ' ' + c.marque + ' ' + K.nomCommande(c)).toLowerCase().includes(q)).slice(0, 4)
    .forEach(c => r.push({ texte: c.marque + ' · ' + K.nomCommande(c), type: 'Commande #' + c.ref, icone: 'sac', href: '#/clients/' + c.client_id }));
  (S.prod || []).filter(x => (nomProjet(x) + ' ' + x.dossier).toLowerCase().includes(q)).slice(0, 4)
    .forEach(x => r.push({ texte: nomProjet(x), type: 'Projet', icone: 'dossier', href: '/' + ((x.d.livraison && x.d.livraison.projet) || x.dossier) + '/', ext: true }));
  (S.dossiers || []).filter(d => d.toLowerCase().includes(q)).slice(0, 4)
    .forEach(d => r.push({ texte: d, type: 'Dossier', icone: 'calques', href: '/' + d + '/', ext: true }));
  return r.slice(0, 12);
}

// ---------- VUE D'ENSEMBLE ----------
function ecranAccueil() {
  const R = S.resume || {}, P = S.prod || [];
  const etats = P.map(x => ({ x, e: etatProd(x) }));
  const nb = cle => etats.filter(y => y.e.cle === cle).length;
  const retards = etats.filter(y => y.e.retard);
  const briefs = (S.commandes || []).filter(c => c.statut === 'brief');
  const aLivrer = etats.filter(y => y.e.cle === 'livrer');
  let h = '<div class="ph"><div><h1>Vue d\'ensemble</h1><p>' + esc(K.date(Date.now(), { weekday: 'long', year: undefined })) + ' · tout ce qui se passe chez Kreative.</p></div>' +
    '<div class="act"><a class="btn btn-s" href="#/clients/nouveau">' + i.plus + 'Nouveau client</a><a class="btn btn-p" href="#/projets">' + i.dossier + 'Voir la production</a></div></div>';
  h += '<div class="grid g4">' +
    kpi('Clients', R.clients != null ? R.clients : '·', (S.clients || []).filter(c => c.nb_commandes > 0).length + ' avec au moins une commande') +
    kpi('Commandes en cours', R.en_cours != null ? R.en_cours : '·', briefs.length + ' en attente de brief') +
    kpi('Abonnements mensuels', R.mensuels != null ? R.mensuels : '·', 'commandes en formule mensuelle') +
    (R.stripe ? kpi('Encaissé sur 30 jours', K.euros(R.encaisse_30j || 0), R.impayees ? R.impayees + ' facture' + (R.impayees > 1 ? 's' : '') + ' en attente' : 'factures Stripe payées')
      : kpi('Chiffre sur 30 jours', K.euros(R.ca_30j || 0), 'commandes enregistrées')) + '</div>';
  h += '<div class="grid g4" style="margin-top:14px">' +
    kpi('Chez le stratégiste', nb('strat'), 'fiches à remplir') + kpi('Chez le designer', nb('desi'), 'visuels à livrer') +
    kpi('À livrer au client', aLivrer.length, 'livrés par le designer') + kpi('En retard', retards.length, retards.length ? 'à surveiller' : 'tout est dans les temps', retards.length ? 'color:var(--red)' : '') + '</div>';
  const todo = [
    ...retards.map(y => ({ t: nomProjet(y.x), s: y.e.texte, ic: 'horloge', p: 'r', href: '/fiche/?projet=' + y.x.dossier, ext: 1 })),
    ...aLivrer.map(y => ({ t: nomProjet(y.x), s: 'Livré par le designer, à envoyer au client', ic: 'envoi', p: 'n', href: y.x.zip || '/' + y.x.dossier + '/creas/', ext: 1 })),
    ...briefs.map(c => ({ t: c.marque + ' · ' + K.nomCommande(c), s: 'Commande confirmée, brief attendu depuis ' + K.ilya(c.cree_le).replace('il y a ', ''), ic: 'doc', p: 'a', href: '#/clients/' + c.client_id })),
    ...(S.commandes || []).filter(c => c.statut === 'livre').map(c => ({ t: c.marque + ' · ' + K.nomCommande(c), s: 'Livré, en attente de validation du client', ic: 'coche', p: 'g', href: '#/clients/' + c.client_id }))
  ];
  h += '<div class="grid g2" style="margin-top:14px"><div class="card"><div class="card-h"><h3>À traiter</h3><span class="pill">' + todo.length + '</span></div><div class="card-b liste">' +
    (todo.length ? todo.slice(0, 8).map(t => '<a class="li" style="text-decoration:none" href="' + esc(t.href) + '"' + (t.ext ? ' target="_blank" rel="noopener"' : '') + '><span class="ic">' + i[t.ic] + '</span><span class="t"><b style="font-weight:600">' + esc(t.t) + '</b><span class="sub muted" style="display:block;font-size:12.5px">' + esc(t.s) + '</span></span>' + i.fleche.replace('<svg', '<svg width="15" height="15" style="opacity:.35"') + '</a>').join('')
      : '<div class="vide">' + i.coche + 'Rien d\'urgent. Tout roule.</div>') + '</div></div>' +
    '<div class="card"><div class="card-h"><h3>Derniers clients</h3><a class="btn btn-g btn-sm" href="#/clients">Tous</a></div><div class="card-b liste">' +
    ((S.clients || []).length ? S.clients.slice(0, 6).map(c => '<a class="li" style="text-decoration:none" href="#/clients/' + esc(c.id) + '">' + tuileClient(c) + '<span class="t"><b style="font-weight:600">' + esc(c.marque) + '</b><span class="muted" style="display:block;font-size:12.5px">' + esc(c.contact || c.email || '') + '</span></span><small>' + (c.nb_commandes ? c.nb_commandes + ' commande' + (c.nb_commandes > 1 ? 's' : '') : 'aucune commande') + '</small></a>').join('')
      : '<div class="vide">' + i.gens + 'Aucun client. <a href="#/clients/nouveau">Créer le premier</a></div>') + '</div></div></div>';
  return h;
}
const kpi = (l, v, d, st) => '<div class="card kpi"><div class="lab">' + esc(l) + '</div><div class="v"' + (st ? ' style="' + st + '"' : '') + '>' + esc(v) + '</div><div class="d">' + esc(d) + '</div></div>';

// ---------- PROJETS ----------
function ecranProjets() {
  const P = (S.prod || []).slice();
  const vue = S.vueProjets;
  const enCours = P.filter(x => etatProd(x).cle !== 'client').length;
  let h = '<div class="ph"><div><h1>Projets</h1><p>' + enCours + ' en production · ' + (P.length - enCours) + ' livrés au client</p></div>' +
    '<div class="act"><div class="onglets">' + [['kanban', 'Kanban', 'colonnes'], ['suivi', 'Suivi', 'coche'], ['tableau', 'Tableau', 'liste']].map(v =>
      '<button class="' + (vue === v[0] ? 'on' : '') + '" onclick="S.vueProjets=\'' + v[0] + '\';K.rendre()">' + i[v[2]] + v[1] + '</button>').join('') + '</div>' +
    '<button class="btn btn-s" onclick="rafraichir(\'prod\')">' + i.rafraichir + 'Actualiser</button></div></div>';
  if (!P.length) return h + '<div class="card"><div class="vide">' + i.dossier + 'Aucun projet en production. Ils apparaissent ici dès que n8n crée leur dossier.</div></div>';
  const tri = (a, b) => ((!a.envoye ? a.strat : a.desi) || a.client || 9e15) - ((!b.envoye ? b.strat : b.desi) || b.client || 9e15);
  if (vue === 'kanban') {
    const cols = [['strat', 'Chez le stratégiste', 'var(--blue)'], ['desi', 'Chez le designer', 'var(--violet)'], ['livrer', 'À livrer au client', 'var(--ink)'], ['client', 'Chez le client', 'var(--green)']];
    return h + '<div class="kanban">' + cols.map(([cle, t, coul]) => {
      const l = P.filter(x => etatProd(x).cle === cle).sort(tri);
      return '<div class="col"><div class="col-h"><i style="background:' + coul + '"></i>' + t + '<span class="c">' + l.length + '</span></div>' +
        (l.map(x => {
          const e = etatProd(x), et = etapesProd(x), pc = Math.round(et.filter(y => y.f).length * 100 / et.length);
          const ech = !x.envoye ? x.strat : !x.livre ? x.desi : x.client;
          return '<a class="kcarte" href="/' + esc((x.d.livraison && x.d.livraison.projet) || x.dossier) + '/" target="_blank" rel="noopener"><b>' + esc(nomProjet(x)) + '</b><small>' + esc(x.d.nb_creas || '?') + ' créas · ' + esc(x.d.pack || '') + '</small>' +
            '<div class="barre"><i style="width:' + pc + '%"></i></div><div class="pied"><span>' + i.horloge.replace('<svg', '<svg width="13" height="13" style="vertical-align:-2px"') + ' ' + (ech ? esc(K.dateHeure(ech)) : '·') + '</span>' +
            (e.retard ? '<span class="pill r">Retard</span>' : '') + '</div></a>';
        }).join('') || '<div class="vide" style="padding:18px 8px">Aucun</div>') + '</div>';
    }).join('') + '</div>';
  }
  if (vue === 'tableau') {
    return h + '<div class="grid" style="gap:12px">' + P.sort(tri).map(x => {
      const e = etatProd(x), c = commandeDe(x);
      return '<div class="card pad" style="padding:18px 20px"><div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap">' + K.tuile(x.d.brand_name || x.dossier) +
        '<div style="min-width:0"><b style="font-size:16px;font-family:var(--titre)">' + esc(nomProjet(x)) + '</b><div class="muted" style="font-size:12.5px">' + esc(x.dossier) + ' · ' + esc(x.d.nb_creas || '?') + ' créas' + (c ? ' · #' + esc(c.ref) : '') + '</div></div>' +
        '<span class="pill ' + e.pill + '"><i></i>' + esc(e.texte) + '</span><div style="margin-left:auto">' + liensProjet(x) + '</div></div>' +
        '<div class="grid g3" style="margin-top:14px;gap:10px">' + [['Fiche du stratégiste', x.strat, x.envoye, x.envoyeLe], ['Rendu du designer', x.desi, x.livre, x.livreLe], ['Livraison client', x.client, false, 0]].map(([t, ms, f, le]) =>
          '<div style="border:1px solid var(--line);border-radius:11px;padding:10px 12px;background:var(--soft)"><div class="lab">' + t + '</div><div style="font-size:13.5px;margin-top:3px;' + (f ? 'color:var(--green)' : ms && ms < Date.now() ? 'color:var(--red);font-weight:600' : '') + '">' +
          (f ? '✓ ' + (le ? esc(K.dateHeure(le)) : 'fait') : ms ? esc(K.dateHeure(ms)) : '·') + '</div></div>').join('') + '</div></div>';
    }).join('') + '</div>';
  }
  // suivi
  const cols = ['Dossier prêt', 'Fiche envoyée', 'Visuels générés', 'Livré designer', 'Livré client', 'Validé'];
  return h + '<div class="card"><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Client</th>' + cols.map(c => '<th style="text-align:center">' + c + '</th>').join('') +
    '<th>Avancement</th><th>Échéance</th><th></th></tr></thead><tbody>' + P.sort(tri).map(x => {
      const et = etapesProd(x), pc = Math.round(et.filter(y => y.f).length * 100 / et.length), e = etatProd(x);
      const ech = !x.envoye ? x.strat : !x.livre ? x.desi : x.client;
      return '<tr><td><b>' + esc(nomProjet(x)) + '</b><span class="sub">' + esc(x.dossier) + '</span></td>' +
        et.map(y => '<td style="text-align:center"><input type="checkbox" disabled' + (y.f ? ' checked' : '') + '></td>').join('') +
        '<td style="min-width:120px"><div class="barre' + (pc === 100 ? ' g' : '') + '"><i style="width:' + pc + '%"></i></div><span class="sub">' + pc + ' %</span></td>' +
        '<td style="white-space:nowrap"><span class="pill ' + e.pill + '">' + esc(e.texte) + '</span><span class="sub">' + (ech ? esc(K.dateHeure(ech)) : '') + '</span></td>' +
        '<td class="fin">' + liensProjet(x, true) + '</td></tr>';
    }).join('') + '</tbody></table></div></div>';
}

// ---------- CLIENTS ----------
function ecranClients() {
  const C = S.clients || [], q = S.chClients.toLowerCase(), f = S.filtreClients;
  const relancer = c => c.nb_commandes > 0 && c.derniere_commande && Date.now() - c.derniere_commande > 21 * 864e5;
  const filtres = { tous: () => true, actifs: c => c.nb_commandes > 0, sans: c => !c.nb_commandes, relancer, bloques: c => c.statut === 'bloque' };
  const liste = C.filter(filtres[f]).filter(c => !q || (c.marque + ' ' + (c.contact || '') + ' ' + (c.email || '')).toLowerCase().includes(q));
  const chip = (k, t, coul) => '<button class="chip' + (f === k ? ' on' : '') + '" onclick="S.filtreClients=\'' + k + '\';K.rendre()">' + (coul ? '<i style="color:' + coul + '"></i>' : '') + t + '<span class="c">' + C.filter(filtres[k]).length + '</span></button>';
  let h = '<div class="ph"><div><h1>Clients</h1><p>' + C.length + ' compte' + (C.length > 1 ? 's' : '') + ' · ' + C.reduce((s, c) => s + c.nb_commandes, 0) + ' commandes au total</p></div>' +
    '<div class="act"><button class="btn btn-s" onclick="exporterClients()">' + i.telecharger + 'Exporter</button><a class="btn btn-p" href="#/clients/nouveau">' + i.plus + 'Ajouter un client</a></div></div>';

  K.csv('kreative-commandes', ['Référence', 'Projet', 'Client', 'Contact', 'Email', 'Pack', 'Formule', 'Créatives', 'Prix (€)', 'Statut', 'Dossier', 'Commandée le', 'Brief reçu le', 'Livrée le', 'Payée en ligne'],
    C.map(c => [c.ref, K.nomCommande(c), c.marque, c.contact, c.email, PACKS_NOMS[c.pack] || c.pack, FORMULES[c.formule] || c.formule, c.nb_creas, c.prix, (STATUTS[c.statut] || [c.statut])[0], c.dossier,
      K.date(c.cree_le), c.brief_le ? K.date(c.brief_le) : '', c.livre_le ? K.date(c.livre_le) : '', c.stripe_session ? 'oui' : 'non']));
  K.toast(C.length + ' commandes exportées');
}

// ---------- FACTURES ----------
function tableFactures(F, avecClient) {
  return '<table class="tbl"><thead><tr><th>Facture</th>' + (avecClient ? '<th>Client</th>' : '') + '<th>Projet</th><th class="num">Montant</th><th>Statut</th><th>Émise le</th><th></th></tr></thead><tbody>' +
    F.map(f => {
      const k = (S.commandes || []).find(c => c.id === f.commande_id) || (FICHE && FICHE.commandes.find(c => c.id === f.commande_id));
      const st = FACT[f.statut] || [f.statut || '·', ''];
      return '<tr><td><b>' + esc(f.numero || 'Sans numéro') + '</b><span class="sub">' + (f.source === 'stripe' ? 'Stripe' : 'Ajoutée à la main') + '</span></td>' +
        (avecClient ? '<td>' + (f.marque ? '<div class="nom">' + K.tuile(f.marque) + '<a href="#/clients/' + esc(f.client_id) + '"><b>' + esc(f.marque) + '</b></a></div>' : '<span class="muted">' + esc(f.email || 'non rattachée') + '</span>') + '</td>' : '') +
        '<td>' + (k ? esc(K.nomCommande(k)) + '<span class="sub">#' + esc(k.ref) + '</span>' : '<span class="muted">·</span>') + '</td>' +
        '<td class="num">' + K.euros(f.montant) + '</td><td><span class="pill ' + st[1] + '"><i></i>' + esc(st[0]) + '</span></td><td>' + esc(K.date(f.emise_le)) + '</td>' +
        '<td class="fin"><div style="display:flex;gap:6px;justify-content:flex-end">' +
        (f.pdf ? '<a class="btn btn-s btn-sm" href="' + esc(f.pdf) + '" target="_blank" rel="noopener">' + i.telecharger + 'PDF</a>' : '') +
        (f.lien ? '<a class="btn btn-g btn-sm" href="' + esc(f.lien) + '" target="_blank" rel="noopener">Voir</a>' : '') +
        (f.source !== 'stripe' ? '<button class="btn btn-g btn-sm" data-fsuppr="' + esc(f.id) + '" title="Supprimer">' + i.poubelle + '</button>' : '') + '</div></td></tr>';
    }).join('') + '</tbody></table>';
}
function ecranFactures() {
  const R = S.factures || {}, F = R.factures || [], f = S.filtreFact;
  const filtres = { toutes: () => true, payee: x => x.statut === 'payee', attente: x => ['ouverte', 'impayee'].includes(x.statut), orphelines: x => !x.client_id };
  const chip = (k, t) => '<button class="chip' + (f === k ? ' on' : '') + '" onclick="S.filtreFact=\'' + k + '\';K.rendre()">' + t + '<span class="c">' + F.filter(filtres[k]).length + '</span></button>';
  const payees = F.filter(filtres.payee), mois = Date.now() - 30 * 864e5;
  let h = '<div class="ph"><div><h1>Factures</h1><p>Chaque paiement Stripe crée sa facture, rattachée au client et à son projet.</p></div>' +
    '<div class="act"><button class="btn btn-s" onclick="exporterFactures()">' + i.telecharger + 'Exporter</button><button class="btn btn-p" id="b-facture">' + i.plus + 'Ajouter une facture</button></div></div>';
  if (!R.stripe) h += '<div class="bandeau amb"><span class="ic">' + i.carte + '</span><div><b>Stripe n\'est pas encore branché</b><small>Une fois le webhook Stripe ajouté, les factures arrivent ici toutes seules. En attendant, vous pouvez les ajouter à la main.</small></div></div>';
  h += '<div class="grid g4">' + kpi('Encaissé sur 30 jours', K.euros(payees.filter(x => (x.payee_le || x.emise_le) > mois).reduce((t, x) => t + (x.montant || 0), 0)), payees.filter(x => (x.payee_le || x.emise_le) > mois).length + ' paiements') +
    kpi('Encaissé au total', K.euros(payees.reduce((t, x) => t + (x.montant || 0), 0)), payees.length + ' factures payées') +
    kpi('En attente', K.euros(F.filter(filtres.attente).reduce((t, x) => t + (x.montant || 0), 0)), F.filter(filtres.attente).length + ' facture' + (F.filter(filtres.attente).length > 1 ? 's' : ''), F.filter(filtres.attente).length ? 'color:var(--amber)' : '') +
    kpi('Non rattachées', F.filter(filtres.orphelines).length, 'à relier à un client') + '</div>';
  h += '<div class="filtres" style="margin-top:20px">' + chip('toutes', 'Toutes') + chip('payee', 'Payées') + chip('attente', 'En attente') + chip('orphelines', 'Non rattachées') + '</div>';
  const l = F.filter(filtres[f]);
  return h + (l.length ? '<div class="card"><div class="tbl-wrap">' + tableFactures(l, true) + '</div></div>' : '<div class="card"><div class="vide">' + i.recu + 'Aucune facture ici.</div></div>');
}
function exporterFactures() {
  const F = (S.factures && S.factures.factures) || [];
  K.csv('kreative-factures', ['Numéro', 'Client', 'Projet', 'Référence commande', 'Montant (€)', 'Statut', 'Émise le', 'Payée le', 'Source', 'PDF'],
    F.map(f => { const k = (S.commandes || []).find(c => c.id === f.commande_id); return [f.numero, f.marque || f.email, k ? K.nomCommande(k) : '', f.ref || '', f.montant, (FACT[f.statut] || [f.statut])[0],
      K.date(f.emise_le), f.payee_le ? K.date(f.payee_le) : '', f.source === 'stripe' ? 'Stripe' : 'Manuelle', f.pdf || '']; }));
  K.toast(F.length + ' factures exportées');
}
function brancherFactures() {
  const b = document.getElementById('b-facture');
  if (b) b.onclick = () => {
    const C = S.clients || [];
    const v = K.fenetre('<div class="fen-h"><h2>Ajouter une facture</h2><p>Pour une facture faite hors Stripe. Celles de Stripe arrivent seules.</p></div><div class="fen-b">' +
      '<div class="champ"><label>Client</label><select class="in" id="fa-client"><option value="">Choisir un client</option>' + C.map(c => '<option value="' + esc(c.id) + '">' + esc(c.marque) + '</option>').join('') + '</select></div>' +
      '<div class="champ"><label>Projet</label><select class="in" id="fa-cmd"><option value="">· aucun ·</option></select></div>' +
      '<div class="grid g2" style="gap:12px"><div class="champ"><label>Numéro</label><input class="in" id="fa-num" placeholder="KRV-0012"></div><div class="champ"><label>Montant (€)</label><input class="in" id="fa-mt" type="number" min="0" step="0.01"></div></div>' +
      '<div class="grid g2" style="gap:12px"><div class="champ"><label>Statut</label><select class="in" id="fa-st"><option value="payee">Payée</option><option value="ouverte">En attente</option><option value="impayee">Impayée</option></select></div>' +
      '<div class="champ"><label>Date</label><input class="in" id="fa-date" type="date" value="' + new Date().toISOString().slice(0, 10) + '"></div></div>' +
      '<div class="champ"><label>Lien du PDF</label><input class="in" id="fa-pdf" placeholder="https://…"></div></div>' +
      '<div class="fen-f"><button class="btn btn-s" data-n>Annuler</button><button class="btn btn-p" data-o>Ajouter</button></div>');
    const cl = K.$('#fa-client'), cm = K.$('#fa-cmd');
    cl.onchange = () => {
      cm.innerHTML = '<option value="">· aucun ·</option>' + (S.commandes || []).filter(c => c.client_id === cl.value).map(c => '<option value="' + esc(c.id) + '">' + esc(K.nomCommande(c)) + ' · #' + esc(c.ref) + '</option>').join('');
      if (cm._kMaj) cm._kMaj();
    };
    v.querySelector('[data-n]').onclick = K.fermer;
    v.querySelector('[data-o]').onclick = async e => {
      e.target.disabled = true;
      try {
        await K.api('/api/admin/factures', { methode: 'POST', corps: { client_id: cl.value, commande_id: cm.value, numero: K.$('#fa-num').value, montant: K.$('#fa-mt').value,
          statut: K.$('#fa-st').value, emise_le: Date.parse(K.$('#fa-date').value) || Date.now(), pdf: K.$('#fa-pdf').value } });
        K.fermer(); K.toast('Facture ajoutée'); rafraichir('factures');
      } catch (err) { K.toast(err.message); e.target.disabled = false; }
    };
  };
  brancherSupprFactures();
}
function brancherSupprFactures() {
  document.querySelectorAll('[data-fsuppr]').forEach(x => x.onclick = async () => {
    if (!await K.confirmer('Supprimer cette facture ?', 'Elle disparaît du portail. Rien n\'est changé dans votre comptabilité.', 'Supprimer', true)) return;
    try { await K.api('/api/admin/factures/' + x.dataset.fsuppr, { methode: 'DELETE' }); K.toast('Facture supprimée'); FICHE = null; rafraichir('factures'); } catch (e) { K.toast(e.message); }
  });
}

// ---------- DOSSIERS ----------
function ecranDossiers() {
  const D = S.dossiers || [], q = S.chDossiers.toUpperCase().replace(/\s+/g, '');
  const l = D.filter(d => !q || d.includes(q));
  const MOIS = { '01': 'janv.', '02': 'févr.', '03': 'mars', '04': 'avr.', '05': 'mai', '06': 'juin', '07': 'juil.', '08': 'août', '09': 'sept.', '10': 'oct.', '11': 'nov.', '12': 'déc.' };
  let h = '<div class="ph"><div><h1>Tous les dossiers</h1><p>' + D.length + ' dossiers dans le dépôt, y compris ceux qui ne sont plus en production.</p></div></div>' +
    '<div class="filtres"><div class="champ-r">' + i.chercher + '<input id="ch-dossiers" placeholder="Chercher une marque ou un code…" value="' + esc(S.chDossiers) + '"></div></div>';
  return h + '<div class="card"><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Dossier</th><th>Mois</th><th></th></tr></thead><tbody>' +
    (l.map(d => { const m = d.match(/_(\d{2})_/); return '<tr><td><div class="nom">' + K.tuile(d.split('_')[0]) + '<b>' + esc(d) + '</b>' + (/^TEST|^REDO/.test(d) ? '<span class="pill">test</span>' : '') + '</div></td><td class="muted">' + (m && MOIS[m[1]] || '') + '</td>' +
      '<td class="fin"><div style="display:flex;gap:6px;justify-content:flex-end">' + [['/' + d + '/', 'Dossier'], ['/fiche/?projet=' + d, 'Fiche'], ['/' + d + '/creas/', 'Aperçu']].map(([u, t]) => '<a class="btn btn-s btn-sm" href="' + esc(u) + '" target="_blank" rel="noopener">' + t + '</a>').join('') + '</div></td></tr>'; }).join('')
      || '<tr><td colspan="3"><div class="vide">Aucun dossier.</div></td></tr>') + '</tbody></table></div></div>';
}
function brancherDossiers() {
  const c = document.getElementById('ch-dossiers');
  if (c) c.oninput = () => { S.chDossiers = c.value; const pos = c.selectionStart; K.rendre(); const n = document.getElementById('ch-dossiers'); n.focus(); n.setSelectionRange(pos, pos); };
}

// ---------- ÉQUIPE ----------
function ecranEquipe() {
  const E = S.equipe || [], R = { admin: ['Admin', 'n'], strategiste: ['Stratégiste', 'b'], designer: ['Designer', 'v'] };
  return '<div class="ph"><div><h1>Équipe</h1><p>Les comptes qui ont accès aux espaces internes.</p></div></div>' +
    '<div class="card"><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Personne</th><th>Rôle</th><th>Arrive sur</th><th>Lien à lui envoyer</th></tr></thead><tbody>' +
    E.map(p => '<tr><td><div class="nom"><span class="av">' + esc(K.initiales(p.nom)) + '</span><b>' + esc(p.nom.charAt(0).toUpperCase() + p.nom.slice(1)) + '</b></div></td>' +
      '<td><span class="pill ' + (R[p.role] || ['', ''])[1] + '">' + esc((R[p.role] || [p.role])[0]) + '</span></td><td class="muted">' + esc(p.espace) + '</td>' +
      '<td><div class="lien-box"><code>' + esc(location.origin + p.espace) + '</code><button class="btn btn-s btn-sm" onclick="K.copier(\'' + esc(location.origin + p.espace) + '\',\'Lien copié\')">' + i.copier + '</button></div></td></tr>').join('') +
    '</tbody></table></div></div>' +
    '<div class="note" style="margin-top:16px;max-width:760px">Pour ajouter ou retirer quelqu\'un : Cloudflare → le Worker « espace » → Settings → Variables and Secrets → <b>ACCES</b>. ' +
    'Une entrée par personne : <code>prénom=motdepasse:rôle</code> (admin, strategiste ou designer). Retirer une entrée coupe son accès tout de suite.</div>';
}

// ---------- RENDU ----------
const ECRANS = {
  '': { id: 'accueil', t: 'Vue d\'ensemble', a: 'accueil', b: [], besoins: ['resume', 'clients', 'commandes', 'prod'], f: ecranAccueil },
  factures: { id: 'factures', t: 'Factures', a: 'recu', b: ['Commercial'], besoins: ['factures', 'clients', 'commandes'], f: ecranFactures, ap: brancherFactures },
  projets: { id: 'projets', t: 'Projets', a: 'dossier', b: ['Production'], besoins: ['commandes', 'prod'], f: ecranProjets, large: true },
  clients: { id: 'clients', t: 'Clients', a: 'gens', b: ['Commercial'], besoins: ['clients', 'resume', 'dossiers'], f: p => p[0] === 'nouveau' ? (setTimeout(nouveauClient, 0), ecranClients()) : p[0] ? ecranClient(p[0]) : ecranClients(), ap: p => p[0] && p[0] !== 'nouveau' ? brancherClient() : brancherClients() },
  commandes: { id: 'commandes', t: 'Commandes', a: 'sac', b: ['Commercial'], besoins: ['commandes'], f: ecranCommandes },
  dossiers: { id: 'dossiers', t: 'Tous les dossiers', a: 'calques', b: ['Production'], besoins: ['dossiers'], f: ecranDossiers, ap: brancherDossiers },
  equipe: { id: 'equipe', t: 'Équipe', a: 'bouclier', b: [], besoins: ['equipe'], f: ecranEquipe }
};
let rendu = 0;
K.rendre = async () => {
  const n = ++rendu;
  const r = K.route(), e = ECRANS[r.ecran] || ECRANS[''];
  await charger('moi');
  const enAttente = e.besoins.filter(q => S[q] == null);
  if (enAttente.length && !document.querySelector('.app')) document.getElementById('racine').innerHTML = '<div class="chargement">Chargement…</div>';
  await Promise.all(e.besoins.map(q => charger(q)));
  const contenu = await e.f(r.params);
  if (n !== rendu) return;
  const c = conf();
  const titre = r.ecran === 'clients' && FICHE && r.params[0] === FICHE.client.id ? FICHE.client.marque : e.t;
  document.getElementById('racine').innerHTML = K.coquille(c, e.id, K.ariane(e.a, ...(e.b.length ? e.b : ['Admin']), titre), contenu, e.large);
  K.brancherCoquille(c);
  if (e.ap) e.ap(r.params);
  document.title = titre + ' · Admin Kreative';
  // la production et les dossiers se chargent en fond pour la recherche et les compteurs
  ['prod', 'dossiers', 'clients', 'commandes'].forEach(q => { if (S[q] == null) charger(q).then(() => { if (n === rendu && q === 'prod') { const nb = document.querySelector('.nav a[href="#/projets"] .nb'); if (!nb) K.rendre(); } }); });
};
K.rendre();
</script>
</body>
</html>
