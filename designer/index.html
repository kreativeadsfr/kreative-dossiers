<!DOCTYPE html>
<html lang="en" data-clair>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Designer space · Kreative</title>
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png"><link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png"><link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/ui/app.css">
<script src="/ui/app.js"></script>
<script src="/ui/review.js"></script>
</head>
<body>
<div id="racine"><div class="chargement">Loading your projects…</div></div>
<script>
/* ============================================================
   ESPACE DESIGNER (portail, en anglais : la designer lit l'anglais)
   Des sections permanentes : Overview, Projects, puis Previews,
   Downloads et Deliver. Chaque page s'ouvre DANS le portail, avec
   le choix du projet en haut. La livraison a sa propre section,
   toujours visible (rien n'apparaît au clic).
   ============================================================ */
const { i, esc } = K;
const E = { moi: null, filtre: 'todo' };
const SECS = ['visuels', 'telechargement'];
K.prod.autorisees = SECS;
const aFaire = x => !!(x.etape ? x.etape.cle === 'desi' : !x.livre);
const mesProjets = () => (K.prod.liste || []).filter(x => x.envoye || (x.etape && x.etape.cle !== 'strat'));          // seulement ce qui est arrivé chez la designer
const quand = ms => {
  const p = {};
  new Intl.DateTimeFormat('en-GB', { weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit', hourCycle: 'h23', timeZone: 'Europe/Paris' })
    .formatToParts(new Date(ms)).forEach(x => { p[x.type] = x.value; });
  return p.weekday + ' ' + p.day + ' ' + p.month + ', ' + p.hour + ':' + p.minute;
};
const jour = ms => new Date(ms).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric', timeZone: 'Europe/Paris' });

function conf() {
  const L = mesProjets(), admin = E.moi && E.moi.role === 'admin';
  const sections = [];
  if (admin) sections.push({ titre: 'Admin', liens: [{ id: 'admin', texte: 'Back to the dashboard', icone: 'gauche', href: '/admin/' }] });
  sections.push({ titre: 'Workspace', liens: [
    { id: 'accueil', texte: 'Overview', icone: 'accueil', href: '#/' },
    { id: 'projets', texte: 'Projects', icone: 'dossier', href: '#/projets', nb: L.filter(aFaire).length || '' }] });
  sections.push({ titre: 'Production', liens: [
    { id: 'visuels', texte: 'Previews', icone: 'image', href: '#/visuels' },
    { id: 'telechargement', texte: 'Downloads', icone: 'telecharger', href: '#/telechargement' },
    { id: 'livrer', texte: 'Deliver', icone: 'envoi', href: '#/livrer' }] });
  const nom = E.moi && E.moi.nom ? E.moi.nom.charAt(0).toUpperCase() + E.moi.nom.slice(1) : 'Designer';
  return { sections, clair: true, anglais: true, qui: { nom, role: admin ? 'Admin' : 'Designer' }, sortie: '/_deconnexion', recherche: rechercher, cherche: 'Search a project…' };
}
function rechercher(q) {
  q = q.toLowerCase(); if (!q) return [];
  return mesProjets().filter(x => (x.nom + ' ' + x.dossier).toLowerCase().includes(q)).slice(0, 10)
    .map(x => ({ texte: x.nom, type: 'Preview', icone: 'image', href: '#/visuels/' + x.dossier }));
}
const nomEn = x => x.nom.replace(' · livraison ', ' · part ');
const ligneNom = x => '<div class="nom">' + K.tuile(x.marque) + '<div><b>' + esc(nomEn(x)) + (x.demo ? ' <span class="pill demo">Demo</span>' : '') + '</b><span class="sub">' + esc(x.dossier) + '</span></div></div>';
function boutons(x) {
  return '<div style="display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap">' +
    '<a class="btn btn-s btn-sm" href="#/visuels/' + esc(x.dossier) + '">' + i.image + 'Preview</a>' +
    '<a class="btn btn-s btn-sm" href="#/telechargement/' + esc(x.dossier) + '">' + i.telecharger + 'Download</a>' +
    (x.livre ? '' : '<a class="btn btn-p btn-sm" href="#/livrer/' + esc(x.dossier) + '">' + i.envoi + 'Deliver</a>') + '</div>';
}

// ---------- OVERVIEW ----------
function ecranAccueil() {
  const L = mesProjets(), now = Date.now();
  const afaire = L.filter(aFaire).sort((a, b) => (a.desi || 9e15) - (b.desi || 9e15));
  const faits = L.filter(x => x.livre).sort((a, b) => b.livreLe - a.livreLe);
  const retard = afaire.filter(x => x.desi && x.desi < now), prochain = afaire.find(x => x.desi && x.desi >= now);
  const kpi = (l, v, d, st) => '<div class="card kpi"><div class="lab">' + l + '</div><div class="v' + (String(v).length > 4 ? ' s' : '') + '"' + (st ? ' style="' + st + '"' : '') + '>' + esc(v) + '</div><div class="d">' + esc(d) + '</div></div>';
  let h = '<div class="ph"><div><h1>Overview</h1><p>Everything you have to deliver, with your deadlines.</p></div><div class="act"><a class="btn btn-p" href="#/livrer">' + i.envoi + 'Deliver a project</a></div></div>';
  h += '<div class="grid g4">' + kpi('To deliver', afaire.length, 'project' + (afaire.length > 1 ? 's' : '')) +
    kpi('Late', retard.length, retard.length ? 'deliver these first' : 'everything is on time', retard.length ? 'color:var(--red)' : '') +
    kpi('Next deadline', prochain ? new Date(prochain.desi).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' }) : 'None', prochain ? nomEn(prochain) + ', ' + K.prod.echeance(prochain.desi, true).texte : 'nothing waiting') +
    kpi('Delivered', faits.filter(x => x.livreLe > now - 30 * 864e5).length, 'in the last 30 days') + '</div>';
  h += '<div class="sec"><div><h2>To deliver</h2><p>Sorted by deadline, the closest first.</p></div></div>';
  h += afaire.length ? '<div class="card"><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Project</th><th class="num">Creatives</th><th>Deadline</th><th>Due (Paris time)</th><th></th></tr></thead><tbody>' +
    afaire.map(x => '<tr><td>' + ligneNom(x) + '</td><td class="num">' + esc(x.nb || '?') + '</td><td>' + (K.prod.echeance(x.desi, true).pill || '<span class="muted">No date</span>') + '</td>' +
      '<td>' + (x.desi ? esc(quand(x.desi)) : '<span class="muted">No date</span>') + '</td><td class="fin">' + boutons(x) + '</td></tr>').join('') + '</tbody></table></div></div>'
    : '<div class="card"><div class="vide">' + i.coche + 'Nothing to deliver right now. New projects appear here as soon as they are ready.</div></div>';
  h += '<div class="sec"><div><h2>Delivered</h2><p>What you already sent to Kreative.</p></div><a class="btn btn-g btn-sm" href="#/projets">All projects</a></div>';
  h += faits.length ? '<div class="card"><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Project</th><th class="num">Creatives</th><th>Delivered on</th><th>Status</th><th></th></tr></thead><tbody>' +
    faits.slice(0, 8).map(x => '<tr><td>' + ligneNom(x) + '</td><td class="num">' + esc(x.nb || '?') + '</td><td>' + (x.livreLe ? esc(jour(x.livreLe)) : '') + '</td><td><span class="pill g"><i></i>Delivered</span></td><td class="fin">' + boutons(x) + '</td></tr>').join('') +
    '</tbody></table></div></div>' : '<div class="card"><div class="vide">No delivered project yet.</div></div>';
  return h;
}

// ---------- PROJECTS ----------
function ecranProjets() {
  const L = mesProjets(), f = E.filtre, now = Date.now();
  const F = { todo: aFaire, late: x => aFaire(x) && x.desi && x.desi < now, done: x => x.livre, all: () => true };
  const chip = (k, t, c) => '<button class="chip' + (f === k ? ' on' : '') + '" onclick="E.filtre=\'' + k + '\';K.rendre(true)">' + (c ? '<i style="color:' + c + '"></i>' : '') + t + '<span class="c">' + L.filter(F[k]).length + '</span></button>';
  const l = L.filter(F[f]).sort((a, b) => (a.livre - b.livre) || ((a.desi || 9e15) - (b.desi || 9e15)));
  return '<div class="ph"><div><h1>Projects</h1><p>All your projects, and each of their pages in one click.</p></div></div>' +
    '<div class="filtres">' + chip('todo', 'To deliver', 'var(--blue)') + chip('late', 'Late', 'var(--red)') + chip('done', 'Delivered', 'var(--green)') + chip('all', 'All') + '</div>' +
    (l.length ? '<div class="card"><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Project</th><th class="num">Creatives</th><th>Status</th><th>Due</th><th></th></tr></thead><tbody>' +
      l.map(x => '<tr><td>' + ligneNom(x) + '</td><td class="num">' + esc(x.nb || '?') + '</td><td>' + K.prod.pill(x, true) + '</td><td>' + (x.desi ? esc(quand(x.desi)) : '<span class="muted">No date</span>') + '</td><td class="fin">' + boutons(x) + '</td></tr>').join('') +
      '</tbody></table></div></div>' : '<div class="card"><div class="vide">No project here.</div></div>');
}

// ---------- DELIVER ----------
// ---------- DELIVER : the designer uploads every file, in every format ----------
const DL = { dossier: null, donnees: null, choix: null, envois: [] };
const NOMS_F = { '1x1': '1:1', '4x5': '4:5', '9x16': '9:16', autre: 'Other' };
const ST_EN = { brouillon: ['Uploading', ''], a_verifier: ['With Kreative for checking', 'a'], a_corriger: ['Sent back to you', 'r'], envoyee: ['With the client', 'b'], review_terminee: ['Client feedback to fix', 'v'], approuvee: ['Approved by the client', 'g'] };
const pillEn = st => { const x = ST_EN[st] || [st, '']; return '<span class="pill ' + x[1] + '"><i></i>' + esc(x[0]) + '</span>'; };
// la dernière version de chaque projet change le statut vu par la designer
function marquer() {
  // l'étape vient du portail (K.prod.etape) : la même que voit Kreative
  (K.prod.liste || []).forEach(x => { x.aCorriger = !!(x.etape && x.etape.cle === 'desi' && x.etape.retouche); });
}
async function chargerDl(d) {
  DL.dossier = d;
  try { DL.donnees = await K.api('/api/equipe/livraisons/' + d); } catch (e) { DL.donnees = { versions: [], erreur: e.message }; }
  if (!DL.donnees.versions.find(v => v.id === DL.choix)) DL.choix = (DL.donnees.versions[0] || {}).id;
  K.rendre(true);
}
function ecranLivrer(id) {
  const L = mesProjets(), aLivrer = L.filter(aFaire).sort((a, b) => (a.desi || 9e15) - (b.desi || 9e15));
  if (!id) {
    return '<div class="ph"><div><h1>Deliver</h1><p>Pick the project you finished, then upload your files right here.</p></div></div>' +
      (aLivrer.length ? '<div class="card"><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Project</th><th class="num">Creatives</th><th>Status</th><th></th></tr></thead><tbody>' +
        aLivrer.map(x => '<tr class="clic" onclick="location.hash=\'#/livrer/' + esc(x.dossier) + '\'"><td>' + ligneNom(x) + '</td><td class="num">' + esc(x.nb || '?') + '</td><td>' + (x.aCorriger ? '<span class="pill r"><i></i>To fix</span>' : K.prod.echeance(x.desi, true).pill || '<span class="muted">No date</span>') + '</td>' +
          '<td class="fin"><span class="btn btn-p btn-sm">' + i.envoi + 'Deliver</span></td></tr>').join('') + '</tbody></table></div></div>'
        : '<div class="card"><div class="vide">' + i.coche + 'Nothing to deliver right now.</div></div>');
  }
  const x = K.prod.trouver(id);
  if (!x) return '<a class="retour" href="#/livrer">' + i.gauche + 'Deliver</a><div class="card"><div class="vide">Project not found.</div></div>';
  if (DL.dossier !== id) { DL.dossier = id; DL.donnees = null; setTimeout(() => chargerDl(id), 0); }
  const V = (DL.donnees && DL.donnees.versions) || [], der = V[0], choix = L.filter(y => aFaire(y) || y === x);
  let h = '<a class="retour" href="#/livrer">' + i.gauche + 'Deliver</a>' +
    '<div class="ph"><div><h1>' + esc(nomEn(x)) + '</h1><p>' + esc(x.nb || '?') + ' creatives in 1:1, 4:5 and 9:16' + (x.desi ? ' · due ' + esc(quand(x.desi)) + ' (Paris time)' : '') + '</p></div>' +
    '<div class="act" style="align-items:center">' + (der ? pillEn(der.statut) : K.prod.echeance(x.desi, true).pill) +
    '<div style="width:300px"><select class="in" id="lv-projet">' + choix.map(y => '<option value="' + esc(y.dossier) + '"' + (y === x ? ' selected' : '') + '>' + esc(nomEn(y)) + '</option>').join('') + '</select></div></div></div>';
  if (!DL.donnees) return h + '<div class="card"><div class="vide">Loading…</div></div>';
  const attenteStrat = der && ['a_corriger', 'review_terminee'].includes(der.statut) && der.retouche === 'strategiste';
  const peutDeposer = !attenteStrat && (!der || ['brouillon', 'a_corriger', 'review_terminee'].includes(der.statut));
  const travail = der && der.statut === 'brouillon' ? der : null, F = travail ? travail.fichiers : [];
  let gauche = '<div class="card pad"><h3 style="font-size:16px">Upload your files</h3>';
  if (attenteStrat) gauche += '<div class="etat-envoi" style="margin-top:14px"><span class="pastille attente">' + i.crayon + '</span><div><b>The strategist is updating the copy first</b><small>The client asked for text changes on version ' + der.version + '. As soon as the new copy is ready, you can upload version ' + (der.version + 1) + ' here. Read the comments below in the meantime.</small></div></div>';
  else if (der && der.statut === 'a_corriger') gauche += '<div class="rv-note" style="margin-top:14px">' + i.crayon + '<div><b>Kreative sent version ' + der.version + ' back.</b> ' + esc(der.note_kreative || 'See the comments on the files below.') + ' Upload the corrected files: a file with the same name replaces the old one.</div></div>';
  if (der && der.statut === 'review_terminee' && !attenteStrat) { const n = der.fichiers.reduce((s, f) => s + f.commentaires.filter(c => !c.interne).length, 0); gauche += '<div class="rv-note" style="margin-top:14px">' + i.message + '<div><b>The client sent ' + n + ' comment' + (n > 1 ? 's' : '') + ' on version ' + der.version + '.</b> Open the files below to read them, then upload the corrected files (same file name replaces the old one).</div></div>'; }
  if (peutDeposer) {
    gauche += '<div class="depot" id="lv-depot" style="margin-top:14px">' + i.telecharger + '<b>Drop your PNG files here, or click to choose</b><small>PNG only. The format (1:1, 4:5, 9:16) is detected from the size.</small><input type="file" id="lv-fichiers" multiple accept="image/png,.png" hidden></div>' +
      '<div class="envois" id="lv-envois">' + DL.envois.map(e => '<div class="envoi-l fini"><span>' + esc(e.nom) + '</span><div class="barre' + (e.ok ? ' g' : '') + '"><i style="width:' + e.pc + '%"></i></div><small class="muted">' + esc(e.etat) + '</small></div>').join('') + '</div>';
    const attendu = Number(x.nb) || 0;
    gauche += '<div class="compte-formats">' + ['1x1', '4x5', '9x16'].map(f => { const n = F.filter(y => y.format === f).length; return '<span class="pill ' + (attendu && n >= attendu ? 'g' : n ? 'a' : '') + '">' + NOMS_F[f] + ' · ' + n + (attendu ? ' / ' + attendu : '') + '</span>'; }).join('') +
      (F.some(y => y.format === 'autre') ? '<span class="pill r">Other sizes · ' + F.filter(y => y.format === 'autre').length + '</span>' : '') + '</div>' +
      '<div class="champ" style="margin-top:16px"><label for="lv-note">Note for Kreative (optional)</label><textarea class="in" id="lv-note" rows="3" placeholder="Anything we should know">' + esc(DL.note || '') + '</textarea></div>' +
      '<button class="btn btn-p btn-bloc btn-lg" id="lv-envoyer"' + (F.length ? '' : ' disabled') + '>' + i.envoi + 'Send to Kreative' + (F.length ? ' (' + F.length + ' files)' : '') + '</button><p class="muted" id="lv-etat" style="font-size:13px;margin-top:10px;min-height:18px"></p>';
  } else if (!attenteStrat) gauche += '<div class="etat-envoi"><span class="pastille">' + i.coche + '</span><div><b>' + (der.statut === 'a_verifier' ? 'Version ' + der.version + ' sent to Kreative' : der.statut === 'envoyee' ? 'Version ' + der.version + ' is with the client' : 'Approved by the client') + '</b>' +
    '<small>' + (der.statut === 'a_verifier' ? 'Kreative checks your files, then sends them to the client or back to you.' : der.statut === 'envoyee' ? 'The client is reviewing it. Their comments will show up here.' : 'Nothing more to do on this project.') + (der.depose_le ? ' · ' + esc(quand(der.depose_le)) : '') + '</small></div></div>';
  gauche += '</div>';
  h += '<div class="grid g2" style="align-items:start">' + gauche +
    '<div class="card pad"><h3 style="font-size:15px">Project files</h3><p class="muted" style="font-size:13px;margin-top:4px">Check the brand kit and the copy before exporting.</p>' +
    '<div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap"><a class="btn btn-s" href="#/visuels/' + esc(x.dossier) + '">' + i.image + 'Preview</a><a class="btn btn-s" href="#/telechargement/' + esc(x.dossier) + '">' + i.telecharger + 'Download</a></div></div></div>';
  const vue = V.find(v => v.id === DL.choix);
  if (vue) {
    h += '<div style="margin-top:26px">' + K.rv.puces(V, vue.id, v => 'Version ' + v.version + ' · ' + ST_EN[v.statut][0]) +
      K.rv.grille(vue, { mode: 'designer', titre: 'Version ' + vue.version, sousTitre: vue.fichiers.length + ' files · ' + ST_EN[vue.statut][0], supprimer: vue.statut === 'brouillon' }) + '</div>';
  }
  return h;
}
// la taille d'une image ou d'une vidéo, puis le format
function dimensions(f) {
  return new Promise(ok => {
    if (/^video\//.test(f.type)) { const v = document.createElement('video'); v.preload = 'metadata'; v.onloadedmetadata = () => { ok({ l: v.videoWidth, h: v.videoHeight }); URL.revokeObjectURL(v.src); }; v.onerror = () => ok({ l: 0, h: 0 }); v.src = URL.createObjectURL(f); return; }
    const im = new Image(); im.onload = () => { ok({ l: im.naturalWidth, h: im.naturalHeight }); URL.revokeObjectURL(im.src); }; im.onerror = () => ok({ l: 0, h: 0 }); im.src = URL.createObjectURL(f);
  });
}
const formatDe = d => { if (!d.l || !d.h) return 'autre'; const r = d.l / d.h; return Math.abs(r - 1) < .03 ? '1x1' : Math.abs(r - .8) < .03 ? '4x5' : Math.abs(r - .5625) < .03 ? '9x16' : 'autre'; };
function miniature(f) {
  return new Promise(ok => {
    const fin = src => { const c = document.createElement('canvas'), t = 480, k = Math.min(1, t / Math.max(src.w, src.h)); c.width = Math.round(src.w * k); c.height = Math.round(src.h * k); c.getContext('2d').drawImage(src.el, 0, 0, c.width, c.height); c.toBlob(b => ok(b), 'image/jpeg', .8); };
    if (/^video\//.test(f.type)) { const v = document.createElement('video'); v.muted = true; v.preload = 'auto'; v.onloadeddata = () => { v.currentTime = Math.min(.5, v.duration / 2 || 0); }; v.onseeked = () => fin({ el: v, w: v.videoWidth, h: v.videoHeight }); v.onerror = () => ok(null); v.src = URL.createObjectURL(f); return; }
    const im = new Image(); im.onload = () => fin({ el: im, w: im.naturalWidth, h: im.naturalHeight }); im.onerror = () => ok(null); im.src = URL.createObjectURL(f);
  });
}
function envoyerFichier(livraison, f, format, d, suivi) {
  return new Promise((ok, ko) => {
    const x = new XMLHttpRequest();
    x.open('PUT', '/api/equipe/fichiers?livraison=' + encodeURIComponent(livraison) + '&format=' + format + '&nom=' + encodeURIComponent(f.name) + '&l=' + d.l + '&h=' + d.h);
    x.setRequestHeader('Content-Type', f.type || 'application/octet-stream');
    x.upload.onprogress = e => { if (e.lengthComputable) suivi(Math.round(e.loaded * 100 / e.total)); };
    x.onload = () => { let r = {}; try { r = JSON.parse(x.responseText); } catch (e) {} if (x.status < 300) ok(r); else ko(new Error(r.erreur || 'Upload failed (' + x.status + ')')); };
    x.onerror = () => ko(new Error('Network error'));
    x.send(f);
  });
}
async function deposer(fichiers, x) {
  const refuses = Array.from(fichiers).filter(f => f.type !== 'image/png');
  if (refuses.length) K.toast(refuses.length + ' file' + (refuses.length > 1 ? 's' : '') + ' skipped: PNG only.');
  fichiers = Array.from(fichiers).filter(f => f.type === 'image/png');
  if (!fichiers.length) return;
  let travail = ((DL.donnees && DL.donnees.versions) || [])[0];
  try { if (!travail || travail.statut !== 'brouillon') travail = await K.api('/api/equipe/livraisons', { methode: 'POST', corps: { dossier: x.dossier } }); }
  catch (e) { K.toast(e.message); return; }
  const file = Array.from(fichiers).map(f => ({ f, nom: f.name, pc: 0, etat: 'waiting', ok: false }));
  DL.envois = file;
  const maj = () => { const z = document.getElementById('lv-envois'); if (z) z.innerHTML = DL.envois.map(e => '<div class="envoi-l"><span>' + esc(e.nom) + '</span><div class="barre' + (e.ok ? ' g' : '') + '"><i style="width:' + e.pc + '%"></i></div><small class="muted">' + esc(e.etat) + '</small></div>').join(''); };
  maj();
  let n = 0;
  const travailleur = async () => {
    while (n < file.length) {
      const e = file[n++];
      try {
        const d = await dimensions(e.f), fmt = formatDe(d);
        e.etat = NOMS_F[fmt]; maj();
        const r = await envoyerFichier(travail.id, e.f, fmt, d, pc => { e.pc = pc; maj(); });
        const mini = await miniature(e.f);
        if (mini && r.id) await fetch('/api/equipe/fichiers/' + r.id + '/mini', { method: 'PUT', headers: { 'Content-Type': 'image/jpeg' }, body: mini, credentials: 'same-origin' });
        e.pc = 100; e.ok = true; e.etat = NOMS_F[fmt] + ' ✓';
      } catch (err) { e.etat = err.message; }
      maj();
    }
  };
  await Promise.all([travailleur(), travailleur(), travailleur()]);
  DL.envois = file.filter(e => !e.ok);
  DL.choix = travail.id;
  await chargerDl(x.dossier);
}
// la confirmation d'envoi : le cercle se trace, la coche apparaît, puis la carte passe au nouvel état
function animerEnvoi(carte, n) {
  return new Promise(ok => {
    if (!carte) return ok();
    const v = document.createElement('div');
    v.className = 'envoye-anim';
    v.innerHTML = '<svg viewBox="0 0 56 56" aria-hidden="true"><circle class="anneau" cx="28" cy="28" r="25"/><path class="coche" d="M17 29.5l7.5 7.5L40 21.5"/></svg>' +
      '<b>Sent to Kreative</b><small>' + n + ' file' + (n > 1 ? 's' : '') + ' delivered. Kreative checks them, then sends them to the client.</small>';
    carte.style.position = 'relative'; carte.appendChild(v);
    setTimeout(() => v.classList.add('sortie'), 2300);
    setTimeout(ok, 2700);
  });
}
function brancherLivrer(id) {
  const s = document.getElementById('lv-projet'); if (s) s.onchange = () => K.aller('#/livrer/' + s.value);
  const x = id && K.prod.trouver(id);
  if (!x) return;
  const V = (DL.donnees && DL.donnees.versions) || [], vue = V.find(v => v.id === DL.choix);
  document.querySelectorAll('[data-rv-version]').forEach(b => b.onclick = () => { DL.choix = b.dataset.rvVersion; K.rendre(true); });
  if (vue) {
    K.rv.brancher(vue, { mode: 'designer', nomZip: (x.marque + '-v' + vue.version).replace(/[^A-Za-z0-9]+/g, '-'), rendre: () => K.rendre(true), auteur: (E.moi && E.moi.nom) || 'Designer',
      peutCommenter: () => true, peutApprouver: () => false,
      api: { commenter: (f, texte, forme, couleur) => K.api('/api/equipe/commentaires', { methode: 'POST', corps: { fichier_id: f.id, texte, forme, couleur } }),
        supprimer: id2 => K.api('/api/equipe/commentaires/' + id2, { methode: 'DELETE' }) } });
    document.querySelectorAll('[data-rv-suppr]').forEach(b => b.onclick = async e => {
      e.stopPropagation();
      try { await K.api('/api/equipe/fichiers/' + b.dataset.rvSuppr, { methode: 'DELETE' }); await chargerDl(x.dossier); } catch (err) { K.toast(err.message); }
    });
  }
  const zone = document.getElementById('lv-depot'), champ = document.getElementById('lv-fichiers');
  if (zone && champ) {
    zone.onclick = () => champ.click();
    champ.onchange = () => deposer(champ.files, x);
    zone.ondragover = e => { e.preventDefault(); zone.classList.add('survol'); };
    zone.ondragleave = () => zone.classList.remove('survol');
    zone.ondrop = e => { e.preventDefault(); zone.classList.remove('survol'); deposer(e.dataTransfer.files, x); };
  }
  const note = document.getElementById('lv-note');
  if (note) note.oninput = () => { DL.note = note.value; };   // la note reste là pendant les dépôts
  const b = document.getElementById('lv-envoyer');
  if (b) b.onclick = async () => {
    const etat = document.getElementById('lv-etat'), travail = V[0];
    if (!travail || travail.statut !== 'brouillon') return;
    const attendu = Number(x.nb) || 0, manque = attendu ? ['1x1', '4x5', '9x16'].filter(f => travail.fichiers.filter(y => y.format === f).length < attendu) : [];
    if (manque.length && !await K.confirmer('Some formats are incomplete', 'Missing files in ' + manque.map(f => NOMS_F[f]).join(', ') + '. Send anyway?', 'Send anyway')) return;
    b.disabled = true; etat.textContent = 'Sending…';
    try {
      await K.api('/api/equipe/livraisons/' + travail.id + '/envoyer', { methode: 'POST', corps: { note: document.getElementById('lv-note').value.trim() } });
      DL.note = '';
      await animerEnvoi(b.closest('.card'), travail.fichiers.length);
      E.livs = await K.api('/api/equipe/livraisons').catch(() => E.livs); await K.prod.charger(true); marquer(); await chargerDl(x.dossier);
    } catch (e) { etat.textContent = e.message; b.disabled = false; }
  };
}

// ---------- RENDU ----------
const TITRES = { '': 'Overview', projets: 'Projects', visuels: 'Previews', telechargement: 'Downloads', livrer: 'Deliver' };
const TEXTES = { visuels: 'The generated visuals and the copy for each project.', telechargement: 'Download a project folder: visuals, copy and assets.' };
let derniere = '';
K.rendre = async force => {
  const r = K.route(), cle = (location.hash || '#/');
  if (!force && cle === derniere && document.querySelector('.app')) return;
  derniere = cle;
  if (!E.moi) E.moi = await K.lireJson('/_moi');
  await K.prod.charger();
  if (!E.livs) { try { E.livs = await K.api('/api/equipe/livraisons'); } catch (e) { E.livs = []; } }
  marquer();
  const sec = r.ecran, id = r.params[0];
  let contenu, plein = false, nomP = '';
  if (sec === 'visuels' || sec === 'telechargement') {
    if (id) { contenu = K.prod.vue(sec, id, { en: true, sections: SECS }); plein = true; const x = K.prod.trouver(id); nomP = x ? nomEn(x) : id; }
    else { const tout = K.prod.liste; K.prod.liste = mesProjets(); contenu = K.prod.liste_(sec, { en: true, texte: TEXTES[sec] }); K.prod.liste = tout; }
  } else if (sec === 'livrer') { contenu = ecranLivrer(id); const x = id && K.prod.trouver(id); nomP = x ? nomEn(x) : ''; }
  else contenu = sec === 'projets' ? ecranProjets() : ecranAccueil();
  const c = conf();
  const ariane = nomP ? K.ariane('pinceau', 'Designer', TITRES[sec], nomP) : K.ariane('pinceau', 'Designer', TITRES[sec] || TITRES['']);
  document.getElementById('racine').innerHTML = K.coquille(c, sec || 'accueil', ariane, contenu, plein ? 'plein' : false);
  K.brancherCoquille(c);
  K.prod.surveiller(() => { marquer(); if (DL.dossier && K.route().ecran === 'livrer') chargerDl(DL.dossier); else K.rendre(true); });
  if (plein) K.prod.brancher(sec);
  if (sec === 'livrer') brancherLivrer(id);
  document.title = 'Designer space · Kreative';
};
K.rendre();
</script>
