<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Espace client · Kreative</title>
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="stylesheet" href="/ui/app.css">
<script src="/ui/app.js"></script>
</head>
<body>
<div id="racine"><div class="chargement">Chargement de votre espace…</div></div>
<script>
/* ============================================================
   PORTAIL CLIENT KREATIVE
   Accueil, projets (avancement), brief (Fillout intégré),
   commander, contact WhatsApp, avis Trustpilot.
   Les données viennent de /api/client/moi.
   ============================================================ */
const LIENS = {
  whatsapp: 'https://api.whatsapp.com/send?phone=33756921042',
  trustpilot: 'https://www.trustpilot.com/review/kreativeads.fr',
  iclosed: 'https://app.iclosed.io/e/kreative/appel-de-decouverte-kreative',
  fillout: {
    starter: 'https://kreative-forms.fillout.com/t/hSWiGFjTVhus',
    growth: 'https://kreative-forms.fillout.com/t/soMTps1WZmus',
    scale: 'https://kreative-forms.fillout.com/t/sPx62jwVQqus',
    custom: 'https://kreative-forms.fillout.com/t/oQN3qKRznVus',
    suivant: 'https://kreative-forms.fillout.com/t/9pEDzM8K9Tus'
  },
  // les liens de paiement Stripe (à compléter) : tant qu'ils sont vides,
  // « Commander » ouvre WhatsApp avec un message prêt
  stripe: {
    starter: { unique: '', mensuel: '' },
    growth: { unique: '', mensuel: '' },
    scale: { unique: '', mensuel: '' }
  }
};
const { i, esc } = K;
let D = null;                 // les données du client
let formule = 'mensuel';      // onglet de la page Commander

const params = new URLSearchParams(location.search);
if (params.get('client')) K.suffixe = '?client=' + encodeURIComponent(params.get('client'));
const lienInterne = h => h + '';   // les liens restent sur la même page (#)

const wa = texte => LIENS.whatsapp + '&text=' + encodeURIComponent(texte);
const nomPack = c => 'Pack ' + ((D.packs[c.pack] || {}).nom || c.pack);
const titreCommande = c => nomPack(c) + ' · ' + c.nb_creas + ' créatives';
const statutPill = c => {
  if (c.statut === 'brief') return '<span class="pill a"><i></i>Brief attendu</span>';
  if (c.statut === 'valide') return '<span class="pill g"><i></i>Terminé</span>';
  if (c.statut === 'livre') return '<span class="pill g"><i></i>Livré</span>';
  if (c.statut === 'revisions') return '<span class="pill v"><i></i>Révisions</span>';
  return '<span class="pill b"><i></i>En cours</span>';
};
const enCours = () => D.commandes.filter(c => !['valide', 'annule'].includes(c.statut));
const prenom = () => (D.client.contact || '').trim().split(/\s+/)[0] || D.client.marque;

function conf() {
  return {
    cta: { texte: 'Commander des créas', href: '#/commander' },
    sections: [{ titre: 'Espace client', liens: [
      { id: 'accueil', texte: 'Accueil', icone: 'accueil', href: '#/' },
      { id: 'projets', texte: 'Mes projets', icone: 'dossier', href: '#/projets', nb: D.commandes.length || '' },
      { id: 'brief', texte: 'Mon brief', icone: 'doc', href: '#/brief' }
    ] }, { titre: 'Kreative', liens: [
      { id: 'contact', texte: 'Nous contacter', icone: 'message', href: '#/contact' },
      { id: 'avis', texte: 'Laisser un avis', icone: 'etoile', href: '#/avis' }
    ] }],
    qui: { nom: D.client.marque, role: D.client.contact || D.client.email || 'Client', tuile: true },
    menu: ['<a href="' + wa('Bonjour Kreative, ') + '" target="_blank" rel="noopener">' + i.message + 'Nous écrire</a>'],
    sortie: D.apercu ? '/admin/#/clients/' + D.client.id : '/client/sortie'
  };
}

function apercu() {
  return D.apercu ? '<div class="bandeau amb"><span class="ic">' + i.oeil + '</span><div><b>Aperçu de l\'espace de ' + esc(D.client.marque) + '</b>' +
    '<small>Vous voyez exactement ce que voit votre client. Rien de ce que vous faites ici ne lui est envoyé.</small></div>' +
    '<a class="btn btn-sm" href="/admin/#/clients/' + esc(D.client.id) + '">Retour à l\'admin</a></div>' : '';
}

// ---------- ACCUEIL ----------
function ecranAccueil() {
  const cours = enCours();
  const principal = cours[0] || D.commandes[0];
  const attente = D.commandes.find(c => c.statut === 'brief');
  let h = apercu();
  if (attente) h += '<div class="bandeau"><span class="ic">' + i.doc + '</span><div><b>Il reste une étape : votre brief</b>' +
    '<small>Comptez une quinzaine de minutes. Il lance la production de votre ' + esc(nomPack(attente)) + '.</small></div>' +
    '<a class="btn" href="#/brief/' + esc(attente.id) + '">Remplir mon brief</a></div>';
  h += '<div class="ph"><div><h1>Bonjour, ' + esc(prenom()) + '</h1><p>Suivez l\'avancement de vos créatives Kreative.</p></div></div>';

  h += '<div class="sec" style="margin-top:0"><div><h2>Mes projets</h2><p>Cliquez sur un projet pour voir son avancement, votre brief et vos créatives.</p></div></div>';
  h += D.commandes.length ? '<div class="projets">' + D.commandes.slice(0, 3).map((c, n) => carteProjet(c, D.commandes.length - n)).join('') + '</div>'
    : '<div class="card"><div class="vide">' + i.dossier + 'Aucun projet pour l\'instant.<br><a class="btn btn-p btn-sm" style="margin-top:14px" href="#/commander">Commander mes premières créas</a></div></div>';

  if (principal) {
    const livrees = D.commandes.filter(c => ['livre', 'revisions', 'valide'].includes(c.statut)).reduce((s, c) => s + (c.nb_creas || 0), 0);
    const total = D.commandes.reduce((s, c) => s + (c.nb_creas || 0), 0);
    h += '<div class="grid g4" style="margin-top:14px">' +
      '<div class="card kpi"><div class="lab">Projet en cours</div><div class="v s">' + esc(nomPack(principal)) + '</div><div class="d">' + principal.progression + ' % · ' + principal.etapes.filter(e => e.fait).length + ' / ' + principal.etapes.length + ' étapes</div><div class="barre"><i style="width:' + principal.progression + '%"></i></div></div>' +
      '<div class="card kpi"><div class="lab">Projets en cours</div><div class="v">' + cours.length + '</div><div class="d">' + D.commandes.length + ' projet' + (D.commandes.length > 1 ? 's' : '') + ' au total</div></div>' +
      '<div class="card kpi"><div class="lab">Livraison prévue</div><div class="v s">' + (principal.deadline ? esc(K.date(principal.deadline, { year: undefined })) : 'Dès le brief') + '</div><div class="d">' + (principal.deadline ? esc(K.jour(principal.deadline)) + ', ' + esc(K.dans(principal.deadline)) : 'Le délai démarre à la réception du brief') + '</div></div>' +
      '<div class="card kpi"><div class="lab">Créatives livrées</div><div class="v">' + livrees + ' / ' + total + '</div><div class="d">Toutes vos commandes</div></div></div>';

    h += '<div class="grid g2" style="margin-top:14px">' +
      '<div class="card"><div class="card-h"><h3>Activité récente</h3></div><div class="card-b liste">' +
      (D.activite.length ? D.activite.slice(0, 7).map(a => '<div class="li"><span class="ic">' + (ICONES_ACT[a.type] || i.coche) + '</span><span class="t">' + esc(a.texte) + '</span><small>' + esc(K.ilya(a.le)) + '</small></div>').join('')
        : '<div class="vide">Rien pour l\'instant.</div>') + '</div></div>' +
      '<div class="card"><div class="card-h"><h3>Étapes du projet</h3><span class="pill">' + esc(nomPack(principal)) + '</span></div><div class="card-b">' + K.etapes(principal.etapes) + '</div></div></div>';
  }
  return h;
}
const ICONES_ACT = { commande: i.sac, brief: i.doc, livre: i.image, revisions: i.crayon, valide: i.coche, production: i.pinceau, client: i.accueil, lien: i.lien };

function carteProjet(c, n) {
  return '<a class="card projet" href="#/projets/' + esc(c.id) + '"><div class="hd"><span class="ic">' + i.calques + '</span>' + statutPill(c) + '</div>' +
    '<div class="lab">Projet ' + n + ' · #' + esc(c.ref) + '</div><h3>' + esc(titreCommande(c)) + '</h3>' +
    '<div class="muted" style="font-size:13px">Commandé le ' + esc(K.date(c.cree_le)) + (c.formule === 'mensuel' ? ' · mensuel' : '') + '</div>' +
    '<div class="barre" style="margin-top:12px"><i style="width:' + c.progression + '%"></i></div><div class="pc">' + c.progression + ' % d\'avancement</div>' +
    '<span class="btn btn-p btn-sm">Voir le projet ' + i.fleche + '</span></a>';
}

// ---------- PROJETS ----------
function ecranProjets() {
  let h = apercu() + '<div class="ph"><div><h1>Mes projets</h1><p>Toutes vos commandes et leur avancement.</p></div>' +
    '<div class="act"><a class="btn btn-p" href="#/commander">' + i.plus + 'Nouvelle commande</a></div></div>';
  if (!D.commandes.length) return h + '<div class="card"><div class="vide">' + i.dossier + 'Aucun projet pour l\'instant.</div></div>';
  h += '<div class="card"><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Projet</th><th>Commande</th><th>Statut</th><th>Avancement</th><th>Livraison</th><th></th></tr></thead><tbody>' +
    D.commandes.map(c => '<tr class="clic" onclick="location.hash=\'#/projets/' + esc(c.id) + '\'"><td><b>#' + esc(c.ref) + '</b><span class="sub">' + esc(K.date(c.cree_le)) + '</span></td>' +
      '<td>' + esc(titreCommande(c)) + '<span class="sub">' + (c.formule === 'mensuel' ? 'Mensuel' : c.formule === 'custom' ? 'Sur mesure' : 'Commande unique') + '</span></td>' +
      '<td>' + statutPill(c) + '</td><td style="min-width:150px"><div class="barre"><i style="width:' + c.progression + '%"></i></div><span class="sub">' + c.progression + ' %</span></td>' +
      '<td>' + (c.deadline ? esc(K.date(c.deadline)) : '<span class="muted">·</span>') + '</td><td class="fin">' + i.fleche.replace('<svg', '<svg width="16" height="16" style="opacity:.4"') + '</td></tr>').join('') +
    '</tbody></table></div></div>';
  return h;
}

function ecranProjet(id) {
  const c = D.commandes.find(x => x.id === id);
  if (!c) return '<a class="retour" href="#/projets">' + i.gauche + 'Mes projets</a><div class="card"><div class="vide">Projet introuvable.</div></div>';
  const fait = k => (c.etapes.find(e => e.cle === k) || {}).fait;
  let h = apercu() + '<a class="retour" href="#/projets">' + i.gauche + 'Retour à mes projets</a>' +
    '<div class="ph"><div><h1 style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">' + esc(titreCommande(c)) + ' <span class="pill b">' + c.progression + ' %</span></h1>' +
    '<p>Commande #' + esc(c.ref) + ' du ' + esc(K.date(c.cree_le)) + (c.deadline ? ' · livraison prévue le ' + esc(K.jour(c.deadline)) : '') + '</p></div></div>';
  h += '<div class="card pad"><div style="display:flex;justify-content:space-between;align-items:baseline;gap:12px"><div><h3 style="font-size:16px">Avancement global</h3>' +
    '<p class="muted" style="font-size:13px;margin-top:3px">' + c.etapes.filter(e => e.fait).length + ' sur ' + c.etapes.length + ' étapes terminées</p></div>' + statutPill(c) + '</div>' +
    '<div class="barre" style="margin-top:16px;height:7px"><i style="width:' + c.progression + '%"></i></div>' +
    '<div class="coches">' + c.etapes.map(e => '<div class="coche' + (e.fait ? ' fait' : '') + '"><span class="o">' + (e.fait ? i.coche : '') + '</span>' + esc(e.titre) + '</div>').join('') + '</div></div>';

  h += '<div class="sec"><div><h2>Vos actions</h2><p>Ce qui vous attend sur ce projet.</p></div></div><div class="actions">';
  h += action(fait('brief') ? 'ok' : 'on', i.doc, 'Fillout', 'Votre brief', 'Les informations sur votre marque qui lancent la production.',
    fait('brief') ? '<div class="etat ok">✓ Brief envoyé</div>' : '<a class="btn btn-p btn-sm" href="#/brief/' + esc(c.id) + '">Remplir mon brief</a>');
  h += action(fait('livraison') ? (c.statut === 'valide' ? 'ok' : 'on') : 'off', i.image, 'Créatives', 'Vos créatives',
    c.nb_creas + ' créatives en 3 formats (1:1, 4:5, 9:16), à valider ou à commenter.',
    fait('livraison') ? '<a class="btn btn-p btn-sm" href="' + wa('Bonjour Kreative, je voudrais récupérer les créatives de ma commande #' + c.ref) + '" target="_blank" rel="noopener">Recevoir mes créatives</a>'
      : '<div class="etat">' + (c.deadline ? 'Prévu le ' + esc(K.date(c.deadline, { year: undefined })) : 'Pas encore disponible') + '</div>');
  h += action(c.statut === 'revisions' ? 'on' : 'off', i.crayon, 'Révisions', 'Vos retouches',
    ((D.packs[c.pack] || {}).revisions ? (D.packs[c.pack].revisions + ' cycles de révisions inclus.') : 'Révisions illimitées jusqu\'à validation.'),
    c.statut === 'revisions' ? '<div class="etat">En cours chez Kreative</div>' : '<div class="etat">' + (fait('livraison') ? 'Aucune demandée' : 'Après la livraison') + '</div>');
  h += action(c.statut === 'valide' ? 'on' : 'off', i.etoile, 'Trustpilot', 'Votre avis', 'Une minute pour nous dire comment ça s\'est passé.',
    c.statut === 'valide' ? '<a class="btn btn-s btn-sm" href="' + LIENS.trustpilot + '" target="_blank" rel="noopener">Laisser un avis</a>' : '<div class="etat">À la fin du projet</div>');
  h += '</div>';
  h += '<div class="grid g2" style="margin-top:22px"><div class="card"><div class="card-h"><h3>Étapes du projet</h3></div><div class="card-b">' + K.etapes(c.etapes) + '</div></div>' +
    '<div class="card pad"><h3 style="font-size:15px">Une question sur ce projet ?</h3><p class="muted" style="margin:6px 0 16px;font-size:13.5px">On répond sur WhatsApp, en général dans l\'heure.</p>' +
    '<a class="btn btn-s" href="' + wa('Bonjour Kreative, une question sur ma commande #' + c.ref + ' : ') + '" target="_blank" rel="noopener">' + i.message + 'Nous écrire</a></div></div>';
  return h;
}
function action(etat, icone, lab, titre, texte, pied) {
  return '<div class="card action ' + etat + '"><span class="ic">' + icone + '</span><div class="lab">' + esc(lab) + '</div><h3>' + esc(titre) + '</h3><p>' + esc(texte) + '</p>' + pied + '</div>';
}

// ---------- BRIEF ----------
function ecranBrief(id) {
  const attente = D.commandes.filter(c => c.statut === 'brief');
  const c = (id && D.commandes.find(x => x.id === id)) || attente[0] || D.commandes[0];
  let h = apercu();
  if (!c) return h + '<div class="ph"><div><h1>Mon brief</h1><p>Votre brief s\'ouvre dès votre première commande.</p></div></div><div class="card"><div class="vide">' + i.doc + 'Aucune commande pour l\'instant.</div></div>';
  if (c.statut !== 'brief') {
    return h + '<div class="ph"><div><h1>Mon brief</h1><p>' + esc(titreCommande(c)) + ' · commande #' + esc(c.ref) + '</p></div></div>' +
      '<div class="card pad" style="max-width:720px"><div style="display:flex;gap:14px;align-items:flex-start"><span class="tuile" style="background:var(--green)">' + i.coche.replace('<svg', '<svg width="18" height="18"') + '</span>' +
      '<div><h3 style="font-size:17px">Brief bien reçu</h3><p class="muted" style="margin-top:5px;font-size:13.5px">' + (c.brief_le ? 'Reçu le ' + esc(K.dateHeure(c.brief_le)) + '. ' : '') +
      'C\'est la base de tout ce que nous produisons pour vous.</p>' +
      '<div style="display:flex;gap:8px;margin-top:16px;flex-wrap:wrap"><a class="btn btn-s btn-sm" href="' + wa('Bonjour Kreative, je voudrais modifier mon brief (commande #' + c.ref + ') : ') + '" target="_blank" rel="noopener">Demander une modification</a>' +
      '<a class="btn btn-g btn-sm" href="#/projets/' + esc(c.id) + '">Voir le projet</a></div></div></div></div>';
  }
  const lien = (LIENS.fillout[c.pack] || LIENS.fillout.custom) + '?commande=' + encodeURIComponent(c.ref) + '&client=' + encodeURIComponent(D.client.id) +
    (D.client.email ? '&email=' + encodeURIComponent(D.client.email) : '') + '&marque=' + encodeURIComponent(D.client.marque);
  h += '<div class="ph"><div><h1>Il reste une étape</h1><p>Votre brief lance la production de votre ' + esc(nomPack(c)) + '. Comptez une quinzaine de minutes.</p></div>' +
    '<span class="pill a"><i></i>Brief attendu · #' + esc(c.ref) + '</span></div>';
  if (attente.length > 1) h += '<div class="filtres">' + attente.map(x => '<a class="chip' + (x.id === c.id ? ' on' : '') + '" href="#/brief/' + esc(x.id) + '">#' + esc(x.ref) + ' · ' + esc(nomPack(x)) + '</a>').join('') + '</div>';
  h += '<div class="card" style="overflow:hidden"><iframe src="' + esc(lien) + '" title="Votre brief Kreative" style="display:block;width:100%;height:calc(100vh - 260px);min-height:620px;border:0" allow="clipboard-write"></iframe></div>' +
    '<p class="muted" style="font-size:12.5px;margin-top:12px;text-align:center">Une fois votre brief envoyé, votre projet passe en production. Vous suivez son avancement dans « Mes projets ».</p>';
  return h;
}

// ---------- COMMANDER ----------
const AVANTAGES = {
  starter: [['6 visuels Ads', 1], ['Tous les formats Meta', 1], ['2 cycles de révisions', 1], ['Livraison en 48 h', 1], ['Contact WhatsApp inclus', 1], ['Angles marketing variés', 0], ['Support prioritaire', 0], ['Stratégie personnalisée', 0]],
  growth: [['12 visuels Ads', 1], ['Tous les formats Meta', 1], ['Révisions illimitées', 1], ['Livraison en 48 h', 1], ['Contact WhatsApp inclus', 1], ['Angles marketing variés', 1], ['Support prioritaire', 0], ['Stratégie personnalisée', 0]],
  scale: [['24 visuels Ads', 1], ['Tous les formats Meta', 1], ['Révisions illimitées', 1], ['Livraison en 72 h', 1], ['Contact WhatsApp inclus', 1], ['Angles marketing variés', 1], ['Support prioritaire', 1], ['Stratégie personnalisée', 1]]
};
function ecranCommander() {
  const m = formule === 'mensuel';
  let h = apercu() + '<div class="ph" style="justify-content:center;text-align:center"><div><h1>Vos prochaines créatives</h1>' +
    '<p style="max-width:560px;margin:8px auto 0">Une créative s\'use en trois à quatre semaines. Reprenez un pack quand vous en avez besoin, ou passez au mensuel et payez moins cher chaque commande.</p>' +
    '<div class="onglets" style="margin-top:18px"><button class="' + (m ? 'on' : '') + '" onclick="formule=\'mensuel\';K.rendre()">Mensuel · 15 % de moins</button>' +
    '<button class="' + (!m ? 'on' : '') + '" onclick="formule=\'unique\';K.rendre()">Commande unique</button></div></div></div>';
  h += '<div class="offres" style="max-width:1120px;margin:0 auto">' + ['starter', 'growth', 'scale'].map(k => {
    const P = D.packs[k], prix = m ? P.mensuel : P.unique, hot = k === 'growth';
    const stripe = LIENS.stripe[k][m ? 'mensuel' : 'unique'];
    const href = stripe || wa('Bonjour Kreative, je souhaite commander le Pack ' + P.nom + ' (' + (m ? 'mensuel' : 'commande unique') + ').');
    return '<div class="card offre' + (hot ? ' hot' : '') + '">' + (hot ? '<span class="badge-hot">Le plus choisi</span>' : '') +
      '<div style="display:flex;justify-content:space-between;align-items:center"><h3>Pack ' + esc(P.nom) + '</h3>' + (m ? '<span class="pill b">−15 %</span>' : '') + '</div>' +
      '<div class="prix">' + (m ? '<span class="barre-prix">' + P.unique + ' €</span>' : '') + prix + ' €' + (m ? ' <small>/ mois</small>' : '') + '</div>' +
      '<div class="unit">' + Math.floor(prix / P.creas) + ' € la créative · ' + P.creas + ' créatives' + (m ? ' chaque mois' : '') + '</div>' +
      '<a class="btn ' + (hot ? 'btn-p' : 'btn-d') + ' btn-bloc" href="' + esc(href) + '" target="_blank" rel="noopener">Commander</a>' +
      '<ul>' + AVANTAGES[k].map(a => '<li class="' + (a[1] ? '' : 'off') + '">' + i.coche + '<span>' + esc(a[0]) + '</span></li>').join('') + '</ul></div>';
  }).join('') +
    '<div class="card offre offre-c"><div><h3>Pack Custom</h3><div class="prix" style="font-size:32px">Sur mesure</div><div class="unit">Volume, rythme et délai définis avec vous</div>' +
    '<a class="btn btn-d" style="margin-top:20px" href="' + LIENS.iclosed + '" target="_blank" rel="noopener">Réserver un appel</a>' +
    '<p class="muted" style="font-size:12px;margin-top:10px">15 minutes, on cale le volume et vous repartez avec un devis.</p></div>' +
    '<ul style="display:grid;grid-template-columns:1fr 1fr;border:0;margin:0;padding:0">' + ['Volume de créatives illimité', 'Tous les formats Meta', 'Révisions illimitées', 'Délai de livraison négocié', 'Contact WhatsApp inclus',
      'Angles marketing variés', 'Support prioritaire', 'Stratégie personnalisée', 'Interlocuteur dédié', 'Cadence de livraison au choix'].map(a => '<li>' + i.coche + '<span>' + a + '</span></li>').join('') + '</ul></div></div>';
  h += '<p class="muted" style="text-align:center;margin-top:20px;font-size:12px">' + (m ? 'Les tarifs mensuels supposent un engagement de 3 mois, puis sans engagement.' : 'Paiement unique, sans engagement. Production lancée dès la réception de votre brief.') + '</p>';
  return h;
}

// ---------- CONTACT, AVIS ----------
function ecranContact() {
  return apercu() + '<div class="ph"><div><h1>Nous contacter</h1><p>Une question, une urgence, un ajustement : on répond sur WhatsApp, en général dans l\'heure.</p></div></div>' +
    '<div class="card" style="max-width:760px;overflow:hidden"><div style="background:linear-gradient(140deg,#25D366,#128C7E);padding:30px;color:#fff">' +
    '<div style="width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.2);display:grid;place-items:center">' + i.message.replace('<svg', '<svg width="24" height="24"') + '</div>' +
    '<h2 style="font-size:24px;margin-top:16px;color:#fff">WhatsApp</h2><p style="opacity:.92;margin-top:6px;max-width:420px">Le plus rapide. Votre message arrive directement à l\'équipe.</p></div>' +
    '<div style="padding:20px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap">' +
    '<div style="display:flex;gap:28px;flex-wrap:wrap"><div><div class="lab">Numéro</div><b>07 56 92 10 42</b></div><div><div class="lab">Réponse moyenne</div><b>Moins d\'une heure</b></div></div>' +
    '<a class="btn btn-lg" style="background:#25D366;color:#fff" href="' + wa('Bonjour Kreative, ') + '" target="_blank" rel="noopener">Nous écrire</a></div></div>' +
    '<div class="note" style="max-width:760px;margin-top:16px">Pour vos créatives elles-mêmes, laissez plutôt votre retour directement sur le visuel concerné, dans votre projet. C\'est là que notre équipe le récupère.</div>';
}
function ecranAvis() {
  return apercu() + '<div class="ph"><div><h1>Laissez-nous votre avis</h1><p>Un avis prend une minute et nous aide énormément.</p></div></div>' +
    '<div class="card pad" style="max-width:620px;text-align:center;padding:36px"><h2 style="font-size:21px">Comment s\'est passé votre projet ?</h2>' +
    '<div style="display:flex;gap:6px;justify-content:center;margin:20px 0">' + [1, 2, 3, 4, 5].map(() => '<a href="' + LIENS.trustpilot + '" target="_blank" rel="noopener" style="width:44px;height:44px;border-radius:9px;background:#00b67a;color:#fff;display:grid;place-items:center;font-size:21px;text-decoration:none">★</a>').join('') + '</div>' +
    '<p class="muted" style="font-size:13px">Cliquez sur une note : vous arrivez sur notre page Trustpilot.</p>' +
    '<a class="btn btn-lg" style="margin-top:18px;background:#00b67a;color:#fff" href="' + LIENS.trustpilot + '" target="_blank" rel="noopener">' + i.etoile + 'Écrire mon avis sur Trustpilot</a></div>';
}

// ---------- RENDU ----------
const ECRANS = {
  '': ['accueil', 'Accueil', () => ecranAccueil()],
  projets: ['projets', 'Mes projets', p => p[0] ? ecranProjet(p[0]) : ecranProjets()],
  brief: ['brief', 'Mon brief', p => ecranBrief(p[0])],
  commander: ['commander', 'Commander', () => ecranCommander()],
  contact: ['contact', 'Nous contacter', () => ecranContact()],
  avis: ['avis', 'Laisser un avis', () => ecranAvis()]
};
K.rendre = () => {
  if (!D) return;
  const r = K.route(), e = ECRANS[r.ecran] || ECRANS[''];
  const c = conf();
  document.getElementById('racine').innerHTML = K.coquille(c, e[0], K.ariane('accueil', 'Espace client', e[1]), e[2](r.params), r.ecran === 'brief');
  K.brancherCoquille(c);
  document.title = e[1] + ' · Kreative';
};
(async () => {
  try { D = await K.api('/api/client/moi'); K.rendre(); }
  catch (e) {
    if (e.statut === 401) location.href = '/client/connexion';
    else document.getElementById('racine').innerHTML = '<div class="chargement">Impossible de charger votre espace. ' + esc(e.message) + '</div>';
  }
})();
</script>
</body>
</html>
