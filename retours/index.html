<style> :root{   --bg:#FAF9F6; --panel:#FFFFFF; --panel2:#F3F2ED;   --line:#E4E2DA; --line2:#D2CFC4;   --tx:#111111; --tx2:#46505F; --tx3:#8C897E;   --sable:#A6A398; --argent:#C0C0C0;   --gut:32px;   box-sizing:border-box;   padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); } *,*::before,*::after{box-sizing:border-box} html{scroll-behavior:smooth; scroll-padding-top:18px} body{margin:0;background:var(--bg);color:var(--tx);   font-family:"DM Sans",-apple-system,"Segoe UI",sans-serif;font-size:15px;line-height:1.6;   -webkit-font-smoothing:antialiased} img{max-width:100%;display:block} a{color:inherit}  /* ---------- en-tête ---------- */ .top{background:var(--tx);color:#FAF9F6;padding:22px var(--gut)} .top .in{max-width:1000px;margin:0 auto} .top .in{display:flex;align-items:baseline;justify-content:space-between;gap:18px;flex-wrap:wrap} .top h1{font-size:26px;line-height:1.1;font-weight:600;letter-spacing:-.02em;margin:0} .top .infos{font-size:13.5px;color:#C9C6BC;font-variant-numeric:tabular-nums}  nav{background:rgba(250,249,246,.96);   backdrop-filter:blur(16px);border-bottom:1px solid var(--line)} nav .in{max-width:1000px;margin:0 auto;padding:0 var(--gut);display:flex;gap:26px;flex-wrap:wrap} nav a{color:var(--tx3);text-decoration:none;font-size:13.5px;font-weight:500;white-space:nowrap;   padding:13px 0;border-bottom:2px solid transparent;margin-bottom:-1px} nav a:hover{color:var(--tx);border-bottom-color:var(--tx)}  .wrap{max-width:1000px;margin:0 auto;padding:0 var(--gut) 90px} section{padding-top:64px} .sh{display:flex;align-items:center;gap:14px;margin-bottom:22px} .sh .n{flex:none;width:28px;height:28px;border-radius:8px;background:var(--tx);color:#FAF9F6;   font-size:12.5px;font-weight:600;display:flex;align-items:center;justify-content:center;   font-variant-numeric:tabular-nums} .sh h2{font-size:24px;font-weight:700;letter-spacing:-.02em;margin:0} .sh .dl{margin-left:auto}  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;   padding:8px 30px;box-shadow:0 1px 2px rgba(0,0,0,.03)}  /* ---------- site ---------- */ .sitecard{display:flex;align-items:center;justify-content:space-between;gap:18px;   background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:24px 30px;   text-decoration:none;transition:border-color .15s} .sitecard:hover{border-color:var(--tx)} .sitecard .u{font-size:23px;font-weight:600;letter-spacing:-.01em} .sitecard .go{flex:none;background:var(--tx);color:#FAF9F6;padding:11px 20px;border-radius:10px;   font-size:14px;font-weight:500}  /* ---------- brief ---------- */ .qa{display:grid;grid-template-columns:200px 1fr;gap:28px;   padding:26px 0;border-bottom:1px solid var(--line)} .qa:last-child{border-bottom:none} .qa h3{margin:0;font-size:15.5px;font-weight:600;color:var(--tx);letter-spacing:-.01em;line-height:1.4} .qa .rep{margin:0;font-size:15.5px;line-height:1.75;color:var(--tx2);white-space:pre-wrap} .qa .rep strong{color:var(--tx);font-weight:600} .qa .rep a{color:var(--tx);text-decoration:underline;text-underline-offset:3px} .vide{color:var(--tx3)} .def{display:block;margin-top:12px;font-size:14px;line-height:1.7;color:var(--tx3)} .def span{display:block} .def b{color:var(--tx2);font-weight:500}  /* ---------- pubs ---------- */ .shelf{display:grid;grid-template-columns:repeat(4,1fr);gap:14px} .shelf .br{grid-column:1/-1;height:0;margin:0;padding:0;border:none} .thumb{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden} a.thumb{display:block;text-decoration:none;color:inherit;transition:border-color .15s} a.thumb:hover{border-color:var(--tx)} .thumb .ph{aspect-ratio:4/5;background:var(--panel2);display:flex;align-items:center;   justify-content:center;color:var(--tx3);font-size:12px} .thumb .ph img{width:100%;height:100%;object-fit:cover} .thumb .cap{padding:11px 13px;font-size:12.5px;color:var(--tx2);   display:flex;justify-content:space-between;gap:8px;align-items:baseline} .thumb .cap b{color:var(--tx);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap} .age{color:var(--tx3);font-variant-numeric:tabular-nums;flex:none}  /* ---------- assets ---------- */ .sub{display:flex;align-items:center;gap:12px;margin:30px 0 14px;   font-size:13px;font-weight:600;color:var(--tx);letter-spacing:.01em} .sub::after{content:"";flex:1;height:1px;background:var(--line)} .sub:first-child{margin-top:0} .assets{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:14px} .asset{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;   transition:border-color .15s} .asset:hover{border-color:var(--tx)} .asset a{display:block;text-decoration:none;color:inherit} .asset .ph{aspect-ratio:1;background:var(--panel2);display:flex;align-items:center;   justify-content:center;color:var(--tx3);font-size:12px} .asset .ph img{width:100%;height:100%;object-fit:contain} .asset .cap{padding:10px 12px;font-size:12px;color:var(--tx2)} .asset .cap b{display:block;color:var(--tx);font-weight:600;font-size:12.5px;margin-bottom:1px} .asset .cap small{display:block;color:var(--tx3);font-size:11px;margin-top:4px}  .dl{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border:1px solid var(--tx);   border-radius:10px;background:var(--tx);color:#FAF9F6;font-size:13.5px;font-weight:500;   text-decoration:none;cursor:pointer;font-family:inherit} .dl:hover{opacity:.88}  @media(max-width:900px){ .shelf{grid-template-columns:repeat(3,1fr)} } @media(max-width:720px){   :root{--gut:20px}   .top{padding:13px var(--gut)}   .top h1{font-size:19px}   .top .infos{font-size:12.5px}   nav .in{gap:18px;overflow-x:auto;flex-wrap:nowrap;-webkit-overflow-scrolling:touch;     scrollbar-width:none}   nav .in::-webkit-scrollbar{display:none}   nav a{font-size:13px;padding:11px 0}   section{padding-top:44px}   .shelf{grid-template-columns:repeat(2,1fr)}   .qa{grid-template-columns:1fr;gap:8px;padding:22px 0}   .card{padding:6px 20px}   .sitecard{padding:20px;flex-direction:column;align-items:flex-start} } 
/* ---------- retours ---------- */
.liens{display:flex;gap:10px;flex-wrap:wrap;margin-top:28px}
.lien{display:inline-flex;align-items:center;gap:8px;padding:11px 18px;border:1px solid var(--line2);border-radius:10px;
  background:var(--panel);color:var(--tx);font-size:14px;font-weight:500;text-decoration:none;transition:border-color .15s}
.lien:hover{border-color:var(--tx)}
.mix{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.mix .bloc{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:24px 28px}
.mix .nb{font-size:44px;font-weight:700;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.mix .lb{margin-top:10px;font-size:15px;font-weight:600}
.mix .pc{margin-top:2px;font-size:13.5px;color:var(--tx3)}
.barre{display:flex;height:8px;border-radius:99px;overflow:hidden;margin-top:14px;background:var(--panel2)}
.barre i{display:block;background:var(--tx)} .barre i+i{background:var(--sable)}
.thumb .ph{aspect-ratio:4/5;background:#fff}
.thumb .ph img{object-fit:contain}
.etat{max-width:560px;margin:90px auto;padding:0 var(--gut);text-align:center;color:var(--tx2)}
.etat h1{font-size:22px;color:var(--tx);margin:0 0 8px}
@media(max-width:720px){ .mix{grid-template-columns:1fr} .mix .nb{font-size:36px} }

<div id="page"><div class="etat"><p>Chargement des retours...</p></div></div>
<script>
/* ============================================================
   RETOURS DU CLIENT  ·  retours/?projet=TURNLY_10_f665_L2
   Les reponses du client a son formulaire de retour, sur la
   livraison precedente. Ecrites par n8n (workflow « Retour client »)
   dans <projet>/retour.json. Meme style que le dossier de production.
   ============================================================ */
const P=(new URLSearchParams(location.search).get("projet")||"").replace(/[^A-Za-z0-9_]/g,"");
const esc=t=>String(t==null?"":t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const $=id=>document.getElementById(id);
const lire=async u=>{try{const r=await fetch(u+(u.includes("?")?"&":"?")+"t="+Date.now(),{cache:"no-store"});return r.ok?await r.json():null}catch(e){return null}};
const existe=async u=>{try{const r=await fetch(u,{method:"HEAD",cache:"no-store"});return r.ok}catch(e){return false}};
const vide=t=>!t||/^(non+|no|rien|ras|aucun(e)?|nan|n\/?a|-+|\.+)[.!]*$/i.test(String(t).trim());

/* 15/10 : le nom du brief selon le type de projet :
   sur-mesure -> « Brief de la livraison 2/4 », abonnement -> « Brief de novembre » */
function nomBrief(d){
  const M=["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
  const l=d&&d.livraison;
  if(d&&(d.abonnement||(l&&l.type==="abonnement"))){
    const m=M[new Date(Date.parse(d.deadline||"")||Date.now()).getMonth()];
    return "Brief "+(/^[aeiouâ]/.test(m)?"d'":"de ")+m;
  }
  if(l&&l.sur>1) return "Brief de la livraison "+l.n+"/"+l.sur;
  return "Brief du client";
}
function etat(titre,texte){
  $("page").innerHTML='<div class="etat"><h1>'+esc(titre)+'</h1><p>'+esc(texte)+'</p></div>';
}

/* une image : la copie sur GitHub, sinon le fichier d origine chez Fillout */
function vignette(f,legende){
  const src=f.chemin?"../"+f.chemin:(f.url||"");
  const secours=f.chemin&&f.url?' data-u="'+esc(f.url)+'" onerror="if(this.dataset.u){this.src=this.dataset.u;this.closest(\'a\').href=this.dataset.u;this.removeAttribute(\'data-u\')}"':"";
  const pdf=/\.pdf($|\?)/i.test(src);
  return '<a class="thumb" href="'+esc(src)+'" target="_blank" rel="noopener">'+
    '<div class="ph">'+(pdf?'PDF':'<img src="'+esc(src)+'"'+secours+' alt="'+esc(f.nom||"")+'" loading="lazy">')+'</div>'+
    '<div class="cap"><b>'+esc(legende)+'</b><span class="age">Ouvrir ↗</span></div></a>';
}

function section(id,n,titre,corps){
  return '<section id="'+id+'"><div class="sh"><span class="n">'+String(n).padStart(2,"0")+'</span><h2>'+esc(titre)+'</h2></div>'+corps+'</section>';
}

async function go(){
  if(!P) return etat("Lien incomplet","Il manque le code du projet dans le lien.");
  const [r,d]=await Promise.all([lire("../"+P+"/retour.json"),lire("../"+P+"/donnees.json")]);
  if(!r||r.dossier!==P) return etat("Pas encore de brief","Le client n'a pas encore rempli son formulaire pour cette livraison.");

  const marque=(d&&d.brand_name)||r.marque||P;
  const l=(d&&d.livraison)||null;
  document.title=marque+" | "+nomBrief(d);
  const quand=r.recu_le?new Date(r.recu_le).toLocaleDateString("fr-FR",{day:"numeric",month:"long",year:"numeric"}):"";
  const infos=[l&&l.sur>1?"Livraison "+l.n+"/"+l.sur:"", d&&d.nb_creas?d.nb_creas+" créas":"", quand?"reçus le "+quand:""].filter(Boolean).join(" · ");

  const blocs=[]; let n=0;
  const m=r.mix;
  if(m){
    const a=m.derives!=null?m.derives:m.derives_pct+" %", b=m.nouveaux!=null?m.nouveaux:m.nouveaux_pct+" %";
    blocs.push(["repartition","Répartition",section("repartition",++n,"Répartition demandée",
      '<div class="mix">'+
      '<div class="bloc"><div class="nb">'+esc(a)+'</div><div class="lb">Dérivés des créas gagnantes</div><div class="pc">'+m.derives_pct+' % de la livraison</div><div class="barre"><i style="width:'+m.derives_pct+'%"></i></div></div>'+
      '<div class="bloc"><div class="nb">'+esc(b)+'</div><div class="lb">Nouveaux concepts</div><div class="pc">'+m.nouveaux_pct+' % de la livraison</div><div class="barre"><i style="width:0"></i><i style="width:'+m.nouveaux_pct+'%"></i></div></div>'+
      '</div>')]);
  }
  const galerie=(l,base)=>'<div class="shelf">'+l.map((f,i)=>vignette(f,base+" "+String(i+1).padStart(2,"0"))).join("")+'</div>';
  if((r.gagnantes||[]).length) blocs.push(["gagnantes","Gagnantes",section("gagnantes",++n,"Les créas qui ont le mieux marché",galerie(r.gagnantes,"Gagnante"))]);
  if((r.perdantes||[]).length) blocs.push(["eviter","À ne pas refaire",section("eviter",++n,"Les créas à ne pas refaire",galerie(r.perdantes,"À éviter"))]);

  const qa=[["Nouveau dans l'offre",r.offre],["À ne plus utiliser",r.interdits],["À savoir",r.autre]].filter(x=>!vide(x[1]));
  if(qa.length) blocs.push(["change","Ce qui change",section("change",++n,"Ce qui change",
    '<div class="card">'+qa.map(x=>'<div class="qa"><h3>'+esc(x[0])+'</h3><p class="rep">'+esc(x[1])+'</p></div>').join("")+'</div>')]);

  if((r.nouveaux_visuels||[]).length) blocs.push(["visuels","Nouveaux visuels",section("visuels",++n,"Nouveaux visuels du client",
    '<p class="def" style="margin:-8px 0 18px">À utiliser comme assets dans les créas de cette livraison.</p>'+galerie(r.nouveaux_visuels,"Visuel"))]);
  if((r.captures||[]).length) blocs.push(["resultats","Résultats",section("resultats",++n,"Ses résultats publicitaires",galerie(r.captures,"Capture"))]);

  const projet=(l&&l.projet)||"";
  const precedente=r.apres||"";
  const prevCreas=precedente&&await existe("../"+precedente+"/creas/");
  const liens=[
    projet?'<a class="lien" href="../'+esc(projet)+'/" target="_blank" rel="noopener">Dossier de production ↗</a>':"",
    prevCreas?'<a class="lien" href="../'+esc(precedente)+'/creas/" target="_blank" rel="noopener">Voir la livraison précédente ↗</a>':"",
    '<a class="lien" href="../fiche/?projet='+esc(P)+'" target="_blank" rel="noopener">Ouvrir la fiche ↗</a>'
  ].filter(Boolean).join("");

  $("page").innerHTML=
    '<div class="head"><div class="top"><div class="in"><h1>'+esc(marque)+' · '+esc(nomBrief(d).charAt(0).toLowerCase()+nomBrief(d).slice(1))+'</h1><div class="infos">'+esc(infos)+'</div></div></div>'+
    '<nav><div class="in">'+blocs.map(b=>'<a href="#'+b[0]+'">'+esc(b[1])+'</a>').join("")+'</div></nav></div>'+
    '<div class="wrap"><div class="liens">'+liens+'</div>'+blocs.map(b=>b[2]).join("")+'</div>';
}
go();
</script>
</body>
</html>
