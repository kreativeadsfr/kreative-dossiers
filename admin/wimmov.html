<body>
<div id="racine"><div class="chargement">Chargement…</div></div>
<script>
/* ============================================================
   ADMIN · WIMMOV (client à part, contrat spécial)
   Kreative fait et livre ses créatives elle-même : chaque semaine,
   une livraison (PNG en 1:1, 4:5, 9:16) envoyée directement dans
   l'espace Wimmov, avec un email à Hugo et au media buyer.
   Le stratégiste et la designer ne voient jamais Wimmov.
   ============================================================ */
const { i, esc } = K;
let D = null, MOI = null;
const MOIS = ['janvier', 'février', 'mars', 'avril', 'mai', 'juin', 'juillet', 'août', 'septembre', 'octobre', 'novembre', 'décembre'];
const moisDe = ms => { const d = new Date(ms || Date.now()); return MOIS[d.getMonth()] + ' ' + d.getFullYear(); };
const nomCmd = c => c.formule === 'mensuel' ? 'Abonnement · ' + moisDe(c.cree_le) : 'Créatives en plus · ' + c.nb_creas + ' créatives';
const NOMS_F = { '1x1': '1:1', '4x5': '4:5', '9x16': '9:16', autre: 'Autre' };
const ST = { brouillon: ['Pas encore envoyée', 'a'], envoyee: ['Chez Wimmov', 'b'], review_terminee: ['Chez Wimmov', 'b'], approuvee: ['Chez Wimmov', 'g'], a_verifier: ['À vérifier', 'a'], a_corriger: ['À corriger', 'r'] };
const pill = st => { const x = ST[st] || [st, '']; return '<span class="pill ' + x[1] + '"><i></i>' + esc(x[0]) + '</span>'; };
const taille = n => n > 1e6 ? (n / 1e6).toFixed(1).replace('.', ',') + ' Mo' : Math.max(1, Math.round((n || 0) / 1e3)) + ' ko';
async function charger() { D = await K.api('/api/admin/wimmov'); }
async function recharger() { await charger(); K.rendre(); }

function conf() {
  const n = D && D.client ? (D.retours || []).filter(r => Date.now() - r.envoye_le < 7 * 864e5).length : 0;
  return {
    sections: [
      { titre: 'Admin', liens: [{ id: 'admin', texte: 'Retour au tableau de bord', icone: 'gauche', href: '/admin/' }] },
      { titre: 'Wimmov', liens: [
        { id: 'accueil', texte: 'Vue d\'ensemble', icone: 'accueil', href: '#/' },
        { id: 'livrer', texte: 'Livrer', icone: 'envoi', href: '#/livrer' },
        { id: 'retours', texte: 'Retours de Wimmov', icone: 'message', href: '#/retours', nb: n || '' },
        { id: 'commandes', texte: 'Mois et commandes', icone: 'sac', href: '#/commandes' },
        { id: 'acces', texte: 'Accès et emails', icone: 'gens', href: '#/acces' }] }],
    clair: true,
    qui: { nom: MOI && MOI.nom ? MOI.nom.charAt(0).toUpperCase() + MOI.nom.slice(1) : 'Admin', role: 'Fondateur · admin' },
    sortie: '/_deconnexion'
  };
}
const sansClient = () => '<div class="ph"><div><h1>Wimmov</h1><p>L\'espace Wimmov n\'existe pas encore.</p></div></div>' +
  '<div class="card pad" style="max-width:640px"><p style="font-size:14px;line-height:1.6">Créez le client depuis <b>Clients</b>, puis <b>Nouveau client</b>, avec son adresse <b>@wimmov.com</b> (Hugo). ' +
  'L\'espace Wimmov s\'active tout seul pour cette adresse. Il se crée aussi au premier paiement de son lien Stripe.</p>' +
  '<a class="btn btn-p" style="margin-top:14px" href="/admin/#/clients/nouveau">' + i.plus + 'Nouveau client</a></div>';

// ---------- VUE D'ENSEMBLE ----------
function ecranAccueil() {
  if (!D.client) return sansClient();
  const c = D.client, mois = D.commandes.find(x => x.formule === 'mensuel');
  const abo = (D.abonnements || [])[0], dernier = (D.retours || [])[0];
  let h = '<div class="ph"><div><h1>Wimmov</h1><p>' + esc(c.contact || '') + (c.contact ? ' · ' : '') + esc(c.email) + ' · ' + D.contrat.creas_mois + ' créatives par mois, ' + K.euros(D.contrat.prix_mois) + ', livrées en ' + D.contrat.livraisons_mois + ' fois.</p></div>' +
    '<div class="act"><a class="btn btn-s" href="/client/?client=' + esc(c.id) + '" target="_blank" rel="noopener">' + i.oeil + 'Voir son espace</a><a class="btn btn-p" href="#/livrer">' + i.envoi + 'Livrer</a></div></div>';
  const envoyees = mois ? mois.livraisons.filter(l => l.statut !== 'brouillon').length : 0;
  h += '<div class="grid g4">' +
    '<div class="card kpi"><div class="lab">Ce mois-ci</div><div class="v s">' + (mois ? envoyees + ' / ' + D.contrat.livraisons_mois : '0') + '</div><div class="d">' + (mois ? (mois.livrees || 0) + ' créatives livrées sur ' + mois.nb_creas : 'aucun mois en cours') + '</div></div>' +
    '<div class="card kpi"><div class="lab">Abonnement Stripe</div><div class="v s">' + (abo ? { actif: 'Actif', resiliation: 'S\'arrête bientôt', termine: 'Terminé' }[abo.statut] || 'Actif' : 'Pas encore') + '</div><div class="d">' + (abo ? abo.mois_payes + ' mois payé' + (abo.mois_payes > 1 ? 's' : '') + ' par le portail' : 'au premier paiement du lien') + '</div></div>' +
    '<a class="card kpi lien-kpi" href="#/retours"><div class="lab">Derniers retours</div><div class="v s">' + (dernier ? esc(K.date(dernier.envoye_le, { year: undefined })) : 'Aucun') + '</div><div class="d">' + (dernier ? (dernier.auteur ? 'de ' + esc(dernier.auteur) : 'de Wimmov') : 'rien pour l\'instant') + '</div></a>' +
    '<a class="card kpi lien-kpi" href="#/acces"><div class="lab">Emails</div><div class="v s">' + (1 + (D.emails || []).length) + '</div><div class="d">Hugo' + ((D.emails || []).length ? ' + ' + D.emails.length + ' autre' + (D.emails.length > 1 ? 's' : '') : '') + '</div></a></div>';
  h += '<div class="sec"><div><h2>Livraisons</h2><p>Les dernières, tous mois confondus.</p></div><a class="btn btn-g btn-sm" href="#/livrer">Tout voir</a></div>' + tableLivraisons(D.commandes.flatMap(k => k.livraisons.map(l => ({ ...l, k }))).sort((a, b) => (b.envoye_le || b.cree_le || 0) - (a.envoye_le || a.cree_le || 0)).slice(0, 6));
  if (dernier) h += '<div class="sec"><div><h2>Derniers retours de Wimmov</h2></div><a class="btn btn-g btn-sm" href="#/retours">Tous les retours</a></div>' + carteRetour(dernier);
  return h;
}
function tableLivraisons(L) {
  if (!L.length) return '<div class="card"><div class="vide">' + i.envoi + 'Aucune livraison pour l\'instant.</div></div>';
  return '<div class="card"><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Livraison</th><th class="num">Créatives</th><th>Statut</th><th>Envoyée le</th><th></th></tr></thead><tbody>' +
    L.map(l => '<tr class="clic" onclick="location.hash=\'#/livraison/' + esc(l.dossier) + '\'"><td><b>Livraison ' + l.n + (l.version > 1 ? ' · version ' + l.version : '') + '</b><span class="sub">' + esc(nomCmd(l.k)) + '</span></td>' +
      '<td class="num">' + (l.creatives || 0) + '</td><td>' + pill(l.statut) + '</td><td>' + (l.envoye_le ? esc(K.dateHeure(l.envoye_le)) : '<span class="muted">Pas encore</span>') + '</td>' +
      '<td class="fin"><span class="btn btn-s btn-sm">Ouvrir</span></td></tr>').join('') + '</tbody></table></div></div>';
}

// ---------- LIVRER ----------
function ecranLivrer() {
  if (!D.client) return sansClient();
  let h = '<div class="ph"><div><h1>Livrer</h1><p>Choisissez le mois (ou la commande en plus), créez la livraison suivante, déposez les PNG, envoyez. Wimmov la voit tout de suite.</p></div></div>';
  if (!D.commandes.length) return h + '<div class="card pad"><p style="font-size:14px">Aucun mois pour l\'instant. Il se crée au paiement de son lien Stripe, ou à la main dans <a href="#/commandes" style="color:var(--blue-tx)">Mois et commandes</a>.</p></div>';
  for (const k of D.commandes.filter(x => x.statut !== 'annule')) {
    const brouillon = k.livraisons.find(l => l.statut === 'brouillon');
    h += '<div class="sec"><div><h2>' + esc(nomCmd(k)) + '</h2><p>#' + esc(k.ref) + ' · ' + k.nb_creas + ' créatives · ' + (k.livrees || 0) + ' livrées</p></div>' +
      '<button class="btn ' + (brouillon ? 'btn-s' : 'btn-p') + ' btn-sm" data-nouvelle="' + esc(k.id) + '">' + i.plus + (brouillon ? 'Reprendre la livraison ' + brouillon.n : 'Livraison ' + (k.livraisons.reduce((n, l) => Math.max(n, l.n), 0) + 1)) + '</button></div>' +
      tableLivraisons(k.livraisons.map(l => ({ ...l, k })));
  }
  return h;
}
function brancherLivrer() {
  document.querySelectorAll('[data-nouvelle]').forEach(b => b.onclick = async () => {
    b.disabled = true;
    try { const l = await K.api('/api/admin/wimmov/livraisons', { methode: 'POST', corps: { commande_id: b.dataset.nouvelle } }); await charger(); K.aller('#/livraison/' + l.dossier); }
    catch (e) { K.toast(e.message); b.disabled = false; }
  });
}

// ---------- UNE LIVRAISON : dépôt des PNG, envoi ----------
const LV = { dossier: null, donnees: null, envois: [], choix: null };
async function chargerLivraison(d) {
  LV.dossier = d;
  try { LV.donnees = await K.api('/api/admin/wimmov/livraisons/' + d); } catch (e) { LV.donnees = { versions: [], erreur: e.message }; }
  if (!LV.donnees.versions.find(v => v.id === LV.choix)) LV.choix = (LV.donnees.versions[0] || {}).id;
  K.rendre();
}
const numero = d => Number((String(d).match(/_L(\d+)$/) || [])[1]) || 1;
function ecranLivraison(d) {
  const k = D.commandes.find(x => x.dossier && d.startsWith(x.dossier + '_L'));
  let h = '<a class="retour" href="#/livrer">' + i.gauche + 'Livrer</a>';
  if (!k) return h + '<div class="card"><div class="vide">Livraison introuvable.</div></div>';
  if (LV.dossier !== d) { LV.dossier = d; LV.donnees = null; LV.envois = []; setTimeout(() => chargerLivraison(d), 0); }
  h += '<div class="ph"><div><h1>Livraison ' + numero(d) + '</h1><p>' + esc(nomCmd(k)) + ' · PNG en 1:1, 4:5 et 9:16, le format est reconnu à la taille.</p></div></div>';
  if (!LV.donnees) return h + '<div class="card"><div class="vide">Chargement…</div></div>';
  const V = LV.donnees.versions, der = V[0], travail = der && der.statut === 'brouillon' ? der : null, F = travail ? travail.fichiers : [];
  if (travail) {
    const par = f => F.filter(x => x.format === f).length;
    h += '<div class="card pad"><h3 style="font-size:16px">Déposer les fichiers' + (travail.version > 1 ? ' · version ' + travail.version : '') + '</h3>' +
      (travail.version > 1 ? '<p class="muted" style="font-size:13px;margin-top:4px">Cette version reprend les fichiers de la précédente : un fichier du même nom remplace l\'ancien.</p>' : '') +
      '<div class="depot" id="lv-depot" style="margin-top:14px">' + i.telecharger + '<b>Glissez les PNG ici, ou cliquez pour les choisir</b><small>PNG seulement. 1080 × 1080, 1080 × 1350 et 1080 × 1920.</small><input type="file" id="lv-fichiers" multiple accept="image/png,.png" hidden></div>' +
      '<div class="envois" id="lv-envois"></div>' +
      '<div class="compte-formats">' + ['1x1', '4x5', '9x16'].map(f => '<span class="pill ' + (par(f) ? 'g' : '') + '">' + NOMS_F[f] + ' · ' + par(f) + '</span>').join('') + (par('autre') ? '<span class="pill r">Autres tailles · ' + par('autre') + '</span>' : '') + '</div>' +
      '<div style="display:flex;gap:10px;margin-top:18px;flex-wrap:wrap"><button class="btn btn-p btn-lg" id="lv-envoyer"' + (F.length ? '' : ' disabled') + '>' + i.envoi + 'Envoyer à Wimmov' + (F.length ? ' (' + F.length + ' fichiers)' : '') + '</button>' +
      '<button class="btn btn-g" id="lv-jeter">' + i.poubelle + 'Supprimer ce brouillon</button></div>' +
      '<p class="muted" style="font-size:12.5px;margin-top:10px">Wimmov la voit tout de suite dans son espace. Hugo et les adresses ajoutées reçoivent un email.</p></div>';
  } else if (der) {
    h += '<div class="etat-envoi" style="margin:0 0 18px"><span class="pastille">' + i.coche + '</span><div style="flex:1"><b>Envoyée à Wimmov' + (der.envoye_le ? ' le ' + esc(K.dateHeure(der.envoye_le)) : '') + '</b><small>Version ' + der.version + ' · ' + der.fichiers.length + ' fichiers.</small></div>' +
      '<button class="btn btn-s" id="lv-version">' + i.crayon + 'Nouvelle version</button></div>';
  }
  const vue = V.find(v => v.id === LV.choix) || der;
  if (vue) h += (V.length > 1 ? K.rv.puces(V, vue.id, v => 'Version ' + v.version) : '') + K.rv.grille(vue, { mode: 'admin', sansCompte: true, titre: 'Version ' + vue.version, sousTitre: vue.fichiers.length + ' fichiers', supprimer: vue.statut === 'brouillon' });
  return h;
}
function dimensions(f) {
  return new Promise(ok => { const im = new Image(); im.onload = () => { ok({ l: im.naturalWidth, h: im.naturalHeight }); URL.revokeObjectURL(im.src); }; im.onerror = () => ok({ l: 0, h: 0 }); im.src = URL.createObjectURL(f); });
}
const formatDe = d => { if (!d.l || !d.h) return 'autre'; const r = d.l / d.h; return Math.abs(r - 1) < .03 ? '1x1' : Math.abs(r - .8) < .03 ? '4x5' : Math.abs(r - .5625) < .03 ? '9x16' : 'autre'; };
function miniature(f) {
  return new Promise(ok => { const im = new Image(); im.onload = () => { const c = document.createElement('canvas'), t = 480, k = Math.min(1, t / Math.max(im.naturalWidth, im.naturalHeight));
    c.width = Math.round(im.naturalWidth * k); c.height = Math.round(im.naturalHeight * k); c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); c.toBlob(b => ok(b), 'image/jpeg', .8); }; im.onerror = () => ok(null); im.src = URL.createObjectURL(f); });
}
function envoyerFichier(livraison, f, format, d, suivi) {
  return new Promise((ok, ko) => {
    const x = new XMLHttpRequest();
    x.open('PUT', '/api/equipe/fichiers?livraison=' + encodeURIComponent(livraison) + '&format=' + format + '&nom=' + encodeURIComponent(f.name) + '&l=' + d.l + '&h=' + d.h);
    x.setRequestHeader('Content-Type', 'image/png');
    x.upload.onprogress = e => { if (e.lengthComputable) suivi(Math.round(e.loaded * 100 / e.total)); };
    x.onload = () => { let r = {}; try { r = JSON.parse(x.responseText); } catch (e) {} if (x.status < 300) ok(r); else ko(new Error(r.erreur || 'Envoi impossible (' + x.status + ')')); };
    x.onerror = () => ko(new Error('Connexion perdue'));
    x.send(f);
  });
}
async function deposer(fichiers) {
  const travail = LV.donnees && LV.donnees.versions[0];
  if (!travail || travail.statut !== 'brouillon') return;
  const refuses = Array.from(fichiers).filter(f => f.type !== 'image/png');
  if (refuses.length) K.toast(refuses.length + ' fichier' + (refuses.length > 1 ? 's' : '') + ' ignoré' + (refuses.length > 1 ? 's' : '') + ' : PNG seulement.');
  const file = Array.from(fichiers).filter(f => f.type === 'image/png').map(f => ({ f, nom: f.name, pc: 0, etat: 'en attente', ok: false }));
  if (!file.length) return;
  LV.envois = file;
  const maj = () => { const z = document.getElementById('lv-envois'); if (z) z.innerHTML = LV.envois.map(e => '<div class="envoi-l"><span>' + esc(e.nom) + '</span><div class="barre' + (e.ok ? ' g' : '') + '"><i style="width:' + e.pc + '%"></i></div><small class="muted">' + esc(e.etat) + '</small></div>').join(''); };
  maj();
  let n = 0;
  const travailleur = async () => {
    while (n < file.length) {
      const e = file[n++];
      try {
        const d = await dimensions(e.f), fmt = formatDe(d); e.etat = NOMS_F[fmt]; maj();
        const r = await envoyerFichier(travail.id, e.f, fmt, d, pc => { e.pc = pc; maj(); });
        const mini = await miniature(e.f);
        if (mini && r.id) await fetch('/api/equipe/fichiers/' + r.id + '/mini', { method: 'PUT', headers: { 'Content-Type': 'image/jpeg' }, body: mini, credentials: 'same-origin' });
        e.pc = 100; e.ok = true; e.etat = NOMS_F[fmt] + ' ✓';
      } catch (err) { e.etat = err.message; }
      maj();
    }
  };
  await Promise.all([travailleur(), travailleur(), travailleur()]);
  LV.envois = file.filter(e => !e.ok);
  await chargerLivraison(LV.dossier);
}
function brancherLivraison(d) {
  const V = (LV.donnees && LV.donnees.versions) || [], vue = V.find(v => v.id === LV.choix) || V[0];
  document.querySelectorAll('[data-rv-version]').forEach(b => b.onclick = () => { LV.choix = b.dataset.rvVersion; K.rendre(); });
  if (vue) {
    K.rv.brancher(vue, { mode: 'admin', nomZip: ('Wimmov-livraison-' + numero(d) + '-v' + vue.version), rendre: () => K.rendre(), auteur: 'Kreative', peutCommenter: () => false, peutApprouver: () => false, api: {} });
    document.querySelectorAll('[data-rv-suppr]').forEach(b => b.onclick = async e => {
      e.stopPropagation();
      try { await K.api('/api/equipe/fichiers/' + b.dataset.rvSuppr, { methode: 'DELETE' }); await chargerLivraison(d); } catch (err) { K.toast(err.message); }
    });
  }
  const zone = document.getElementById('lv-depot'), champ = document.getElementById('lv-fichiers');
  if (zone && champ) {
    zone.onclick = () => champ.click();
    champ.onchange = () => deposer(champ.files);
    zone.ondragover = e => { e.preventDefault(); zone.classList.add('survol'); };
    zone.ondragleave = () => zone.classList.remove('survol');
    zone.ondrop = e => { e.preventDefault(); zone.classList.remove('survol'); deposer(e.dataTransfer.files); };
  }
  const env = document.getElementById('lv-envoyer');
  if (env) env.onclick = async () => {
    const t = V[0], par = f => t.fichiers.filter(x => x.format === f).length;
    const manque = ['1x1', '4x5', '9x16'].filter(f => !par(f));
    if (!await K.confirmer('Envoyer la livraison ' + numero(d) + ' à Wimmov ?', t.fichiers.length + ' fichiers' + (manque.length ? ', rien en ' + manque.map(f => NOMS_F[f]).join(', ') : '') + '. Wimmov la voit tout de suite, Hugo et les adresses ajoutées reçoivent un email.', 'Envoyer à Wimmov')) return;
    env.disabled = true;
    try { const r = await K.api('/api/admin/wimmov/livraisons/' + t.id + '/envoyer', { methode: 'POST' }); K.toast(r.message); await charger(); await chargerLivraison(d); }
    catch (e) { K.toast(e.message); env.disabled = false; }
  };
  const jeter = document.getElementById('lv-jeter');
  if (jeter) jeter.onclick = async () => {
    if (!await K.confirmer('Supprimer ce brouillon ?', 'Les fichiers déposés dans ce brouillon sont effacés. Wimmov ne l\'a jamais vu.', 'Supprimer', true)) return;
    try { await K.api('/api/equipe/livraisons/' + V[0].id, { methode: 'DELETE' }); await charger(); LV.dossier = null; K.aller(V.length > 1 ? '#/livraison/' + d : '#/livrer'); } catch (e) { K.toast(e.message); }
  };
  const nv = document.getElementById('lv-version');
  if (nv) nv.onclick = async () => {
    nv.disabled = true;
    try { await K.api('/api/admin/wimmov/livraisons', { methode: 'POST', corps: { dossier: d } }); await charger(); await chargerLivraison(d); }
    catch (e) { K.toast(e.message); nv.disabled = false; }
  };
}

// ---------- RETOURS DE WIMMOV ----------
function carteRetour(r) {
  return '<div class="card w-retour"><div class="tete"><b>' + esc(K.dateHeure(r.envoye_le)) + '</b><span class="muted" style="font-size:13px">' + (r.auteur ? 'De ' + esc(r.auteur) : 'De Wimmov') + '</span></div>' +
    (r.texte ? '<div class="texte">' + esc(r.texte) + '</div>' : '') +
    (r.liens && r.liens.length ? '<div class="w-liens">' + r.liens.map(l => '<a href="' + esc(l) + '" target="_blank" rel="noopener">' + esc(l) + '</a>').join('') + '</div>' : '') +
    (r.pieces && r.pieces.length ? '<div class="w-pieces">' + r.pieces.map(p => '<a class="w-piece" href="' + esc(p.url) + '?dl=1">' + i.telecharger + '<span>' + esc(p.nom) + '</span><small class="muted">' + taille(p.taille) + '</small></a>').join('') + '</div>' : '') + '</div>';
}
function ecranRetours() {
  if (!D.client) return sansClient();
  return '<div class="ph"><div><h1>Retours de Wimmov</h1><p>Ce que Hugo ou son media buyer déposent chaque semaine : texte, liens et fichiers. Vous recevez aussi un email à chaque envoi.</p></div></div>' +
    ((D.retours || []).length ? D.retours.map(carteRetour).join('') : '<div class="card"><div class="vide">' + i.message + 'Aucun retour pour l\'instant.</div></div>');
}

// ---------- MOIS ET COMMANDES ----------
function ecranCommandes() {
  if (!D.client) return sansClient();
  let h = '<div class="ph"><div><h1>Mois et commandes</h1><p>Un mois d\'abonnement se crée seul à chaque paiement Stripe. Ajoutez-en un à la main s\'il a payé autrement.</p></div>' +
    '<div class="act"><button class="btn btn-s" id="c-extra">' + i.plus + 'Créatives en plus</button><button class="btn btn-p" id="c-mois">' + i.plus + 'Ajouter un mois</button></div></div>';
  h += D.commandes.length ? '<div class="card"><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Commande</th><th class="num">Créatives</th><th class="num">Livrées</th><th class="num">Prix</th><th>Livraisons</th></tr></thead><tbody>' +
    D.commandes.map(k => '<tr><td><b>' + esc(nomCmd(k)) + '</b><span class="sub">#' + esc(k.ref) + ' · ' + esc(K.date(k.cree_le)) + '</span></td><td class="num">' + k.nb_creas + '</td><td class="num">' + (k.livrees || 0) + '</td>' +
      '<td class="num">' + K.euros(k.prix) + '</td><td>' + k.livraisons.filter(l => l.statut !== 'brouillon').length + (k.formule === 'mensuel' ? ' / ' + D.contrat.livraisons_mois : '') + '</td></tr>').join('') + '</tbody></table></div></div>'
    : '<div class="card"><div class="vide">' + i.sac + 'Aucune commande pour l\'instant.</div></div>';
  if ((D.factures || []).length) h += '<div class="sec"><div><h2>Factures</h2></div></div><div class="card"><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Facture</th><th class="num">Montant</th><th>Statut</th><th>Date</th></tr></thead><tbody>' +
    D.factures.map(f => '<tr><td><b>' + esc(f.numero || 'Facture') + '</b></td><td class="num">' + K.euros(f.montant) + '</td><td>' + esc(f.statut) + '</td><td>' + esc(K.date(f.emise_le)) + '</td></tr>').join('') + '</tbody></table></div></div>';
  return h;
}
function brancherCommandes() {
  const ajouter = async (corps, msg) => { try { await K.api('/api/admin/wimmov/commandes', { methode: 'POST', corps }); K.toast(msg); await recharger(); } catch (e) { K.toast(e.message); } };
  const m = document.getElementById('c-mois');
  if (m) m.onclick = async () => { if (await K.confirmer('Ajouter un mois ?', D.contrat.creas_mois + ' créatives, ' + K.euros(D.contrat.prix_mois) + '. À faire seulement s\'il a payé hors de son lien Stripe (sinon le mois se crée seul).', 'Ajouter le mois')) ajouter({ type: 'mois' }, 'Mois ajouté'); };
  const x = document.getElementById('c-extra');
  if (x) x.onclick = () => {
    const v = K.fenetre('<div class="fen-h"><h2>Créatives en plus</h2><p>Une commande payée hors du portail. Ses tarifs : 6 = 180 €, 12 = 280 €, 24 = 490 €, au-delà 20 € la créative.</p></div><div class="fen-b">' +
      '<div class="grid g2" style="gap:12px"><div class="champ"><label for="x-nb">Créatives</label><input class="in" id="x-nb" type="number" min="1" value="12"></div><div class="champ"><label for="x-prix">Prix (€)</label><input class="in" id="x-prix" type="number" min="0" placeholder="Calculé si vide"></div></div></div>' +
      '<div class="fen-f"><button class="btn btn-s" data-n>Annuler</button><button class="btn btn-p" data-o>Ajouter</button></div>');
    v.querySelector('[data-n]').onclick = () => K.fermer();
    v.querySelector('[data-o]').onclick = () => { const nb = v.querySelector('#x-nb').value, prix = v.querySelector('#x-prix').value; K.fermer(); ajouter({ type: 'extra', nb_creas: nb, prix }, 'Commande ajoutée'); };
  };
}

// ---------- ACCÈS ET EMAILS ----------
function ecranAcces() {
  if (!D.client) return sansClient();
  const c = D.client;
  return '<div class="ph"><div><h1>Accès et emails</h1><p>Un seul espace pour toute l\'équipe Wimmov. Chaque adresse reçoit le lien de l\'espace et chaque nouvelle livraison.</p></div></div>' +
    '<div class="grid g2" style="align-items:start"><div class="card pad"><h3 style="font-size:16px">Qui reçoit les emails</h3><div style="margin-top:10px">' +
    '<div class="w-mail"><div><b>' + esc(c.contact || c.marque) + '</b><div class="muted" style="font-size:13px">' + esc(c.email) + '</div></div><button class="btn btn-s btn-sm" data-lien-a="' + esc(c.email) + '">' + i.mail + 'Envoyer le lien</button></div>' +
    (D.emails || []).map(m => '<div class="w-mail"><div>' + esc(m) + '</div><div style="display:flex;gap:6px"><button class="btn btn-s btn-sm" data-lien-a="' + esc(m) + '">' + i.mail + 'Envoyer le lien</button><button class="btn btn-g btn-sm" data-mail-x="' + esc(m) + '">Retirer</button></div></div>').join('') + '</div>' +
    '<div class="champ" style="margin-top:14px"><label for="a-mail">Ajouter une adresse (le media buyer…)</label><div class="w-l"><input class="in" id="a-mail" type="email" placeholder="mediabuyer@wimmov.com"><button class="btn btn-p" id="a-ok">Ajouter</button></div></div></div>' +
    '<div class="card pad"><h3 style="font-size:16px">Le lien de l\'espace</h3><p class="muted" style="font-size:13.5px;margin-top:6px">Le même pour toute l\'équipe Wimmov.</p>' +
    '<div class="w-l" style="margin-top:12px"><input class="in" readonly value="' + esc(c.lien) + '"><button class="btn btn-s" id="a-copier">' + i.copier + 'Copier</button></div>' +
    '<button class="btn btn-p" style="margin-top:14px" data-lien-a="">' + i.mail + 'Envoyer le lien à tout le monde</button></div></div>';
}
function brancherAcces() {
  const enregistrer = async emails => { try { const r = await K.api('/api/admin/wimmov/acces', { methode: 'PATCH', corps: { emails } }); D.emails = r.emails; K.rendre(); return true; } catch (e) { K.toast(e.message); return false; } };
  const ok = document.getElementById('a-ok'), champ = document.getElementById('a-mail');
  if (ok) ok.onclick = async () => { const m = champ.value.trim().toLowerCase(); if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(m)) return K.toast('Adresse email invalide.'); if (await enregistrer((D.emails || []).concat(m))) K.toast('Adresse ajoutée. Envoyez-lui le lien quand vous voulez.'); };
  document.querySelectorAll('[data-mail-x]').forEach(b => b.onclick = async () => { if (await enregistrer((D.emails || []).filter(x => x !== b.dataset.mailX))) K.toast('Adresse retirée'); });
  document.querySelectorAll('[data-lien-a]').forEach(b => b.onclick = async () => {
    b.disabled = true;
    try { const r = await K.api('/api/admin/wimmov/lien', { methode: 'POST', corps: b.dataset.lienA ? { a: b.dataset.lienA } : {} }); K.toast(r.message); } catch (e) { K.toast(e.message); }
    b.disabled = false;
  });
  const c = document.getElementById('a-copier');
  if (c) c.onclick = () => K.copier(D.client.lien, 'Lien copié');
}

// ---------- RENDU ----------
const ECRANS = {
  '': ['accueil', 'accueil', () => ['Wimmov'], () => ecranAccueil()],
  livrer: ['livrer', 'envoi', () => ['Wimmov', 'Livrer'], () => ecranLivrer(), () => brancherLivrer()],
  livraison: ['livrer', 'envoi', p => ['Wimmov', 'Livrer', 'Livraison ' + numero(p[0] || '')], p => ecranLivraison(p[0] || ''), p => brancherLivraison(p[0] || '')],
  retours: ['retours', 'message', () => ['Wimmov', 'Retours'], () => ecranRetours()],
  commandes: ['commandes', 'sac', () => ['Wimmov', 'Mois et commandes'], () => ecranCommandes(), () => brancherCommandes()],
  acces: ['acces', 'gens', () => ['Wimmov', 'Accès et emails'], () => ecranAcces(), () => brancherAcces()]
};
K.rendre = () => {
  if (!D) return;
  const r = K.route(), e = ECRANS[r.ecran] || ECRANS[''];
  const c = conf();
  document.getElementById('racine').innerHTML = K.coquille(c, e[0], K.ariane(e[1], ...e[2](r.params)), e[3](r.params), false);
  K.brancherCoquille(c);
  if (e[4]) e[4](r.params);
  document.title = 'Wimmov · Kreative';
};
(async () => {
  try { MOI = await K.lireJson('/_moi'); await charger(); K.rendre(); setInterval(async () => { if (document.visibilityState === 'visible' && !document.querySelector('#k-fen, .rv-v') && !LV.envois.length && K.route().ecran !== 'livraison') { try { await recharger(); } catch (e) {} } }, 30000); }
  catch (e) { document.getElementById('racine').innerHTML = '<div class="chargement">Impossible de charger la page Wimmov. ' + esc(e.message) + '</div>'; }
})();
</script>
</body>
</html>
