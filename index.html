<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Espace Kreative</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="stylesheet" href="ui/kreative.css">
<style>
.w{max-width:1060px;margin:0 auto;padding:0 24px 90px}
.hero{margin:54px 0 30px}
.hero h1{font:600 48px/1.02 var(--k-titre);letter-spacing:-.045em;margin:0}
.hero h1 em{font-style:normal;color:var(--k-blue)}
.cartes{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.carte{display:block;background:var(--k-pan);border:1px solid var(--k-line);border-radius:var(--k-r);box-shadow:var(--k-ombre);
  padding:24px;text-decoration:none;color:var(--k-ink);transition:box-shadow .15s,border-color .15s}
.carte:hover{border-color:var(--k-blue);box-shadow:var(--k-halo)}
.carte b{display:block;font:600 22px/1.15 var(--k-titre);letter-spacing:-.025em;margin-bottom:6px}
.carte span{color:var(--k-tx2);font-size:14.5px}
.sortie{margin-top:34px;font-size:14px}
.sortie a{color:var(--k-tx3)}
@media(max-width:720px){.w{padding:0 16px 70px}.hero h1{font-size:36px}.cartes{grid-template-columns:1fr}}
</style>
</head>
<body class="k">
<header class="k-top"><span class="k-top-t">Espace Kreative</span></header>
<div class="w">
  <div class="hero"><h1>Tous les <em>espaces</em></h1></div>
  <div class="cartes">
    <a class="carte" href="strategiste/"><b>Espace stratégiste</b><span>Les projets à remplir et ceux déjà envoyés.</span></a>
    <a class="carte" href="designer/"><b>Designer space</b><span>Les projets à livrer, l'aperçu et le téléchargement.</span></a>
    <a class="carte" href="fiche/"><b>Fiche créas</b><span>Remplir la fiche d'un projet.</span></a>
  </div>
  <p class="sortie"><a href="/_deconnexion">Se déconnecter</a></p>
</div>
</body>
</html>
