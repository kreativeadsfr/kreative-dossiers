<script>
/* ============================================================
   ADMIN KREATIVE
   Vue d'ensemble · Clients (fiche, lien d'accès, commandes) ·
   Commandes · Projets en production (suivi, kanban) · Dossiers ·
   Équipe. Les clients et commandes vivent dans la base Cloudflare,
   la production dans le dépôt (projets.json, donnees.json...).
   ============================================================ */
const { i, esc } = K;
const S = { livraisons: null, clients: null, commandes: null, resume: null, prod: null, dossiers: null, equipe: null, moi: null,
  factures: null, vueProjets: 'kanban', filtreClients: 'tous', chClients: '', chDossiers: '', filtreCmd: 'en_cours', filtreFact: 'toutes' };
const PACKS_NOMS = { starter: 'Starter', growth: 'Growth', scale: 'Scale', custom: 'Custom' };
// le statut d'une commande, le même que celui que voit le client
const STATUTS = { brief: ['Confirmée · brief attendu', 'a'], production: ['En production', 'b'], livre: ['Livré · à valider', 'g'], revisions: ['Retouches en cours', 'v'], valide: ['Validé', 'g'], annule: ['Annulée', ''] };
const FACT = { payee: ['Payée', 'g'], ouverte: ['En attente', 'a'], impayee: ['Impayée', 'r'], annulee: ['Annulée', ''] };
const FORMULES = { unique: 'Commande unique', mensuel: 'Abonnement mensuel' };
const H = 36e5;
// la tuile d'un client : sa photo s'il en a mis une, sinon ses initiales
const tuileClient = (c, lg) => c && c.photo_le ? '<span class="tuile img' + (lg ? ' lg' : '') + '"><img src="/api/admin/clients/' + esc(c.id) + '/photo?v=' + c.photo_le + '" alt=""></span>' : K.tuile(c.marque, lg);

// ---------- chargements ----------
async function charger(quoi, force) {
  const t = {
    clients: () => K.api('/api/admin/clients'),
    commandes: () => K.api('/api/admin/commandes'),
    resume: () => K.api('/api/admin/resume'),
    equipe: () => K.api('/api/admin/equipe'),
    factures: () => K.api('/api/admin/factures'),
    livraisons: () => K.api('/api/equipe/livraisons'),
    moi: () => K.lireJson('/_moi'),
    dossiers: async () => { const l = await K.lireJson('/_admin/dossiers.json'); return Array.isArray(l) ? l.sort((a, b) => (/^TEST|^REDO/.test(a) - /^TEST|^REDO/.test(b)) || a.localeCompare(b)) : []; },
    prod: chargerProduction
  };
  if (force || S[quoi] == null) {
    try { S[quoi] = await t[quoi](); }
    catch (e) { S[quoi] = quoi === 'resume' ? {} : []; if (e.statut !== 401) K.toast(e.message); }
  }
  return S[quoi];
}
// la production : le module partagé (ui/app.js, K.prod), le même que les espaces de l'équipe
async function chargerProduction() { return K.prod.charger(true); }
function rafraichir(...quoi) { quoi.forEach(q => { S[q] = null; }); K.rendre(); }

// ---------- production : état d'un projet ----------
function commandeDe(x) { return (S.commandes || []).find(c => c.dossier === x.dossier || (x.d.livraison && c.dossier === x.d.livraison.projet)); }
function etatProd(x) {
  // la même étape que voient le stratégiste et la designer (K.prod.etape : versions du portail, Kanban, commande)
  const now = Date.now(), c = commandeDe(x), g = x.etape || K.prod.etape(x);
  if (g.cle === 'client') {
    if (g.statut === 'envoyee' && g.version > 1) return { cle: 'client', texte: 'Version ' + g.version + ' chez le client', pill: 'g' };
    if (c && ['livre', 'valide'].includes(c.statut)) return { cle: 'client', texte: STATUTS[c.statut][0], pill: STATUTS[c.statut][1] };
    return { cle: 'client', texte: g.statut === 'approuvee' ? 'Approuvé par le client' : 'Chez le client', pill: 'g' };
  }
  if (g.cle === 'livrer') return { cle: 'livrer', texte: g.statut === 'a_verifier' ? (g.version > 1 ? 'Version ' + g.version + ' à vérifier' : 'À vérifier') : 'À livrer au client', pill: 'n' };
  if (g.retouche) return { cle: g.cle, texte: g.cle === 'strat' ? 'Retouches · textes' : (g.statut === 'a_corriger' ? 'Renvoyé à la designer' : 'Retouches · visuels'), pill: 'v', retouche: true };
  if (g.cle === 'strat') return x.strat && x.strat < now && !x.envoye ? { cle: 'strat', texte: 'Fiche en retard', pill: 'r', retard: true } : { cle: 'strat', texte: 'Chez le stratégiste', pill: 'b' };
  return x.desi && x.desi < now && !x.livre ? { cle: 'desi', texte: 'Designer en retard', pill: 'r', retard: true } : { cle: 'desi', texte: 'Chez le designer', pill: 'v' };
}
function etapesProd(x) {
  const c = commandeDe(x);
  return [{ t: 'Dossier prêt', f: true }, { t: 'Fiche envoyée', f: x.envoye }, { t: 'Visuels générés', f: x.envoye }, { t: 'Livré par le designer', f: x.livre },
    { t: 'Livré au client', f: !!((x.etape && x.etape.cle === 'client') || (x.v && (x.v.version > 1 || x.v.statut === 'review_terminee')) || (c && ['livre', 'revisions', 'valide'].includes(c.statut))) },
    { t: 'Validé', f: !!(c && c.statut === 'valide') || !!(x.v && x.v.statut === 'approuvee') }];
}
const nomProjet = x => (x.d.brand_name || x.dossier) + (x.d.livraison && x.d.livraison.sur > 1 ? ' · livraison ' + x.d.livraison.n + '/' + x.d.livraison.sur : '');
function liensProjet(x, petit) {
  const prod = (x.d.livraison && x.d.livraison.projet) || x.dossier, b = [];
  const l = (h, t, cls, ext) => '<a class="btn ' + (cls || 'btn-s') + ' btn-sm" href="' + esc(h) + '"' + (ext ? ' target="_blank" rel="noopener"' : '') + '>' + t + '</a>';
  b.push(l('#/dossier/' + x.dossier, 'Dossier'));
  b.push(l('#/fiche/' + x.dossier, 'Fiche'));
  if (x.retour) b.push(l('#/brief/' + x.dossier, esc(nomBrief(x.d))));
  if (x.envoye) { b.push(l('#/visuels/' + x.dossier, 'Visuels')); if (!petit) b.push(l('#/telechargement/' + x.dossier, 'Téléchargement')); }
  if (x.zip) b.push(l(x.zip, 'Créas livrées', 'btn-p', true));
  return '<div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end">' + b.join('') + '</div>';
}
function nomBrief(d) {
  const M = ['janvier', 'février', 'mars', 'avril', 'mai', 'juin', 'juillet', 'août', 'septembre', 'octobre', 'novembre', 'décembre'];
  const l = d && d.livraison;
  if (d && (d.abonnement || (l && l.type === 'abonnement'))) { const m = M[new Date(Date.parse(d.deadline || '') || Date.now()).getMonth()]; return 'Brief ' + (/^[aeiouâ]/.test(m) ? "d'" : 'de ') + m; }
  if (l && l.sur > 1) return 'Brief de la livraison ' + l.n + '/' + l.sur;
  return 'Brief du client';
}

// ---------- coquille ----------
function conf() {
  const enCours = (S.prod || []).filter(x => etatProd(x).cle !== 'client').length;
  return {
    cta: { texte: 'Nouveau client', href: '#/clients/nouveau' },
    sections: [
      { titre: '', liens: [{ id: 'accueil', texte: 'Vue d\'ensemble', icone: 'accueil', href: '#/' }] },
      { titre: 'Commercial', liens: [
        { id: 'clients', texte: 'Clients', icone: 'gens', href: '#/clients', nb: S.clients ? S.clients.length || '' : '' },
        { id: 'commandes', texte: 'Commandes', icone: 'sac', href: '#/commandes' },
        { id: 'factures', texte: 'Factures', icone: 'recu', href: '#/factures' }] },
      { titre: 'Production', liens: [
        { id: 'projets', texte: 'Projets', icone: 'colonnes', href: '#/projets', nb: enCours || '' },
        { id: 'production', texte: 'Fiches et dossiers', icone: 'calques', href: '#/fiche' },
        { id: 'livraisons', texte: 'Livraisons', icone: 'envoi', href: '#/livraisons', nb: (S.livraisons || []).filter(l => l.statut === 'a_verifier' && estDerniere(l)).length || '' }] },
      { titre: '', liens: [{ id: 'equipe', texte: 'Équipe', icone: 'bouclier', href: '#/equipe' }] }
    ],
    qui: { nom: S.moi && S.moi.nom ? S.moi.nom.charAt(0).toUpperCase() + S.moi.nom.slice(1) : 'Admin', role: 'Fondateur · admin' },
    sortie: '/_deconnexion',
    recherche: rechercher
  };
}
function rechercher(q) {
  q = q.toLowerCase(); if (!q) return [];
  const r = [];
  (S.clients || []).filter(c => (c.marque + ' ' + (c.contact || '') + ' ' + (c.email || '')).toLowerCase().includes(q)).slice(0, 5)
    .forEach(c => r.push({ texte: c.marque, type: 'Client', icone: 'gens', href: '#/clients/' + c.id }));
  (S.commandes || []).filter(c => ('#' + c.ref + ' ' + c.marque + ' ' + K.nomCommande(c)).toLowerCase().includes(q)).slice(0, 4)
    .forEach(c => r.push({ texte: c.marque + ' · ' + K.nomCommande(c), type: 'Commande #' + c.ref, icone: 'sac', href: '#/clients/' + c.client_id }));
  (S.prod || []).filter(x => (nomProjet(x) + ' ' + x.dossier).toLowerCase().includes(q)).slice(0, 4)
    .forEach(x => r.push({ texte: nomProjet(x), type: 'Projet', icone: 'dossier', href: '#/dossier/' + x.dossier }));
  (S.dossiers || []).filter(d => d.toLowerCase().includes(q)).slice(0, 4)
    .forEach(d => r.push({ texte: d, type: 'Dossier', icone: 'calques', href: '#/dossier/' + d }));
  return r.slice(0, 12);
}

// ---------- VUE D'ENSEMBLE ----------
function ecranAccueil() {
  const R = S.resume || {}, P = S.prod || [];
  const etats = P.map(x => ({ x, e: etatProd(x) }));
  const nb = cle => etats.filter(y => y.e.cle === cle).length;
  const retards = etats.filter(y => y.e.retard);
  const briefs = (S.commandes || []).filter(c => c.statut === 'brief');
  const aLivrer = etats.filter(y => y.e.cle === 'livrer');
  let h = '<div class="ph"><div><h1>Vue d\'ensemble</h1><p>' + esc(libellePeriode()) + '</p></div><div class="act">' + choixPeriode() + '</div></div>';
  if (R.demo) h += '<div class="bandeau-demo">' + i.etoile + '<span><b>Démo active</b> · ' + R.demo + ' clients fictifs et ' + (P.filter(x => x.demo).length) + ' projets TEST_DEMO à chaque étape. Aucun email, paiement ni Telegram ne part pour eux.</span>' +
    '<button class="btn btn-s btn-sm" onclick="demo(false)">Retirer les données de démo</button></div>';
  h += tableauDeBord(retards);
  const aVerifier = (S.livraisons || []).filter(l => l.statut === 'a_verifier' && estDerniere(l)), retours = (S.livraisons || []).filter(l => l.statut === 'review_terminee' && estDerniere(l));
  const todo = [
    ...aVerifier.map(l => ({ t: nomLiv(l.dossier), s: 'La designer a déposé la version ' + l.version + ' : à vérifier', ic: 'envoi', p: 'a', href: '#/livraisons/' + l.dossier })),
    ...retours.map(l => ({ t: nomLiv(l.dossier), s: 'Le client a envoyé ses retours sur la version ' + l.version, ic: 'message', p: 'v', href: '#/livraisons/' + l.dossier })),
    ...retards.map(y => ({ t: nomProjet(y.x), s: y.e.texte, ic: 'horloge', p: 'r', href: '#/fiche/' + y.x.dossier })),
    ...aLivrer.filter(y => !(S.livraisons || []).some(l => l.dossier === y.x.dossier)).map(y => ({ t: nomProjet(y.x), s: 'Livré par le designer, à envoyer au client', ic: 'envoi', p: 'n', href: y.x.zip && !/\/admin\//.test(y.x.zip) ? y.x.zip : '#/livraisons/' + y.x.dossier, ext: !!y.x.zip && !/\/admin\//.test(y.x.zip) })),
    ...briefs.map(c => ({ t: c.marque + ' · ' + K.nomCommande(c), s: 'Commande confirmée, brief attendu depuis ' + K.ilya(c.cree_le).replace('il y a ', ''), ic: 'doc', p: 'a', href: '#/clients/' + c.client_id })),
    ...(S.commandes || []).filter(c => c.statut === 'livre').map(c => ({ t: c.marque + ' · ' + K.nomCommande(c), s: 'Livré, en attente de validation du client', ic: 'coche', p: 'g', href: '#/clients/' + c.client_id }))
  ];
  h += '<div class="grid g2" style="margin-top:14px"><div class="card"><div class="card-h"><h3>À traiter</h3><span class="pill">' + todo.length + '</span></div><div class="card-b liste">' +
    (todo.length ? todo.slice(0, 8).map(t => '<a class="li" style="text-decoration:none" href="' + esc(t.href) + '"' + (t.ext ? ' target="_blank" rel="noopener"' : '') + '><span class="ic">' + i[t.ic] + '</span><span class="t"><b style="font-weight:600">' + esc(t.t) + '</b><span class="sub muted" style="display:block;font-size:12.5px">' + esc(t.s) + '</span></span>' + i.fleche.replace('<svg', '<svg width="15" height="15" style="opacity:.35"') + '</a>').join('')
      : '<div class="vide">' + i.coche + 'Rien d\'urgent. Tout roule.</div>') + '</div></div>' +
    '<div class="card"><div class="card-h"><h3>Derniers clients</h3><a class="btn btn-g btn-sm" href="#/clients">Tous</a></div><div class="card-b liste">' +
    ((S.clients || []).length ? S.clients.slice(0, 6).map(c => '<a class="li" style="text-decoration:none" href="#/clients/' + esc(c.id) + '">' + tuileClient(c) + '<span class="t"><b style="font-weight:600">' + esc(c.marque) + '</b><span class="muted" style="display:block;font-size:12.5px">' + esc(c.contact || c.email || '') + '</span></span><small>' + (c.nb_commandes ? c.nb_commandes + ' commande' + (c.nb_commandes > 1 ? 's' : '') : 'aucune commande') + '</small></a>').join('')
      : '<div class="vide">' + i.gens + 'Aucun client. <a href="#/clients/nouveau">Créer le premier</a></div>') + '</div></div></div>';
  return h;
}
// ---------- LE TABLEAU DE BORD : Stripe (ventes) et production, sur une période ----------
const PERIODE = { mode: '30', du: '', au: '' };
const J = 864e5;
function bornes() {
  if (PERIODE.mode === 'perso' && PERIODE.du && PERIODE.au) { const a = Date.parse(PERIODE.du + 'T00:00:00'), b = Date.parse(PERIODE.au + 'T23:59:59'); if (a <= b) return [a, b]; }
  const fin = new Date(); fin.setHours(23, 59, 59, 999);
  const debut = new Date(fin.getTime() - ((PERIODE.mode === '7' ? 7 : 30) - 1) * J); debut.setHours(0, 0, 0, 0);
  return [debut.getTime(), fin.getTime()];
}
function libellePeriode() {
  const [a, b] = bornes(), f = t => K.date(t, { year: undefined });
  return PERIODE.mode === 'perso' ? 'Du ' + f(a) + ' au ' + f(b) : (PERIODE.mode === '7' ? '7 derniers jours' : '30 derniers jours') + ' · du ' + f(a) + ' au ' + f(b);
}
// le choix de la période : 7 jours, 30 jours, ou un calendrier (deux mois, raccourcis, plage)
const CAL = { ouvert: false, mois: null, debut: null, fin: null, survol: null };
const isoJour = t => { const d = new Date(t); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
const jourDe = iso => { const [a, m, j] = iso.split('-').map(Number); return new Date(a, m - 1, j).getTime(); };
const MOIS_CAL = ['janvier', 'février', 'mars', 'avril', 'mai', 'juin', 'juillet', 'août', 'septembre', 'octobre', 'novembre', 'décembre'];
function choixPeriode() {
  const [a, b] = bornes(), f = t => K.date(t, { year: undefined, month: 'short' });
  return '<div class="periode"><div class="onglets">' + [['7', '7 jours'], ['30', '30 jours']].map(([k, t]) => '<button class="' + (PERIODE.mode === k ? 'on' : '') + '" data-periode="' + k + '">' + t + '</button>').join('') +
    '<button class="' + (PERIODE.mode === 'perso' ? 'on' : '') + '" data-cal-ouvrir>' + i.calendrier + (PERIODE.mode === 'perso' ? esc(f(a) + ' → ' + f(b)) : 'Personnalisé') + '</button></div>' +
    (CAL.ouvert ? calendrier() : '') + '</div>';
}
function grilleMois(debutMois) {
  const d = new Date(debutMois), an = d.getFullYear(), m = d.getMonth(), premier = (new Date(an, m, 1).getDay() + 6) % 7, nb = new Date(an, m + 1, 0).getDate();
  const auj = isoJour(Date.now()), lo = CAL.debut, hi = CAL.fin || CAL.survol;
  const [x, y] = lo && hi ? (lo <= hi ? [lo, hi] : [hi, lo]) : [lo, lo];
  let h = '<div class="cal-mois"><div class="cal-titre">' + MOIS_CAL[m] + ' ' + an + '</div><div class="cal-jours">' + ['lu', 'ma', 'me', 'je', 've', 'sa', 'di'].map(j => '<span>' + j + '</span>').join('') + '</div><div class="cal-grille">';
  for (let n = 0; n < premier; n++) h += '<span></span>';
  for (let j = 1; j <= nb; j++) {
    const iso = an + '-' + String(m + 1).padStart(2, '0') + '-' + String(j).padStart(2, '0'), futur = iso > auj;
    const cls = [iso === auj ? 'auj' : '', x && iso === x ? 'debut' : '', y && iso === y ? 'fin' : '', x && y && iso > x && iso < y ? 'dans' : '', futur ? 'off' : ''].filter(Boolean).join(' ');
    h += '<button type="button" class="' + cls + '" data-jour="' + iso + '"' + (futur ? ' disabled' : '') + '>' + j + '</button>';
  }
  return h + '</div></div>';
}
function calendrier() {
  const m = new Date(CAL.mois), prec = new Date(m.getFullYear(), m.getMonth() - 1, 1).getTime();
  const raccourcis = [['Aujourd\'hui', 0], ['7 derniers jours', 7], ['30 derniers jours', 30], ['90 derniers jours', 90], ['Ce mois-ci', 'mois'], ['Mois dernier', 'moisder'], ['Cette année', 'an'], ['Depuis le début', 'tout']];
  const lo = CAL.debut, hi = CAL.fin, f = iso => K.date(jourDe(iso), { year: undefined, month: 'short' });
  const now = new Date(), dernier = CAL.mois >= new Date(now.getFullYear(), now.getMonth(), 1).getTime();
  return '<div class="cal" role="dialog" aria-label="Choisir une période"><div class="cal-rac"><div class="cal-rac-t">Raccourcis</div>' + raccourcis.map(([t, k]) => '<button type="button" data-rac="' + k + '">' + t + '</button>').join('') + '</div>' +
    '<div class="cal-corps"><div class="cal-nav"><button type="button" class="cal-fl" data-cal-mois="-1" aria-label="Mois précédent">' + i.chevG + '</button><button type="button" class="cal-fl" data-cal-mois="1" aria-label="Mois suivant"' + (dernier ? ' disabled' : '') + '>' + i.chevD + '</button></div>' +
    '<div class="cal-deux">' + grilleMois(prec) + grilleMois(CAL.mois) + '</div>' +
    '<div class="cal-pied"><span class="cal-choix">' + (lo ? esc(f(lo)) + ' → ' + (hi ? esc(f(hi)) : '<i>choisissez la fin</i>') : 'Choisissez le premier jour') + '</span>' +
    '<button type="button" class="btn btn-g btn-sm" data-cal-annuler>Annuler</button><button type="button" class="btn btn-d btn-sm" data-cal-ok' + (lo && hi ? '' : ' disabled') + '>Appliquer</button></div></div></div>';
}
// la plage choisie se colore et le pied du calendrier se met à jour, sans rien redessiner
function majCalendrier(cal) {
  const x = CAL.debut, y = CAL.fin || CAL.debut, f = iso => K.date(jourDe(iso), { year: undefined, month: 'short' });
  cal.querySelectorAll('[data-jour]').forEach(o => { const j = o.dataset.jour; o.classList.toggle('debut', !!x && j === x); o.classList.toggle('fin', !!x && j === y); o.classList.toggle('dans', !!x && j > x && j < y); });
  cal.querySelector('.cal-choix').innerHTML = x ? esc(f(x)) + ' → ' + (CAL.fin ? esc(f(CAL.fin)) : '<i>choisissez la fin</i>') : 'Choisissez le premier jour';
  cal.querySelector('[data-cal-ok]').disabled = !(CAL.debut && CAL.fin);
}
function brancherPeriode() {
  document.querySelectorAll('[data-periode]').forEach(b => b.onclick = () => { PERIODE.mode = b.dataset.periode; CAL.ouvert = false; K.rendre(); });
  const ouvrir = document.querySelector('[data-cal-ouvrir]');
  if (ouvrir) ouvrir.onclick = e => {
    e.stopPropagation();
    if (CAL.ouvert) { CAL.ouvert = false; K.rendre(); return; }
    const [a, b] = bornes(), m = new Date(b);
    Object.assign(CAL, { ouvert: true, mois: new Date(m.getFullYear(), m.getMonth(), 1).getTime(), debut: isoJour(a), fin: isoJour(b), survol: null });
    K.rendre();
  };
  const cal = document.querySelector('.cal');
  if (cal) {
    cal.onclick = e => e.stopPropagation();
    // changer de mois : les deux mois glissent, sans redessiner la page
    cal.querySelectorAll('[data-cal-mois]').forEach(b => b.onclick = () => {
      const sens = Number(b.dataset.calMois), m = new Date(CAL.mois);
      CAL.mois = new Date(m.getFullYear(), m.getMonth() + sens, 1).getTime();
      const deux = cal.querySelector('.cal-deux'), p = new Date(new Date(CAL.mois).getFullYear(), new Date(CAL.mois).getMonth() - 1, 1).getTime();
      deux.innerHTML = grilleMois(p) + grilleMois(CAL.mois);
      deux.classList.remove('va-g', 'va-d'); void deux.offsetWidth; deux.classList.add(sens > 0 ? 'va-d' : 'va-g');
      const now = new Date(); cal.querySelector('[data-cal-mois="1"]').disabled = CAL.mois >= new Date(now.getFullYear(), now.getMonth(), 1).getTime();

  if (!x || vers === d.colDepart) { await poser(); KB.drag = null; await rendreKanban(); return; }
  // ce qui part chez le client, ou lui retire sa review, se confirme d'abord
  const demander = (st, version) => st === 'a_verifier' && vers === 'client'
    ? K.confirmer('Envoyer au client ?', 'La version ' + version + ' de ' + nomProjet(x) + ' part chez le client, qui reçoit un email pour la voir.', 'Envoyer au client')
    : K.confirmer('Demander des retouches ?', 'La review de la version ' + version + ' se termine pour le client, et les retouches partent ' + (vers === 'strat' ? 'chez le stratégiste.' : 'chez la designer.'), 'Lancer les retouches');
  let confirme = false;
  const st0 = x.v && x.v.statut;
  if ((vers === 'client' && st0 === 'a_verifier') || (['desi', 'strat'].includes(vers) && ['envoyee', 'approuvee'].includes(st0))) {
    if (!await demander(st0, x.v.version)) return retour();
    confirme = true;
  }
  if (vers === 'client' && st0 === 'brouillon') { K.toast('La designer n\'a pas encore envoyé ses fichiers.'); return retour(); }
  await poser();
  try {
    let r = await K.api('/api/equipe/deplacer', { methode: 'POST', corps: { dossier: x.dossier, vers, confirme } });
    // l'état avait changé entre-temps : on demande, puis on recommence
    if (r.confirmer) r = await demander(r.statut, r.version) ? await K.api('/api/equipe/deplacer', { methode: 'POST', corps: { dossier: x.dossier, vers, confirme: true } }) : { message: 'Rien n\'a changé.' };
    K.toast(r.message);
    if (r.etats) await K.prod.chargerEtats(r.etats);
    if (r.action) { S.commandes = null; S.livraisons = null; await charger('commandes', true); }
  } catch (e) { K.toast(e.message); }
  KB.drag = null;
  await rendreKanban();
}

// pourquoi relancer un client (rien = pas besoin) : brief qui n'arrive pas, pas d'avis, pas recommandé depuis longtemps
function raisonRelance(c) {
  const J = 864e5, now = Date.now(), jours = t => Math.floor((now - t) / J);
  if (c.statut === 'bloque') return '';
  if (c.brief_attendu_depuis && now - c.brief_attendu_depuis > 3 * J) return 'Brief attendu depuis ' + jours(c.brief_attendu_depuis) + ' j';
  if (c.en_cours > 0) return '';
  if (c.sans_avis > 0) return 'Pas d\'avis Trustpilot';
  const ref = Math.max(c.derniere_validation || 0, c.derniere_commande || 0);
  if (c.nb_commandes > 0 && ref && now - ref > 30 * J) return 'Pas recommandé depuis ' + jours(ref) + ' j';
  if (!c.nb_commandes && c.cree_le && now - c.cree_le > 7 * J) return 'Jamais commandé';
  return '';
}

  const recharger = async () => { FICHE = null; S.clients = null; S.commandes = null; S.resume = null; await K.rendre(); };
  if (b('b-copier')) b('b-copier').onclick = () => K.copier(c.lien, 'Lien copié');
  if (b('b-mail')) b('b-mail').onclick = async e => {
    e.target.disabled = true;
    try { await K.api('/api/admin/clients/' + c.id + '/envoyer-lien', { methode: 'POST' }); K.toast('Lien envoyé à ' + c.email); recharger(); }
    catch (err) { K.toast(err.message); e.target.disabled = false; }
  };
  if (b('b-regen')) b('b-regen').onclick = async () => {
    if (!await K.confirmer('Créer un nouveau lien ?', 'L\'ancien lien ne marchera plus. Pensez à envoyer le nouveau au client.', 'Créer un nouveau lien')) return;
    await K.api('/api/admin/clients/' + c.id + '/nouveau-lien', { methode: 'POST' }); K.toast('Nouveau lien créé'); recharger();
  };
  if (b('b-notif')) b('b-notif').onclick = () => notifierClients(c);
  if (b('b-modif')) b('b-modif').onclick = () => {
    const v = K.fenetre('<div class="fen-h"><h2>Modifier ' + esc(c.marque) + '</h2></div><div class="fen-b">' + formClient(c) + '</div><div class="fen-f"><button class="btn btn-s" data-n>Annuler</button><button class="btn btn-p" data-o>Enregistrer</button></div>');
    v.querySelector('[data-n]').onclick = K.fermer;
    v.querySelector('[data-o]').onclick = async () => { try { await K.api('/api/admin/clients/' + c.id, { methode: 'PATCH', corps: lireForm() }); K.fermer(); K.toast('Enregistré'); recharger(); } catch (e) { K.toast(e.message); } };
  };
  const cmd = () => nouvelleCommande(c, recharger);
  if (b('b-cmd')) b('b-cmd').onclick = cmd;
  if (b('b-cmd2')) b('b-cmd2').onclick = e => { e.preventDefault(); cmd(); };
  if (b('b-bloquer')) b('b-bloquer').onclick = async () => {
    const bloquer = c.statut !== 'bloque';
    if (bloquer && !await K.confirmer('Bloquer l\'accès ?', c.marque + ' ne pourra plus ouvrir son espace tant que vous ne le débloquez pas.', 'Bloquer', true)) return;
    await K.api('/api/admin/clients/' + c.id, { methode: 'PATCH', corps: { statut: bloquer ? 'bloque' : 'actif' } }); K.toast(bloquer ? 'Accès bloqué' : 'Accès rétabli'); recharger();
  };
  if (b('b-suppr')) b('b-suppr').onclick = async () => {
    if (!await K.confirmer('Supprimer ' + c.marque + ' ?', 'Le client, ses commandes et son historique sont effacés. Les dossiers de production ne sont pas touchés.', 'Supprimer définitivement', true)) return;
    await K.api('/api/admin/clients/' + c.id, { methode: 'DELETE' }); FICHE = null; S.clients = null; S.resume = null; S.commandes = null; K.toast('Client supprimé'); K.aller('#/clients');
  };
  document.querySelectorAll('[data-dossier]').forEach(s => s.onchange = async () => {
    try { await K.api('/api/admin/commandes/' + s.dataset.dossier, { methode: 'PATCH', corps: { dossier: s.value } }); K.toast(s.value ? 'Dossier relié' : 'Dossier retiré'); recharger(); } catch (e) { K.toast(e.message); }
  });
  document.querySelectorAll('[data-statut]').forEach(s => s.onchange = async () => {
    try { await K.api('/api/admin/commandes/' + s.dataset.statut, { methode: 'PATCH', corps: { statut: s.value } }); K.toast('Statut mis à jour'); recharger(); } catch (e) { K.toast(e.message); }
  });
  brancherSupprFactures();
  document.querySelectorAll('[data-suppr]').forEach(x => x.onclick = async () => {
    if (!await K.confirmer('Supprimer cette commande ?', 'Elle disparaît de l\'espace du client. Le dossier de production n\'est pas touché.', 'Supprimer', true)) return;
    await K.api('/api/admin/commandes/' + x.dataset.suppr, { methode: 'DELETE' }); K.toast('Commande supprimée'); recharger();
  });
}
function nouvelleCommande(c, apres) {
  const P = (S.resume && S.resume.packs) || {};
  const v = K.fenetre('<div class="fen-h"><h2>Nouvelle commande</h2><p>' + esc(c.marque) + ' · elle apparaît tout de suite dans son espace.</p></div><div class="fen-b">' +
    '<div class="grid g2" style="gap:12px"><div class="champ"><label>Pack</label><select class="in" id="c-pack">' + ['starter', 'growth', 'scale', 'custom'].map(k => '<option value="' + k + '"' + (k === 'growth' ? ' selected' : '') + '>' + PACKS_NOMS[k] + '</option>').join('') + '</select></div>' +
    '<div class="champ"><label>Formule</label><select class="in" id="c-formule"><option value="unique">Commande unique</option><option value="mensuel">Abonnement mensuel</option></select></div></div>' +
    '<div class="grid g2" style="gap:12px"><div class="champ"><label>Nombre de créatives</label><input class="in" id="c-nb" type="number" min="1"></div>' +
    '<div class="champ"><label>Prix (€)</label><input class="in" id="c-prix" type="number" min="0"></div></div>' +
    '<div class="aide" id="c-aide" style="margin:-4px 0 14px;font-size:12.5px;color:var(--tx3)"></div>' +
    '<div class="champ"><label>Dossier de production</label>' + choixDossier({ id: 'nouveau', dossier: '' }).replace('data-dossier="nouveau"', 'id="c-dossier"') + '<div class="aide">Laissez vide si le client n\'a pas encore envoyé son brief : il le remplira depuis son espace.</div></div>' +
    '</div><div class="fen-f"><button class="btn btn-s" data-n>Annuler</button><button class="btn btn-p" data-o>Enregistrer la commande</button></div>');
  // Starter, Growth et Scale ont un prix fixe : seul le pack Custom se règle à la main
  const maj = () => {
    const k = K.$('#c-pack').value, f = K.$('#c-formule').value, p = P[k] || {}, fixe = k !== 'custom';
    const nb = K.$('#c-nb'), prix = K.$('#c-prix');
    nb.readOnly = prix.readOnly = fixe;
    if (fixe) { nb.value = p.creas || ''; prix.value = (f === 'mensuel' ? p.mensuel : p.unique) || ''; }
    else { if (!nb.value || nb.readOnly === false && Number(nb.value) < 1) nb.value = 30; prix.placeholder = 'Montant du devis'; }
    K.$('#c-aide').textContent = fixe ? 'Prix et volume fixes du Pack ' + PACKS_NOMS[k] + (f === 'mensuel' ? ', par mois.' : '.') : 'Pack Custom : indiquez le volume et le montant convenus avec le client.';
  };
  K.$('#c-pack').onchange = maj; K.$('#c-formule').onchange = maj; maj();
  v.querySelector('[data-n]').onclick = K.fermer;
  v.querySelector('[data-o]').onclick = async e => {
    e.target.disabled = true;
    try {
      const r = await K.api('/api/admin/commandes', { methode: 'POST', corps: { client_id: c.id, pack: K.$('#c-pack').value, formule: K.$('#c-formule').value, nb_creas: K.$('#c-nb').value, prix: K.$('#c-prix').value, dossier: K.$('#c-dossier').value } });
      K.fermer(); K.toast('Commande #' + r.ref + ' enregistrée'); apres();
    } catch (err) { K.toast(err.message); e.target.disabled = false; }
  };
}

  const C = S.commandes || [], f = S.filtreCmd;

  const chip = (k, t) => '<button class="chip' + (f === k ? ' on' : '') + '" onclick="S.filtreCmd=\'' + k + '\';K.rendre()">' + t + '<span class="c">' + C.filter(filtres[k]).length + '</span></button>';
  let h = '<div class="ph"><div><h1>Commandes</h1><p>' + C.filter(filtres.en_cours).length + ' en cours · ' + K.euros(C.filter(c => c.statut !== 'annule').reduce((s, c) => s + (c.prix || 0), 0)) + ' au total</p></div>' +
    '<div class="act"><button class="btn btn-s" onclick="exporterCommandes()">' + i.telecharger + 'Exporter</button></div></div>' +

    (l.map(c => '<tr class="clic" onclick="location.hash=\'#/clients/' + esc(c.client_id) + '\'"><td><b>' + esc(K.nomCommande(c)) + '</b><span class="sub">#' + esc(c.ref) + '</span></td><td><div class="nom">' + K.tuile(c.marque) + '<b>' + esc(c.marque) + '</b></div></td>' +
      '<td>' + c.nb_creas + ' créas<span class="sub">' + esc(FORMULES[c.formule] || '') + '</span></td><td class="num">' + K.euros(c.prix) + '</td>' +

function exporterCommandes() {

    C.map(c => [c.ref, K.nomCommande(c), c.marque, c.contact, c.email, PACKS_NOMS[c.pack] || c.pack, FORMULES[c.formule] || c.formule, c.nb_creas, c.prix, (STATUTS[c.statut] || [c.statut])[0], c.dossier,

// ---------- FACTURES ----------
// les factures : un historique à télécharger (tout est payé à la commande, via Stripe)
const facturesPayees = F => F.filter(f => f.statut === 'payee' || f.source !== 'stripe');
function tableFactures(F, avecClient) {
  return '<table class="tbl"><thead><tr><th>Facture</th>' + (avecClient ? '<th>Client</th>' : '') + '<th>Projet</th><th class="num">Montant</th><th>Émise le</th><th></th></tr></thead><tbody>' +
    F.map(f => {
      const k = (S.commandes || []).find(c => c.id === f.commande_id) || (FICHE && FICHE.commandes.find(c => c.id === f.commande_id));
      return '<tr><td><b>' + esc(f.numero || 'Sans numéro') + '</b></td>' +
        (avecClient ? '<td>' + (f.marque ? '<a class="nom" href="#/clients/' + esc(f.client_id) + '">' + K.tuile(f.marque) + '<b>' + esc(f.marque) + '</b></a>' : '<span class="muted">' + esc(f.email || 'non rattachée') + '</span>') + '</td>' : '') +
        '<td>' + (k ? esc(K.nomCommande(k)) + '<span class="sub">#' + esc(k.ref) + '</span>' : '<span class="muted">Aucun</span>') + '</td>' +
        '<td class="num">' + K.euros(f.montant) + '</td><td>' + esc(K.date(f.emise_le)) + '</td>' +
        '<td class="fin"><div style="display:flex;gap:6px;justify-content:flex-end">' +

    }).join('') + '</tbody></table>';
}
// le bouton Télécharger de chaque facture (admin, fiche client)
function brancherTelechargements(F) {
  document.querySelectorAll('[data-fdl]').forEach(b => b.onclick = () => {
    const f = F.find(x => x.id === b.dataset.fdl); if (!f) return;
    const k = (S.commandes || []).find(c => c.id === f.commande_id) || (FICHE && FICHE.commandes.find(c => c.id === f.commande_id));
    const cl = (S.clients || []).find(c => c.id === f.client_id) || (FICHE && FICHE.client);
    K.telechargerFacture(f, { client: f.marque || (cl && cl.marque), email: cl && cl.email, projet: k ? K.nomCommande(k) + ' · ' + k.nb_creas + ' créatives' : '' });
  });
}
function ecranFactures() {

  const l = F.filter(filtres[f] || filtres.toutes);
  return h + (l.length ? '<div class="card"><div class="tbl-wrap">' + tableFactures(l, true) + '</div></div>' : '<div class="card"><div class="vide">' + i.recu + 'Aucune facture pour l\'instant. Elles arrivent ici à chaque paiement Stripe.</div></div>');

const STATUTS_LIV = { brouillon: ['Dépôt en cours', ''], a_verifier: ['À vérifier', 'a'], a_corriger: ['Renvoyée pour correction', 'r'], envoyee: ['Chez le client', 'b'],
  review_terminee: ['Retouches demandées', 'v'], approuvee: ['Approuvée par le client', 'g'] };
const pillLiv = (st, ret) => { const x = STATUTS_LIV[st] || [st, '']; const qui = ['a_corriger', 'review_terminee'].includes(st) ? (ret === 'strategiste' ? ' · stratégiste' : ' · designer') : ''; return '<span class="pill ' + x[1] + '"><i></i>' + esc(x[0] + qui) + '</span>'; };
const estDerniere = l => !(S.livraisons || []).some(x => x.dossier === l.dossier && x.version > l.version);
const nomLiv = d => { const x = K.prod.trouver(d), l = (S.livraisons || []).find(y => y.dossier === d); return (x && x.nom) || (l && l.marque) || d; };
function ecranLivraisons() {
  const L = (S.livraisons || []).filter(estDerniere), ordre = { a_verifier: 0, review_terminee: 1, a_corriger: 2, brouillon: 3, envoyee: 4, approuvee: 5 };
  L.sort((a, b) => (ordre[a.statut] - ordre[b.statut]) || ((b.depose_le || b.cree_le) - (a.depose_le || a.cree_le)));
  let h = '<div class="ph"><div><h1>Livraisons</h1><p>Vérification des projets avant d\'être envoyés au client.</p></div>' +
    '<div class="act"><button class="btn btn-s" onclick="rafraichir(\'livraisons\')">' + i.rafraichir + 'Actualiser</button></div></div>';
  if (!L.length) return h + '<div class="card"><div class="vide">' + i.envoi + 'Aucune livraison pour l\'instant. Elles arrivent ici dès que la designer dépose ses fichiers.</div></div>';
  return h + '<div class="card"><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Projet</th><th>Version</th><th class="num">Fichiers</th><th>Statut</th><th>Retours du client</th><th>Déposée</th><th></th></tr></thead><tbody>' +
    L.map(l => '<tr class="clic" onclick="location.hash=\'#/livraisons/' + esc(l.dossier) + '\'"><td><div class="nom">' + K.tuile(nomLiv(l.dossier)) + '<div><b>' + esc(nomLiv(l.dossier)) + (K.estDemo(l.dossier) ? ' <span class="pill demo">Démo</span>' : '') + '</b><span class="sub">' + esc(l.dossier) + (l.ref ? ' · #' + esc(l.ref) : '') + '</span></div></div></td>' +
      '<td>Version ' + l.version + '</td><td class="num">' + l.nb + '</td><td>' + pillLiv(l.statut, l.retouche) + '</td>' +
      '<td>' + (['envoyee', 'review_terminee', 'approuvee'].includes(l.statut) ? l.nb_approuves + ' / ' + l.nb + ' approuvés' + (l.nb_client ? '<span class="sub">' + l.nb_client + ' commentaire' + (l.nb_client > 1 ? 's' : '') + '</span>' : '') : '<span class="muted">Pas encore</span>') + '</td>' +
      '<td>' + (l.depose_le ? esc(K.ilya(l.depose_le)) : '<span class="muted">Pas encore</span>') + '</td><td class="fin">' + i.fleche.replace('<svg', '<svg width="16" height="16" style="opacity:.35"') + '</td></tr>').join('') + '</tbody></table></div></div>';
}
const LIV = { dossier: null, donnees: null, choix: null };
async function chargerLivraison(d) {
  LIV.dossier = d;
  try { LIV.donnees = await K.api('/api/equipe/livraisons/' + d); } catch (e) { LIV.donnees = { versions: [] }; K.toast(e.message); }
  if (!LIV.donnees.versions.find(v => v.id === LIV.choix)) LIV.choix = (LIV.donnees.versions[0] || {}).id;
  K.rendre();
}
function ecranLivraison(d) {
  let h = '<a class="retour" href="#/livraisons">' + i.gauche + 'Livraisons</a>';
  if (LIV.dossier !== d) { LIV.dossier = d; LIV.donnees = null; setTimeout(() => chargerLivraison(d), 0); }
  if (!LIV.donnees) return h + '<div class="card"><div class="vide">Chargement…</div></div>';
  const V = LIV.donnees.versions, l = V.find(v => v.id === LIV.choix);
  if (!l) return h + '<div class="card"><div class="vide">' + i.envoi + 'Rien n\'a encore été déposé pour ce projet.</div></div>';
  h += K.rv.puces(V, l.id, v => 'Version ' + v.version + ' · ' + (STATUTS_LIV[v.statut] || [v.statut])[0]);
  if (l.note_designer) h += '<div class="rv-note">' + i.message + '<div><b>Note de la designer :</b> ' + esc(l.note_designer) + '</div></div>';
  if (l.statut === 'a_corriger' && l.note_kreative) h += '<div class="rv-note">' + i.crayon + '<div><b>Note de correction :</b> ' + esc(l.note_kreative) + '</div></div>';
  // les retouches : qui s'en occupe (proposé selon les commentaires du client, modifiable)
  if (['a_corriger', 'review_terminee'].includes(l.statut) && l === V[0]) {
    const r = l.retouche || 'designer';
    h += '<div class="routage"><div><b>' + (r === 'strategiste' ? 'Les retouches sont chez le stratégiste' : 'Les retouches sont chez la designer') + '</b><small>' +
      (r === 'strategiste' ? 'Il corrige les textes, puis la designer fait la version ' + (l.version + 1) + '.' : 'Elle fait la version ' + (l.version + 1) + ' avec les commentaires.') + '</small></div>' +
      '<div class="onglets"><button class="' + (r === 'strategiste' ? 'on' : '') + '" data-router="strategiste">' + i.doc + 'Stratégiste · textes</button><button class="' + (r === 'designer' ? 'on' : '') + '" data-router="designer">' + i.pinceau + 'Designer · visuels</button></div></div>';
  }
  return h + K.rv.grille(l, { mode: 'admin', titre: nomLiv(d) + ' · version ' + l.version, sousTitre: l.fichiers.length + ' fichiers · ' + (STATUTS_LIV[l.statut] || [''])[0],
    actions: '<button class="btn btn-g" data-suppr-liv title="Supprimer cette version">' + i.poubelle + '</button>' +
      (l.statut === 'a_verifier' ? '<button class="btn btn-s" data-corriger>' + i.crayon + 'Renvoyer pour correction</button><button class="btn btn-d" data-envoyer-client>' + i.envoi + 'Envoyer au client</button>' : '') });
}
function brancherLivraison() {
  const V = (LIV.donnees && LIV.donnees.versions) || [], l = V.find(v => v.id === LIV.choix);
  if (!l) return;
  document.querySelectorAll('[data-rv-version]').forEach(b => b.onclick = () => { LIV.choix = b.dataset.rvVersion; K.rendre(); });
  K.rv.brancher(l, { mode: 'admin', nomZip: (nomLiv(l.dossier) + '-v' + l.version).replace(/[^A-Za-z0-9]+/g, '-'), rendre: () => K.rendre(), auteur: (S.moi && S.moi.nom) || 'Kreative',
    peutCommenter: () => true, peutApprouver: () => false,
    api: { commenter: (f, texte, forme, couleur) => K.api('/api/equipe/commentaires', { methode: 'POST', corps: { fichier_id: f.id, texte, forme, couleur } }),
      supprimer: id => K.api('/api/equipe/commentaires/' + id, { methode: 'DELETE' }) } });
  const sup = document.querySelector('[data-suppr-liv]');
  if (sup) sup.onclick = async () => {
    if (!await K.confirmer('Supprimer la version ' + l.version + ' ?', 'Ses ' + l.fichiers.length + ' fichiers et leurs commentaires sont effacés, pour tout le monde (client compris). C\'est définitif.', 'Supprimer', true)) return;
    try { const r = await K.api('/api/equipe/livraisons/' + l.id, { methode: 'DELETE' }); K.toast(r.message); S.livraisons = null; LIV.dossier = null; await K.prod.chargerEtats(); location.hash = '#/livraisons'; }
    catch (e) { K.toast(e.message); }
  };
  const env = document.querySelector('[data-envoyer-client]');
  if (env) env.onclick = async () => {
    if (!await K.confirmer('Envoyer au client ?', 'Le client reçoit un email et voit les ' + l.fichiers.length + ' fichiers dans son espace, pour sa review.', 'Envoyer au client')) return;
    env.disabled = true;
    try { const r = await K.api('/api/equipe/livraisons/' + l.id + '/decision', { methode: 'POST', corps: { action: 'envoyer' } }); K.toast(r.message); S.livraisons = null; S.commandes = null; await charger('livraisons'); await K.prod.chargerEtats(); await chargerLivraison(l.dossier); } catch (e) { K.toast(e.message); env.disabled = false; }
  };
  document.querySelectorAll('[data-router]').forEach(b => b.onclick = async () => {
    if (b.classList.contains('on')) return;
    try { const r = await K.api('/api/equipe/livraisons/' + l.id + '/retouche', { methode: 'POST', corps: { pour: b.dataset.router } }); K.toast(r.message); S.livraisons = null; await charger('livraisons'); await K.prod.chargerEtats(); await chargerLivraison(l.dossier); } catch (e) { K.toast(e.message); }
  });
  const cor = document.querySelector('[data-corriger]');
  if (cor) cor.onclick = () => {
    const v = K.fenetre('<div class="fen-h"><h2>Renvoyer pour correction</h2><p>Vos commentaires sur les fichiers sont visibles dans son espace.</p></div>' +
      '<div class="fen-b"><div class="onglets" style="margin-bottom:12px" id="corr-pour"><button class="on" data-pour="designer">' + i.pinceau + 'À la designer · visuels</button><button data-pour="strategiste">' + i.doc + 'Au stratégiste · textes</button></div><textarea class="in" id="note-corr" rows="4" style="width:100%;height:auto;padding:10px 12px" placeholder="Ce qui doit changer…"></textarea></div>' +
      '<div class="fen-f"><button class="btn btn-s" data-n>Annuler</button><button class="btn btn-r" data-o>Renvoyer</button></div>');
    v.querySelector('[data-n]').onclick = K.fermer;
    let pour = 'designer';
    v.querySelectorAll('[data-pour]').forEach(b => b.onclick = () => { pour = b.dataset.pour; v.querySelectorAll('[data-pour]').forEach(y => y.classList.toggle('on', y === b)); });
    v.querySelector('[data-o]').onclick = async () => {
      const ok = v.querySelector('[data-o]'); ok.disabled = true;
      try { const r = await K.api('/api/equipe/livraisons/' + l.id + '/decision', { methode: 'POST', corps: { action: 'corriger', pour, note: v.querySelector('#note-corr').value } }); K.fermer(); K.toast(r.message); S.livraisons = null; await charger('livraisons'); await K.prod.chargerEtats(); await chargerLivraison(l.dossier); } catch (e) { K.toast(e.message); ok.disabled = false; }
    };
  };
}

// ---------- RENDU ----------
const ECRANS = {
  '': { id: 'accueil', t: 'Vue d\'ensemble', a: 'accueil', b: [], besoins: ['resume', 'clients', 'commandes', 'prod', 'livraisons', 'factures'], f: ecranAccueil, ap: brancherPeriode },
  factures: { id: 'factures', t: 'Factures', a: 'recu', b: ['Commercial'], besoins: ['factures', 'clients', 'commandes'], f: ecranFactures, ap: brancherFactures },
  projets: { id: 'projets', t: 'Projets', a: 'dossier', b: ['Production'], besoins: ['commandes', 'prod'], f: ecranProjets, ap: brancherKanban, large: true },
  clients: { id: 'clients', t: 'Clients', a: 'gens', b: ['Commercial'], besoins: ['clients', 'resume', 'dossiers'], f: p => p[0] === 'nouveau' ? (setTimeout(nouveauClient, 0), ecranClients()) : p[0] ? ecranClient(p[0]) : ecranClients(), ap: p => p[0] && p[0] !== 'nouveau' ? brancherClient() : brancherClients() },
  commandes: { id: 'commandes', t: 'Commandes', a: 'sac', b: ['Commercial'], besoins: ['commandes'], f: ecranCommandes },
  dossiers: { id: 'production', t: 'Tous les dossiers', a: 'calques', b: ['Production'], besoins: ['dossiers'], f: () => ongletsProd('dossiers') + ecranDossiers(), ap: brancherDossiers },
  equipe: { id: 'equipe', t: 'Équipe', a: 'bouclier', b: [], besoins: ['equipe'], f: ecranEquipe },
  livraisons: { id: 'livraisons', t: 'Livraisons', a: 'envoi', b: ['Production'], besoins: ['livraisons', 'prod'], f: p => p[0] ? ecranLivraison(p[0]) : (LIV.dossier = null, ecranLivraisons()), ap: p => { if (p[0]) brancherLivraison(); } }
};
// les pages de production s'ouvrent dans l'admin (K.prod : liste des projets, ou la page en cadre)
const TEXTES_PROD = { fiche: 'La fiche créas de chaque projet.', dossier: 'Le dossier de production de chaque projet.', brief: 'Pour un projet livré en plusieurs fois ou un abonnement : ce que le client veut pour la suite.', visuels: 'Les visuels générés, avant et après la livraison.', telechargement: 'Le dossier à télécharger de chaque projet.' };
Object.keys(K.prod.sections).forEach(k => {
  ECRANS[k] = { id: 'production', t: K.prod.sections[k].fr, a: K.prod.sections[k].icone, b: ['Production'], besoins: ['prod'], prod: true,
    f: p => p[0] ? K.prod.vue(k, p[0], {}) : ongletsProd(k) + K.prod.liste_(k, { texte: TEXTES_PROD[k] }), ap: p => { if (p[0]) K.prod.brancher(k); } };
});
// les pages de production sont regroupées sous une seule entrée, avec des onglets
function ongletsProd(actif) {
  const O = [['fiche', 'Fiches créas'], ['dossier', 'Dossiers'], ['brief', 'Briefs suivants'], ['visuels', 'Visuels'], ['dossiers', 'Tous les dossiers']];
  return '<div class="onglets onglets-prod">' + O.map(([k, t]) => '<a href="#/' + k + '" class="' + (k === actif || (actif === 'telechargement' && k === 'visuels') ? 'on' : '') + '">' + esc(t) + '</a>').join('') + '</div>';
}
let rendu = 0;
let derniereProd = '';
K.rendre = async () => {
  const r = K.route(), e = ECRANS[r.ecran] || ECRANS[''];
  // une page de production déjà ouverte ne se recharge pas (on ne perd rien dans la fiche)
  if (e.prod && r.params[0] && derniereProd === location.hash && document.querySelector('.vp-cadre')) return;
  derniereProd = e.prod ? location.hash : '';
  const n = ++rendu;
  await charger('moi');
  const enAttente = e.besoins.filter(q => S[q] == null);
  if (enAttente.length && !document.querySelector('.app')) document.getElementById('racine').innerHTML = '<div class="chargement">Chargement…</div>';
  await Promise.all(e.besoins.map(q => charger(q)));
  const contenu = await e.f(r.params);
  if (n !== rendu) return;
  const c = conf();
  const xp = e.prod && r.params[0] ? K.prod.trouver(r.params[0]) : null;
  const titre = r.ecran === 'clients' && FICHE && r.params[0] === FICHE.client.id ? FICHE.client.marque : e.prod && r.params[0] ? (xp ? xp.nom : r.params[0]) : e.t;
  const fil = e.prod && r.params[0] ? [...e.b, e.t] : (e.b.length ? e.b : ['Admin']);
  document.getElementById('racine').innerHTML = K.coquille(c, e.id, K.ariane(e.a, ...fil, titre), contenu, e.prod && r.params[0] ? 'plein' : e.large);
  K.brancherCoquille(c);
  if (e.ap) e.ap(r.params);
  document.title = 'Admin · Kreative';
  if (S.prod) K.prod.surveiller(() => { S.livraisons = null; S.commandes = null; Promise.all([charger('livraisons'), charger('commandes')]).then(() => K.route().ecran === 'projets' ? rendreKanban() : K.rendre()); });
  // la production et les dossiers se chargent en fond pour la recherche et les compteurs
  ['prod', 'dossiers', 'clients', 'commandes'].forEach(q => { if (S[q] == null) charger(q).then(() => { if (n === rendu && q === 'prod') { const nb = document.querySelector('.nav a[href="#/projets"] .nb'); if (!nb) K.rendre(); } }); });
};
K.rendre();
</script>
