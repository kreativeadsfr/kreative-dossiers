<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Tableau de bord · Kreative</title>
<link rel="icon" type="image/png" sizes="32x32" href="../favicon-32.png">
<link rel="stylesheet" href="../ui/kreative.css">
<style>
/* ============================================================
   TABLEAU DE BORD (admin)
   Tous les projets en cours avec leur étape, leurs échéances et
   tous leurs liens ; les projets livrés ; et tous les dossiers du
   dépôt, avec une recherche par nom ou par code.
   Réservé au rôle admin (l'espace Cloudflare refuse les autres).
   ============================================================ */
.w{max-width:1160px;margin:0 auto;padding:0 24px 110px}
.k-top{max-width:1160px}
.nav{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.nav a{padding:9px 15px;border-radius:999px;color:var(--k-ink);text-decoration:none;font-size:14px;font-weight:500}
.nav a:hover{background:var(--k-soft)}
.nav a.sortie{color:var(--k-tx3)}
.hero{margin:50px 0 8px;display:flex;align-items:flex-end;gap:24px;flex-wrap:wrap}
.hero h1{font:600 48px/1.02 var(--k-titre);letter-spacing:-.045em;margin:0}
.hero h1 em{font-style:normal;color:var(--k-blue)}
.chiffres{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:28px 0 6px}
.chiffre{background:var(--k-pan);border:1px solid var(--k-line);border-radius:var(--k-r-s);padding:16px 18px}
.chiffre b{display:block;font:600 30px/1 var(--k-titre);letter-spacing:-.03em}
.chiffre span{color:var(--k-tx2);font-size:13.5px}
.chiffre.alerte b{color:#b3261e}
.titre{display:flex;align-items:center;gap:12px;margin:42px 0 16px}
.titre h2{font:600 26px/1.1 var(--k-titre);letter-spacing:-.025em;margin:0}
.titre .nb{min-width:28px;height:28px;padding:0 9px;border-radius:999px;background:var(--k-blue);color:#fff;font:600 13px/28px var(--k-texte);text-align:center}
.titre .nb.gris{background:var(--k-soft);color:var(--k-tx2)}
.liste{display:flex;flex-direction:column;gap:14px}
.p{background:var(--k-pan);border:1px solid var(--k-line);border-radius:var(--k-r);box-shadow:var(--k-ombre);padding:22px 24px}
.l1{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.nom{font:600 23px/1.15 var(--k-titre);letter-spacing:-.025em;margin:0}
.code{color:var(--k-tx3);font-size:13px;margin-top:3px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;letter-spacing:.02em;padding:5px 11px;border-radius:999px;background:var(--k-blue-soft);color:var(--k-blue)}
.pill.noir{background:#1f1f1f;color:#fff}
.pill.retard{background:#fde8e6;color:#b3261e}
.pill.ok{background:#e7f6ec;color:#1e7a3c}
.pill.gris{background:var(--k-soft);color:var(--k-tx2)}
.etapes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0 16px}
.etape{border:1px solid var(--k-line);border-radius:var(--k-r-s);padding:12px 14px;background:var(--k-bg)}
.etape small{display:block;color:var(--k-tx3);font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;margin-bottom:4px}
.etape div{font-size:14.5px}
.etape.fait div{color:#1e7a3c}
.etape.retard div{color:#b3261e;font-weight:600}
.etape.encours{border-color:var(--k-blue);background:#fff}
.liens{display:flex;gap:8px;flex-wrap:wrap}
.liens .k-btn2,.liens .k-btn{font-size:13.5px;padding:10px 16px}
.vide{padding:30px;text-align:center;color:var(--k-tx3);background:var(--k-pan);border:1px dashed var(--k-line2);border-radius:var(--k-r)}
.charge{color:var(--k-tx3);padding:20px 0}
.p.fait{padding:16px 22px}
.p.fait .nom{font-size:18px}
.recherche{display:block;width:100%;max-width:420px;font:inherit;font-size:15px;padding:13px 20px;border:1px solid var(--k-line2);border-radius:999px;background:#fff;outline:0;margin:0 0 14px}
.recherche:focus{border-color:var(--k-blue)}
.tous{background:var(--k-pan);border:1px solid var(--k-line);border-radius:var(--k-r);overflow:hidden}
.ligne{display:flex;align-items:center;gap:12px;padding:11px 18px;border-top:1px solid var(--k-line);flex-wrap:wrap}
.ligne:first-child{border-top:0}
.ligne b{font-weight:600;font-size:14.5px;min-width:230px}
.ligne .test{color:var(--k-tx3);font-size:12px}
.ligne .lk{margin-left:auto;display:flex;gap:14px}
.ligne .lk a{color:var(--k-blue);text-decoration:none;font-size:14px}
.ligne .lk a:hover{text-decoration:underline}
.plus{display:block;margin:12px auto 0;background:none;border:0;color:var(--k-tx2);font:inherit;font-size:14px;cursor:pointer;text-decoration:underline}
@media(max-width:820px){
  .w{padding:0 16px 90px}
  .hero h1{font-size:36px}
  .chiffres{grid-template-columns:repeat(2,1fr)}
  .etapes{grid-template-columns:1fr}
  .k-top{flex-wrap:wrap;border-radius:24px;row-gap:4px}
  .k-top-t{width:100%}
  .nav{margin-left:-10px}
  .nav a{padding:8px 10px}
  .ligne b{min-width:0}
  .ligne .lk{margin-left:0}
}
</style>
</head>
<body class="k">
<header class="k-top">
  <span class="k-top-t">Tableau de bord</span>
  <nav class="nav">
    <a href="../strategiste/">Espace stratégiste</a>
    <a href="../designer/">Designer space</a>
    <a href="../fiche/">Fiche créas</a>
    <a class="sortie" href="/_deconnexion">Se déconnecter</a>
  </nav>
</header>
<div class="w">
  <div class="hero"><h1>Tous les <em>projets</em></h1></div>
  <div class="chiffres">
    <div class="chiffre"><b id="cStrat">·</b><span>chez le stratégiste</span></div>
    <div class="chiffre"><b id="cDesi">·</b><span>chez le designer</span></div>
    <div class="chiffre"><b id="cLivre">·</b><span>livrés (en ligne)</span></div>
    <div class="chiffre" id="boxRetard"><b id="cRetard">·</b><span>en retard</span></div>
  </div>

  <div class="titre"><h2>En cours</h2><span class="nb" id="nbE">0</span></div>
  <div class="liste" id="encours"><div class="charge">Chargement des projets…</div></div>

  <div class="titre"><h2>Livrés</h2><span class="nb gris" id="nbL">0</span></div>
  <div class="liste" id="livres"></div>

  <div class="titre"><h2>Tous les dossiers</h2><span class="nb gris" id="nbT">0</span></div>
  <input class="recherche" id="q" type="search" placeholder="Chercher une marque ou un code…" autocomplete="off">
  <div class="tous" id="tous"><div class="charge" style="padding:16px 18px">Chargement…</div></div>
  <button class="plus" id="plus" type="button" hidden>Voir tous les dossiers</button>
</div>
<script>
const $ = id => document.getElementById(id);
const esc = t => String(t == null ? '' : t).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const lire = async u => { try { const r = await fetch(u + (u.includes('?') ? '&' : '?') + 't=' + Date.now(), {cache: 'no-store'}); return r.ok ? await r.json() : null; } catch (e) { return null; } };
const H = 36e5;
const quand = ms => new Intl.DateTimeFormat('fr-FR', {weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit', timeZone: 'Europe/Paris'}).format(new Date(ms));
const jour = ms => new Intl.DateTimeFormat('fr-FR', {day: 'numeric', month: 'short', timeZone: 'Europe/Paris'}).format(new Date(ms));
const lien = (h, t, cls, ext) => '<a class="' + (cls || 'k-btn2') + '" href="' + esc(h) + '"' + (ext ? ' target="_blank" rel="noopener"' : '') + '>' + t + '</a>';
const MOIS = {'01':'janv.','02':'févr.','03':'mars','04':'avr.','05':'mai','06':'juin','07':'juil.','08':'août','09':'sept.','10':'oct.','11':'nov.','12':'déc.'};

function etat(x) {
  const now = Date.now();
  if (x.livre) return {cle: 'livre', pill: '<span class="pill ok">Livré ✓</span>'};
  if (!x.envoye) {
    const late = x.strat && x.strat < now;
    return {cle: 'strat', retard: late, pill: late ? '<span class="pill retard">Fiche en retard</span>' : '<span class="pill">Chez le stratégiste</span>'};
  }
  const late = x.desi && x.desi < now;
  return {cle: 'desi', retard: late, pill: late ? '<span class="pill retard">Designer en retard</span>' : '<span class="pill noir">Chez le designer</span>'};
}

function etape(titre, ms, fait, faitLe, actif) {
  const now = Date.now();
  let cls = 'etape', txt = ms ? quand(ms) : '·';
  if (fait) { cls += ' fait'; txt = '✓ ' + (faitLe ? 'le ' + quand(faitLe) : 'fait'); }
  else if (ms && ms < now && actif) { cls += ' retard'; txt = 'en retard · ' + quand(ms); }
  else if (actif) cls += ' encours';
  return '<div class="' + cls + '"><small>' + titre + '</small><div>' + txt + '</div></div>';
}

function liens(x) {
  const d = x.d, prod = (d.livraison && d.livraison.projet) || x.dossier, b = [];
  b.push(lien('../' + prod + '/', 'Dossier de prod'));
  b.push(lien('../fiche/?projet=' + encodeURIComponent(x.dossier), 'Fiche'));
  if (x.retour) b.push(lien('../retours/?projet=' + encodeURIComponent(x.dossier), 'Retours du client'));
  if (x.envoye) { b.push(lien('../' + x.dossier + '/creas/', 'Aperçu designer')); b.push(lien('../' + x.dossier + '/creas/telecharger.html', 'Téléchargement')); }
  if (x.zip) b.push(lien(x.zip, 'Créas livrées', 'k-btn', true));
  return '<div class="liens">' + b.join('') + '</div>';
}

function carte(x) {
  const d = x.d, l = d.livraison, e = etat(x);
  const nom = esc(d.brand_name || x.dossier) + (l && l.sur > 1 ? ' <span style="color:var(--k-tx3);font-weight:500">· livraison ' + l.n + '/' + l.sur + '</span>' : '');
  return '<article class="p"><div class="l1"><div><h3 class="nom">' + nom + '</h3>' +
    '<div class="code">' + esc(x.dossier) + ' · ' + esc(d.nb_creas || '?') + ' créas' + (d.pack ? ' · ' + esc(d.pack) : '') + '</div></div>' +
    '<div style="margin-left:auto">' + e.pill + '</div></div>' +
    '<div class="etapes">' +
      etape('Fiche du stratégiste', x.strat, x.envoye, x.envoyeLe, !x.envoye) +
      etape('Rendu du designer', x.desi, x.livre, x.livreLe, x.envoye && !x.livre) +
      etape('Livraison client', x.client, false, 0, x.livre) +
    '</div>' + liens(x) + '</article>';
}

function carteFaite(x) {
  const d = x.d, l = d.livraison;
  return '<article class="p fait"><div class="l1"><div><h3 class="nom">' + esc(d.brand_name || x.dossier) + (l && l.sur > 1 ? ' · livraison ' + l.n + '/' + l.sur : '') + '</h3>' +
    '<div class="code">' + esc(x.dossier) + ' · ' + esc(d.nb_creas || '?') + ' créas · livré le ' + esc(jour(x.livreLe)) + '</div></div>' +
    '<div style="margin-left:auto">' + liens(x) + '</div></div></article>';
}

let TOUS = [], MONTRER = 15;
function ligneDossier(c) {
  const m = c.match(/^([A-Z0-9]+?)_(\d{2})_/), test = /^TEST|^REDO/.test(c);
  return '<div class="ligne"><b>' + esc(c) + '</b>' + (m && MOIS[m[2]] ? '<span class="test">' + MOIS[m[2]] + '</span>' : '') + (test ? '<span class="test">test</span>' : '') +
    '<span class="lk"><a href="../' + c + '/">Dossier</a><a href="../fiche/?projet=' + c + '">Fiche</a><a href="../' + c + '/creas/">Aperçu</a></span></div>';
}
function afficherTous() {
  const q = $('q').value.trim().toUpperCase().replace(/\s+/g, '');
  const l = TOUS.filter(c => !q || c.includes(q));
  const vus = q ? l : l.slice(0, MONTRER);
  $('tous').innerHTML = vus.length ? vus.map(ligneDossier).join('') : '<div class="charge" style="padding:16px 18px">Aucun dossier.</div>';
  $('plus').hidden = !!q || l.length <= MONTRER;
}

async function go() {
  let projets = await lire('../projets.json');
  if (!Array.isArray(projets)) projets = [];
  const tous = (await Promise.all(projets.filter(p => p && p.dossier).map(async p => {
    const [d, envois, liv, retour] = await Promise.all(['donnees', 'envois', 'livraison', 'retour'].map(f => lire('../' + p.dossier + '/' + f + '.json')));
    if (!d) return null;
    const ev = (envois && Array.isArray(envois.envois)) ? envois.envois : [];
    const livs = (liv && liv.livraisons) || [];
    const der = livs[livs.length - 1] || {};
    return {dossier: p.dossier, d, retour: !!retour,
      envoye: ev.length > 0, envoyeLe: Date.parse(typeof ev[ev.length - 1] === 'string' ? ev[ev.length - 1] : (ev[ev.length - 1] || {}).le || '') || 0,
      livre: !!(liv && liv.livre), livreLe: Date.parse(der.le || '') || 0, zip: der.lien || '',
      strat: Date.parse(d.deadline_strategiste || '') || 0, desi: Date.parse(d.deadline_designer || '') || 0, client: Date.parse(d.deadline || '') || 0};
  }))).filter(Boolean);

  const prochaine = x => (!x.envoye ? x.strat : x.desi) || x.client || 9e15;
  const enCours = tous.filter(x => !x.livre).sort((a, b) => prochaine(a) - prochaine(b));
  const livres = tous.filter(x => x.livre).sort((a, b) => b.livreLe - a.livreLe);
  $('cStrat').textContent = enCours.filter(x => !x.envoye).length;
  $('cDesi').textContent = enCours.filter(x => x.envoye).length;
  $('cLivre').textContent = livres.length;
  const nbRetard = enCours.filter(x => etat(x).retard).length;
  $('cRetard').textContent = nbRetard;
  $('boxRetard').classList.toggle('alerte', nbRetard > 0);
  $('nbE').textContent = enCours.length; $('nbL').textContent = livres.length;
  $('encours').innerHTML = enCours.length ? enCours.map(carte).join('') : '<div class="vide">Aucun projet en cours. Les nouveaux projets apparaissent ici dès que leur dossier est prêt.</div>';
  $('livres').innerHTML = livres.length ? livres.map(carteFaite).join('') : '<div class="vide">Aucun projet livré en ligne.</div>';

  const liste = await lire('/_admin/dossiers.json');
  TOUS = Array.isArray(liste) ? liste.slice().sort((a, b) => {
    const t = c => /^TEST|^REDO/.test(c) ? 1 : 0;
    return t(a) - t(b) || a.localeCompare(b);
  }) : [];
  $('nbT').textContent = TOUS.length;
  afficherTous();
}
$('q').addEventListener('input', afficherTous);
$('plus').onclick = () => { MONTRER = 1e9; afficherTous(); };
go();
</script>
</body>
</html>
