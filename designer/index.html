<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Designer space · Kreative</title>
<link rel="icon" type="image/png" sizes="32x32" href="../favicon-32.png">
<link rel="stylesheet" href="../ui/kreative.css">
<style>
/* ============================================================
   ESPACE DESIGNER
   Tous les projets du designer au même endroit : ceux à faire,
   avec leur échéance, l'aperçu, le dossier à télécharger et la
   livraison ; puis ceux déjà livrés.
   La page lit les fichiers publics du dépôt (projets.json, et pour
   chaque projet donnees.json, envois.json, livraison.json). La
   livraison passe par le même webhook que l'aperçu.
   ============================================================ */
.w{max-width:1060px;margin:0 auto;padding:0 24px 90px}
.hero{margin:54px 0 30px}
.hero h1{font:600 48px/1.02 var(--k-titre);letter-spacing:-.045em;margin:0}
.hero h1 em{font-style:normal;color:var(--k-blue)}
.hero p{margin:12px 0 0;color:var(--k-tx2);font-size:16px;max-width:620px}
.titre{display:flex;align-items:center;gap:12px;margin:40px 0 16px}
.titre h2{font:600 26px/1.1 var(--k-titre);letter-spacing:-.025em;margin:0}
.titre .nb{min-width:28px;height:28px;padding:0 9px;border-radius:999px;background:var(--k-blue);color:#fff;
  font:600 13px/28px var(--k-texte);text-align:center}
.titre .nb.gris{background:var(--k-soft);color:var(--k-tx2)}
.liste{display:flex;flex-direction:column;gap:14px}
.p{background:var(--k-pan);border:1px solid var(--k-line);border-radius:var(--k-r);box-shadow:var(--k-ombre);padding:22px 24px}
.p .l1{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.p .nom{font:600 23px/1.15 var(--k-titre);letter-spacing:-.025em;margin:0}
.p .meta{color:var(--k-tx2);font-size:14.5px;margin-top:4px}
.p .meta b{color:var(--k-ink);font-weight:600}
.p .act{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;letter-spacing:.02em;
  padding:5px 11px;border-radius:999px;background:var(--k-blue-soft);color:var(--k-blue)}
.pill.urgent{background:#1f1f1f;color:#fff}
.pill.retard{background:#fde8e6;color:#b3261e}
.pill.ok{background:var(--k-soft);color:var(--k-tx2)}
.liv{display:none;margin-top:18px;padding:20px;border-radius:18px;background:var(--k-dark);color:#fff}
.p.ouvert .liv{display:block}
.liv p{margin:0 0 12px;color:rgba(255,255,255,.75);font-size:14px}
.liv input,.liv textarea{display:block;width:100%;font:inherit;font-size:14.5px;padding:13px 16px;margin:0 0 10px;
  border:1px solid rgba(255,255,255,.14);border-radius:14px;background:rgba(255,255,255,.06);color:#fff;outline:0}
.liv input::placeholder,.liv textarea::placeholder{color:rgba(255,255,255,.45)}
.liv input:focus,.liv textarea:focus{border-color:var(--k-blue)}
.liv .etat{margin:10px 0 0;font-size:14px;color:rgba(255,255,255,.85);min-height:18px}
.vide{padding:30px;text-align:center;color:var(--k-tx3);background:var(--k-pan);border:1px dashed var(--k-line2);border-radius:var(--k-r)}
.charge{color:var(--k-tx3);padding:20px 0}
.p.fait{padding:16px 22px}
.p.fait .nom{font-size:18px}
@media(max-width:720px){
  .w{padding:0 16px 70px}
  .hero h1{font-size:36px}
  .p .act{margin-left:0;width:100%}
}
</style>
</head>
<body class="k">
<header class="k-top"><span class="k-top-t">Designer space</span></header>
<div class="w">
  <div class="hero">
    <h1>Your <em>projects</em></h1>
    <p>Everything you have to deliver, with your deadline. Open the preview, download the folder, and deliver from here when you are done.</p>
  </div>
  <div class="titre"><h2>To deliver</h2><span class="nb" id="nbF">0</span></div>
  <div class="liste" id="afaire"><div class="charge">Loading your projects…</div></div>
  <div class="titre" id="livres"><h2>Delivered</h2><span class="nb gris" id="nbL">0</span></div>
  <div class="liste" id="faits"></div>
</div>
<script>
const WEBHOOK = 'https://n8n.srv1536015.hstgr.cloud/webhook/livraison-designer';
const $ = id => document.getElementById(id);
const esc = t => String(t == null ? '' : t).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const lire = async u => { try { const r = await fetch(u + '?t=' + Date.now(), {cache: 'no-store'}); return r.ok ? await r.json() : null; } catch (e) { return null; } };
const H = 3600000;
const quand = ms => {
  const p = {};
  new Intl.DateTimeFormat('en-GB', {weekday: 'long', day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit', hourCycle: 'h23', timeZone: 'Europe/Paris'})
    .formatToParts(new Date(ms)).forEach(x => { p[x.type] = x.value; });
  return p.weekday + ' ' + p.day + ' ' + p.month + ', ' + p.hour + ':' + p.minute;
};
const jour = ms => new Date(ms).toLocaleDateString('en-GB', {day: 'numeric', month: 'long', timeZone: 'Europe/Paris'});

function badge(desi){
  if (!desi) return '';
  const reste = desi - Date.now();
  if (reste < 0) return '<span class="pill retard">Late</span>';
  if (reste < 12 * H) return '<span class="pill urgent">Due in ' + Math.max(1, Math.round(reste / H)) + ' h</span>';
  return '<span class="pill">Due in ' + Math.round(reste / 24 / H) + ' day' + (Math.round(reste / 24 / H) > 1 ? 's' : '') + '</span>';
}

function carte(x){
  const d = x.d, l = d.livraison;
  const nom = esc(d.brand_name || x.dossier) + (l && l.sur > 1 ? ' <span style="color:var(--k-tx3);font-weight:500">· part ' + l.n + '/' + l.sur + '</span>' : '');
  return '<article class="p" data-d="' + esc(x.dossier) + '">' +
    '<div class="l1"><div><h3 class="nom">' + nom + '</h3>' +
    '<div class="meta"><b>' + esc(d.nb_creas || '?') + ' creatives</b>' + (x.desi ? ' · due ' + esc(quand(x.desi)) + ' (Paris time)' : '') + '</div></div>' +
    badge(x.desi) +
    '<div class="act"><a class="k-btn2" href="../' + esc(x.dossier) + '/creas/" target="_blank" rel="noopener">Preview</a>' +
    '<a class="k-btn2" href="../' + esc(x.dossier) + '/creas/telecharger.html" target="_blank" rel="noopener">Download</a>' +
    '<button class="k-btn ouvrir" type="button">Deliver</button></div></div>' +
    '<div class="liv"><p>Export each creative in 1:1, 4:5 and 9:16, put the 3 folders in one zip, send it with SwissTransfer (or WeTransfer) and paste the link here.</p>' +
    '<input type="url" class="lienliv" placeholder="https://www.swisstransfer.com/d/..." autocomplete="off">' +
    '<textarea class="noteliv" rows="2" placeholder="Note for Kreative (optional)"></textarea>' +
    '<button class="k-btn envoyer" type="button">Mark as delivered</button><p class="etat"></p></div>' +
    '</article>';
}

function carteFaite(x){
  const d = x.d, l = d.livraison;
  return '<article class="p fait"><div class="l1"><div><h3 class="nom">' + esc(d.brand_name || x.dossier) +
    (l && l.sur > 1 ? ' · part ' + l.n + '/' + l.sur : '') + '</h3>' +
    '<div class="meta">' + esc(d.nb_creas || '?') + ' creatives · delivered ' + esc(jour(x.livreLe)) + '</div></div>' +
    '<span class="pill ok">Delivered ✓</span>' +
    '<div class="act"><a class="k-btn2" href="../' + esc(x.dossier) + '/creas/" target="_blank" rel="noopener">Preview</a></div></div></article>';
}

async function go(){
  let projets = await lire('../projets.json');
  if (!Array.isArray(projets)) projets = [];
  const tous = (await Promise.all(projets.filter(p => p && p.dossier && !/^TEST_/i.test(p.dossier)).map(async p => {
    const [d, envois, liv] = await Promise.all([lire('../' + p.dossier + '/donnees.json'), lire('../' + p.dossier + '/envois.json'), lire('../' + p.dossier + '/livraison.json')]);
    if (!d) return null;
    const lance = !!(envois && Array.isArray(envois.envois) && envois.envois.length);
    if (!lance) return null;                       // pas encore chez le designer
    const livs = (liv && liv.livraisons) || [];
    const livreLe = livs.length ? Date.parse(livs[livs.length - 1].le) : 0;
    return {dossier: p.dossier, d, livre: !!(liv && liv.livre), livreLe, desi: Date.parse(d.deadline_designer || '') || 0};
  }))).filter(Boolean);

  const afaire = tous.filter(x => !x.livre).sort((a, b) => (a.desi || 9e15) - (b.desi || 9e15));
  const faits = tous.filter(x => x.livre).sort((a, b) => b.livreLe - a.livreLe).slice(0, 20);
  $('nbF').textContent = afaire.length; $('nbL').textContent = faits.length;
  $('afaire').innerHTML = afaire.length ? afaire.map(carte).join('') : '<div class="vide">Nothing to deliver right now. New projects appear here as soon as they are ready.</div>';
  $('faits').innerHTML = faits.length ? faits.map(carteFaite).join('') : '<div class="vide">No delivered project yet.</div>';

  document.querySelectorAll('.p .ouvrir').forEach(b => b.onclick = () => {
    const p = b.closest('.p'); p.classList.toggle('ouvert');
    if (p.classList.contains('ouvert')) p.querySelector(".lienliv").focus();
  });
  document.querySelectorAll('.p .envoyer').forEach(b => b.onclick = async () => {
    const p = b.closest('.p'), etat = p.querySelector('.etat');
    const lien = p.querySelector(".lienliv").value.trim(), note = p.querySelector(".noteliv").value.trim();
    if (lien.indexOf('https://') !== 0) { etat.textContent = 'Please paste the full download link (it starts with https://).'; return; }
    if (/figma\.com/i.test(lien)) { etat.textContent = 'Please send the exported files (SwissTransfer or WeTransfer link to the zip), not the Figma link.'; return; }
    b.disabled = true; etat.textContent = 'Sending…';
    try {
      const r = await fetch(WEBHOOK, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({dossier: p.dataset.d, lien, note})});
      let rep = {}; try { rep = await r.json(); } catch (e) {}
      etat.textContent = rep.message || (r.ok ? 'Thank you! Kreative has been notified.' : 'Sending failed. Please message Kreative on Telegram.');
      if (r.ok) { b.textContent = 'Delivered ✓'; setTimeout(go, 2500); return; }
    } catch (e) { etat.textContent = 'Sending failed. Please message Kreative on Telegram.'; }
    b.disabled = false;
  });
}
go();
</script>
</body>
</html>
