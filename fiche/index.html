<style>
html{caret-color:transparent}input,textarea,select,[contenteditable],[contenteditable] *{caret-color:auto}

:root{
  --bg:#f9f6f4; --panel:#FFFFFF; --panel2:#efebe7; --line:#ebe5df;
  --tx:#1f1f1f; --tx2:#4f4f4f; --tx3:#8b8580; --ok:#4d94ff; --blue:#4d94ff; --blue-h:#3584fb; --dark:#1f1f1f;
  --gut:30px; --thumb:158px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);
  font-family:"Inter",-apple-system,"Segoe UI",sans-serif;font-size:15px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;display:flex;flex-direction:column;overflow-x:hidden}
img{display:block;max-width:100%}
body{cursor:default;user-select:none;-webkit-user-select:none;-moz-user-select:none}
input,textarea{cursor:auto;user-select:text;-webkit-user-select:text;-moz-user-select:text}
select,option,button,label{-webkit-user-select:none;user-select:none}
select,button,.chip,.tab,.it,.drop,.af .x,a{cursor:pointer}
input,textarea,select,button{font:inherit;color:inherit}

/* ---------- header ---------- */
header{flex:none;z-index:20;background:var(--panel);border-bottom:1px solid var(--line)}

/* la premiere ligne : le titre, le projet, l avancement */
.bar1{display:flex;align-items:center;gap:20px;flex-wrap:wrap;padding:20px var(--gut)}
.bar1 h1{margin:0;font-size:21px;font-weight:600;letter-spacing:-.022em;line-height:1.2}
.bar1 h1::after{content:"";display:block;width:26px;height:2px;margin-top:6px;
  background:var(--tx);border-radius:2px;opacity:.85}

.bar1 input{padding:10px 13px;border:1px solid var(--line);border-radius:10px;
  background:var(--bg);font-size:14px}
/* le vrai select reste la source de verite, mais il ne s affiche pas :
   le menu natif du navigateur ne se laisse pas habiller, ses coins
   restent carres et son rendu depend du systeme. On le double d une
   liste maison, entierement stylee. */
select#projet{position:absolute;opacity:0;pointer-events:none;width:0;height:0}

.sel{position:relative;display:inline-block}
.selbtn{display:flex;align-items:center;gap:14px;
  min-width:310px;max-width:440px;
  padding:11px 15px;border:1px solid var(--line);border-radius:12px;
  background:var(--bg);font-size:14.5px;text-align:left;transition:.14s}
.selbtn:hover{border-color:#CFCCC2;background:#fcfaf8}
.sel.ouvert .selbtn{background:var(--panel);border-color:var(--tx);
  box-shadow:0 0 0 3px rgba(0,0,0,.07)}
.selbtn .lab{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.selbtn.rien .lab{color:var(--tx3)}
.selbtn .fl{flex:none;width:11px;height:7px;transition:transform .18s ease;color:var(--tx3)}
.sel.ouvert .selbtn .fl{transform:rotate(180deg);color:var(--tx)}

.selpan{position:absolute;top:calc(100% + 8px);left:0;z-index:60;
  min-width:100%;width:max-content;max-width:460px;max-height:360px;overflow-y:auto;
  padding:7px;border:1px solid var(--line);border-radius:15px;background:var(--panel);
  box-shadow:0 16px 44px rgba(0,0,0,.14), 0 2px 6px rgba(0,0,0,.05);
  animation:pop .14s ease;scrollbar-width:thin}
.selpan[hidden]{display:none}
@keyframes pop{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:none}}
.selgrp{padding:12px 12px 6px;font-size:11px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--tx3)}
.selgrp+.selopt{margin-top:0}
.selopt{display:flex;align-items:baseline;gap:14px;padding:10px 12px;border-radius:10px;
  font-size:14px;cursor:pointer;transition:background .1s}
.selopt:hover,.selopt.actif{background:var(--bg)}
.selopt.on{background:var(--tx);color:#fff}
.selopt.on:hover,.selopt.on.actif{background:#1f1f1f}
.selopt .nm{flex:1;min-width:0;font-weight:500;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.selopt .meta{flex:none;font-size:12px;color:var(--tx3);white-space:nowrap;
  font-variant-numeric:tabular-nums}
.selopt.on .meta{color:rgba(255,255,255,.6)}
.selrien{padding:14px 12px;font-size:13.5px;color:var(--tx3);text-align:center}
.selferm{margin-top:5px;padding:10px 12px;border-top:1px solid var(--line);
  font-size:13.5px;color:var(--tx2);cursor:pointer;border-radius:0 0 10px 10px;
  transition:background .1s}
.selferm:hover{background:var(--bg);color:var(--tx)}

/* l avancement, a droite */
.prog{margin-left:auto;display:flex;align-items:center;gap:11px}
.prog .cnt{font-size:13px;color:var(--tx2);font-variant-numeric:tabular-nums;white-space:nowrap}
.prog .jauge{width:104px;height:5px;border-radius:99px;background:var(--panel2);overflow:hidden}
.prog .jauge i{display:block;height:100%;width:0;border-radius:99px;
  background:var(--ok);transition:width .25s ease}
body.vide .prog{opacity:.35}

/* la deuxieme ligne : les creas, sur son propre fond */
.reprise[hidden]{display:none}
.reprise{display:flex;gap:16px;align-items:center;margin:12px var(--gut) 0;padding:14px 16px;border-radius:12px;background:#F4EFFF;border:1px solid #E2D9FF}
.reprise img{width:64px;height:64px;border-radius:8px;object-fit:cover;flex-shrink:0}
.reprise .rt{flex:1;min-width:0}.reprise .rt small{display:block;font-size:12px;font-weight:600;color:#6B4FD8;letter-spacing:.04em;text-transform:uppercase;margin-bottom:3px}
.reprise .rt p{margin:2px 0 0;font-size:15px;line-height:1.4;color:#1a1a1a}
.reprise .rx{font-size:12.5px;color:#777;max-width:240px;line-height:1.4}
body.en-reprise #reset{display:none}
.strip{display:flex;gap:8px;overflow-x:auto;padding:15px var(--gut);
  border-top:1px solid var(--line);background:#fcfaf8;scrollbar-width:thin}
.nbc{font-size:14px;color:var(--tx2);font-variant-numeric:tabular-nums}
.aucun{display:none;padding:14px var(--gut);background:#fcfaf8;
  border-top:1px solid var(--line);font-size:13.5px;color:var(--tx2)}
body.vide .aucun{display:block}
body.vide .strip{display:none}
body.vide .left{opacity:.38;pointer-events:none;user-select:none}
body.vide .foot button{opacity:.38;pointer-events:none}
.chip sup{font-size:10px;margin-left:1px;vertical-align:4px}
.chip.v{width:auto;min-width:46px;padding:0 9px}
.chip{flex:none;width:46px;height:36px;border:1px solid var(--line);border-radius:10px;
  background:var(--panel);color:var(--tx2);font-size:13px;font-variant-numeric:tabular-nums;
  cursor:pointer;transition:.12s}
.chip:hover{border-color:#B0ADA3;color:var(--tx)}
.chip.full{border-color:#cfe1ff;color:var(--blue);background:#eaf2ff}
.chip.on{background:var(--tx);border-color:var(--tx);color:#fff}

/* ---------- deux panneaux ---------- */
main{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:minmax(360px,540px) minmax(0,1fr)}
.pane{min-width:0;min-height:0;display:flex;flex-direction:column}

/* ---------- gauche : la crea ---------- */
.left{overflow-y:auto;padding:28px var(--gut) 32px;
  scrollbar-width:none;-ms-overflow-style:none}
.left::-webkit-scrollbar{width:0;height:0;display:none}
.lin{width:100%;max-width:520px;margin:0 auto}
.htitle{display:flex;align-items:baseline;gap:12px;margin:0 0 22px}
.htitle b{font-size:20px;font-weight:600;letter-spacing:-.01em}
.htitle span{font-size:13px;color:var(--tx3)}
.htitle span.ok{color:var(--ok)}
.form{display:flex;flex-direction:column;gap:18px}
.fld{display:flex;flex-direction:column;gap:7px}
.fld label{font-size:12.5px;color:var(--tx3);letter-spacing:.01em}
.fld input,.fld textarea{width:100%;padding:12px 14px;border:1px solid var(--line);
  border-radius:10px;background:var(--panel);font-size:15px;resize:vertical;transition:.12s}
.fld input::placeholder,.fld textarea::placeholder{color:#BCB9AF}
.fld input:focus,.fld textarea:focus{outline:none;border-color:var(--tx);
  box-shadow:0 0 0 3px rgba(0,0,0,.07)}

.refbox{display:flex;align-items:center;gap:15px;margin-top:26px;
  padding:15px;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
.refbox .vign{flex:none;width:60px;height:75px;border-radius:8px;overflow:hidden;
  background:var(--panel2);display:flex;align-items:center;justify-content:center;
  font-size:11px;color:var(--tx3)}
.refbox .vign img{width:100%;height:100%;object-fit:contain}
.refbox b{display:block;font-size:15px;font-weight:500}
.refbox small{font-size:12.5px;color:var(--tx3)}
.refbox .dup{font-size:12.5px;color:#B3261E;margin-top:2px}

.nav{display:flex;gap:10px;margin-top:26px}
button{padding:10px 17px;border:1px solid var(--line);background:var(--panel);
  border-radius:10px;cursor:pointer;font-size:14px;transition:.12s}
button:hover:not(:disabled){border-color:#CFCCC2}
button.p{background:var(--tx);border-color:var(--tx);color:#fff}
button.p:hover:not(:disabled){background:#1f1f1f;border-color:#1f1f1f}
button:disabled{opacity:.35;cursor:default}

/* ---------- droite : banque d inspirations ---------- */
.rail{border-left:1px solid var(--line);background:var(--panel)}
.railhead{flex:none;padding:18px var(--gut) 15px;border-bottom:1px solid var(--line);
  display:flex;flex-direction:column;gap:9px}
.tabs{display:flex;gap:7px;flex-wrap:wrap}
.tab{padding:6px 13px;border:1px solid var(--line);border-radius:999px;background:var(--bg);
  color:var(--tx2);font-size:12.5px;cursor:pointer;transition:.12s}
.tab:hover{border-color:#CFCCC2}
.tab.on{background:var(--tx);border-color:var(--tx);color:#fff}
.grid{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;
  scrollbar-width:thin;scrollbar-color:#CFCCC2 transparent;
  display:grid;align-content:start;grid-auto-rows:min-content;gap:16px;
  grid-template-columns:repeat(auto-fill,minmax(var(--thumb),1fr));
  padding:20px var(--gut) 28px;background:var(--bg)}
.it{position:relative;min-height:226px;border:1px solid var(--line);border-radius:12px;
  overflow:hidden;cursor:pointer;background:var(--panel);transition:.12s}
.it:hover{border-color:#B0ADA3;transform:translateY(-2px);box-shadow:0 6px 16px rgba(0,0,0,.08)}
.it .im{position:relative;width:100%;height:196px;background:var(--panel2);overflow:hidden}
.it .im img{position:absolute;top:0;left:0;width:100%;height:196px;object-fit:contain}
.it .cap{padding:7px 8px;border-top:1px solid var(--line);text-align:center;
  font-size:12px;color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it.on{border-color:var(--tx);box-shadow:0 0 0 2px var(--tx)}
.it.on .cap{background:var(--tx);color:#fff;border-top-color:var(--tx)}

/* ---------- footer ---------- */
.foot{flex:none;border-top:1px solid var(--line);background:var(--panel);
  display:flex;align-items:center;gap:12px;padding:15px var(--gut)}
.foot .msg{font-size:13px;color:var(--tx3)}
.foot .msg.ok{color:var(--ok)}
.foot .msg.ko{color:#B3261E}
.deja{display:none;margin:0 0 18px;padding:11px 14px;border:1px solid #E8D4A6;
  border-radius:10px;background:#FDF8EC;color:#7A5B12;font-size:13.5px}
body.envoyee .deja{display:block}

/* ---------- ecrans ---------- */
@media(min-width:901px){
  html,body{height:100%}
  body{overflow:hidden}
}
@media(max-width:1400px){:root{--thumb:135px}}
@media(max-width:1150px){:root{--gut:24px;--thumb:120px}}
@media(max-width:900px){
  :root{--gut:18px;--thumb:130px}
  main{grid-template-columns:1fr}
  .rail{border-left:none;border-top:1px solid var(--line)}
  .grid{max-height:65vh}
  .lin{max-width:none}
}
.grid::-webkit-scrollbar{width:9px}
.grid::-webkit-scrollbar-thumb{background:#CFCCC2;border-radius:9px;border:3px solid var(--bg)}
.grid::-webkit-scrollbar-track{background:transparent}

.drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  padding:20px 14px;border:1.5px dashed #CFCCC2;border-radius:12px;background:var(--panel);
  cursor:pointer;text-align:center;transition:.12s}
.drop:hover,.drop:focus-visible{border-color:var(--tx);background:#fcfaf8;outline:none}
.drop.over{border-color:var(--tx);background:#eaf2ff;border-style:solid}
.drop b{font-size:14px;font-weight:500}
.drop span{font-size:12.5px;color:var(--tx3);max-width:330px}
.ass{display:flex;flex-direction:column;gap:7px}
.ass:empty{display:none}
.af{display:flex;align-items:center;gap:11px;padding:7px 9px;border:1px solid var(--line);
  border-radius:10px;background:var(--panel)}
.af .tn{flex:none;width:38px;height:38px;border-radius:7px;overflow:hidden;background:var(--panel2);
  display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:500;color:var(--tx3)}
.af .tn img{width:100%;height:38px;object-fit:cover}
.af .nm{flex:1;min-width:0;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.af .sz{flex:none;font-size:11.5px;color:var(--tx3)}
.af .x{flex:none;padding:2px 8px;border-radius:7px;font-size:16px;line-height:1.1;color:var(--tx3)}
.af .x:hover{color:#B3261E;border-color:#E6C4C0}

.ov{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.45);
  display:flex;align-items:center;justify-content:center;padding:22px}
.ov[hidden]{display:none}
.ov .box{background:var(--panel);border:1px solid var(--line);border-radius:18px;
  padding:32px 30px;max-width:430px;width:100%;text-align:center;
  box-shadow:0 24px 60px rgba(0,0,0,.22)}
.ov .tick{width:54px;height:54px;margin:0 auto 15px;border-radius:50%;background:#eaf2ff;
  color:var(--ok);font-size:25px;display:flex;align-items:center;justify-content:center}
.ov b{display:block;font-size:19px;font-weight:600;margin-bottom:7px}
.ov .fn{margin:0 0 24px;font-size:13px;color:var(--tx2);word-break:break-all}
.ov .hint{margin:0 0 22px;font-size:13.5px;color:var(--tx3);line-height:1.5}
.ovn{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

/* ============ NOUVEAU : les deux facons de remplir une crea ============ */
.mode{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;margin:0 0 22px;
  border:1px solid var(--line);border-radius:12px;background:var(--panel2);container-type:inline-size}
.mode::before{content:"";position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 6px);border-radius:9px;
  background:var(--panel);box-shadow:0 1px 3px rgba(0,0,0,.10);transition:transform .28s cubic-bezier(.3,.7,.25,1)}
.mode.libre::before{transform:translateX(calc(100% + 4px))}
.mode button{position:relative;z-index:1;border:none;background:transparent;border-radius:9px;padding:11px 10px;
  display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.25;
  font-size:clamp(12px, calc((50cqi - 30px) / 15), 14px);color:var(--tx2);transition:color .2s}
.mode button:hover{color:var(--tx);background:transparent}
.mode button.on{color:var(--tx);font-weight:500}
@container (min-width:420px){.mode button{white-space:nowrap}}

.lbl{font-size:12.5px;color:var(--tx3);letter-spacing:.01em}
.lbl b{font-weight:500;color:var(--tx2)}
.vide-ref{padding:26px 18px;border:1.5px dashed #CFCCC2;border-radius:12px;background:var(--panel);
  text-align:center;color:var(--tx2);font-size:13.5px}
.vide-ref b{display:block;color:var(--tx);font-size:14.5px;font-weight:500;margin-bottom:3px}

/* l inspi en grand, avec ses numeros */
.prev{border:1px solid var(--line);border-radius:14px;background:var(--panel);overflow:hidden}
.prevhead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;padding:12px 14px;border-bottom:1px solid var(--line)}
.prevhead b{font-size:15px;font-weight:600}
.prevhead small{font-size:12.5px;color:var(--tx3)}
.prevhead .dup{margin-left:auto;font-size:12.5px;color:#B3261E}
.stage{display:flex;justify-content:center;background:var(--panel2);padding:12px}
.pinbox{position:relative;display:inline-block;max-width:100%}
.pinbox img{display:block;max-width:100%;max-height:440px;width:auto;height:auto;border-radius:6px}
.pin{position:absolute;transform:translate(-50%,-50%);width:26px;height:26px;padding:0;border-radius:50%;
  display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;font-variant-numeric:tabular-nums;
  background:var(--tx);color:#fff;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.35);
  transition:transform .16s ease,background .16s ease}
.pinbox .pin:hover{transform:translate(-50%,-50%) scale(1.15);border-color:#fff}
.pin.sec{background:#fff;color:var(--tx);border-color:var(--tx)}
.pin.sel{transform:translate(-50%,-50%) scale(1.35);background:#4d94ff;color:#fff;border-color:#fff;z-index:2}

.slots{display:flex;flex-direction:column;gap:14px}
.slot{display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px;align-items:start}
.slot .n{width:26px;height:26px;margin-top:9px;padding:0;border-radius:50%;background:var(--tx);border:1.5px solid var(--tx);color:#fff;
  font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums;
  transition:transform .16s ease,background .16s ease}
.slot.sec .n{background:var(--panel);color:var(--tx)}
.slot.sel .n{background:#4d94ff;border-color:#4d94ff;color:#fff;transform:scale(1.18)}
.slot .fld{gap:5px}
.slot .fld label{font-size:12.5px;color:var(--tx3)}
.orig{font-size:12px;color:#ABA89E;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot.sel .orig{white-space:normal;color:var(--tx2)}
.grp{display:flex;flex-direction:column;gap:12px;padding-top:4px}
.grp+.grp{padding-top:16px;border-top:1px solid var(--line)}
.defaut{font-size:12.5px;color:var(--tx3)}
/* les retours du client sur la livraison precedente */
.options{margin:0 0 14px;padding:14px 16px;border:1px solid #cfe1ff;border-radius:16px;background:#f3f8ff;font-size:13.5px;line-height:1.5;color:var(--tx2)}
.options .ot{font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#2b6fd6;margin-bottom:6px}
.options p{margin:4px 0 0}.options b{color:var(--tx);font-weight:600}
.retour{margin:0 0 18px;border:1px solid #cfe1ff;border-radius:16px;background:#f3f8ff;overflow:hidden}
.retour summary{cursor:pointer;padding:11px 16px;font-size:14px;font-weight:600;list-style:none;display:flex;gap:8px;align-items:baseline}
.retour summary::-webkit-details-marker{display:none}
.retour summary small{font-weight:400;color:var(--tx3);font-size:12.5px}
.retour .rb{padding:0 16px 16px;display:flex;flex-direction:column;gap:12px}
.retour .rmix{font-size:14px}
.retour .rl{font-size:12px;color:var(--tx3);margin-bottom:5px}
.retour .rimgs{display:flex;gap:8px;flex-wrap:wrap}
.retour .rimgs a{display:block;width:84px;height:84px;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:#fff}
.retour .rimgs img{width:100%;height:100%;object-fit:cover;display:block}
.retour .rtx{font-size:13.5px;line-height:1.5;color:var(--tx2)}
.retour .rtx b{color:var(--tx);font-weight:500}
.retour summary::after{content:"";margin-left:auto;width:7px;height:7px;border-right:1.5px solid var(--tx3);border-bottom:1.5px solid var(--tx3);transform:rotate(45deg);align-self:center;transition:transform .15s}
.retour[open] summary::after{transform:rotate(-135deg)}
.retour .rvoir{align-self:flex-start;display:inline-flex;padding:9px 15px;border-radius:10px;background:var(--tx);color:#fff;font-size:13px;font-weight:500;text-decoration:none}
.retour .rvoir:hover{opacity:.88}
/* declinaisons de texte : plusieurs versions du texte sur le meme visuel */
.vers{display:flex;flex-direction:column;gap:8px;padding-top:16px;border-top:1px solid var(--line)}
.vchoix{display:flex;gap:6px;flex-wrap:wrap}
.vchoix button{min-width:44px;padding:8px 12px;font-size:13.5px}
.vchoix button.on{background:var(--tx);color:#fff;border-color:var(--tx)}
.vaide{font-size:12.5px;color:var(--tx3);line-height:1.45}
.vin{display:grid;grid-template-columns:22px minmax(0,1fr);gap:6px;align-items:center}
.vin i{font-style:normal;font-size:12px;font-weight:600;color:var(--tx3);text-align:center}
.vins{display:flex;flex-direction:column;gap:6px}
.repr{display:flex;flex-direction:column;gap:7px;padding-top:16px;border-top:1px solid var(--line)}
.repr select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel);font-size:14px}

/* idee libre */
.moods{display:flex;gap:10px;flex-wrap:wrap}
.mood{position:relative;width:88px;border:1px solid var(--line);border-radius:10px;background:var(--panel);overflow:hidden}
.mood img{width:100%;height:100px;object-fit:contain;background:var(--panel2)}
.mood span{display:block;padding:4px 6px;font-size:11.5px;text-align:center;color:var(--tx2);border-top:1px solid var(--line)}
.mood .x{position:absolute;top:4px;right:4px;width:22px;height:22px;padding:0;border-radius:50%;
  background:rgba(255,255,255,.94);font-size:14px;line-height:1;color:var(--tx2)}
.mood .x:hover{color:#B3261E;border-color:#E6C4C0}
.mood.place{font:inherit;cursor:default;display:flex;align-items:center;justify-content:center;min-height:126px;border-style:dashed;
  color:var(--tx3);font-size:12px;text-align:center;padding:8px}
.alerte{font-size:12.5px;color:#B3261E}
.lines{display:flex;flex-direction:column;gap:8px}
.line{display:grid;grid-template-columns:158px minmax(0,1fr) 38px;gap:8px;align-items:center}
.line input{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--panel);font-size:15px;transition:.12s}
.line input:focus{outline:none;border-color:var(--tx);box-shadow:0 0 0 3px rgba(0,0,0,.07)}
.line .x{padding:0;height:44px;color:var(--tx3);font-size:17px}
.line .x:hover{color:#B3261E;border-color:#E6C4C0}
.addline{align-self:flex-start;border-style:dashed;color:var(--tx2);font-size:13.5px}
.addline:hover{color:var(--tx);border-color:var(--tx)}

/* la liste des roles : meme menu maison que celui des projets */
.rsel{position:relative}
.rselbtn{width:100%;display:flex;align-items:center;gap:10px;padding:12px 12px 12px 14px;border:1px solid var(--line);
  border-radius:10px;background:var(--panel);font-size:14px;text-align:left;transition:.14s}
.rselbtn:hover{border-color:#CFCCC2;background:#fcfaf8}
.rsel.ouvert .rselbtn{border-color:var(--tx);box-shadow:0 0 0 3px rgba(0,0,0,.07);background:var(--panel)}
.rselbtn .lab{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rselbtn .fl{flex:none;width:11px;height:7px;color:var(--tx3);transition:transform .18s ease}
.rsel.ouvert .rselbtn .fl{transform:rotate(180deg);color:var(--tx)}
.rsel.autre .rselin{width:100%;padding:12px 38px 12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--panel);font-size:14px;transition:.12s}
.rsel.autre .rselin:focus{outline:none;border-color:var(--tx);box-shadow:0 0 0 3px rgba(0,0,0,.07)}
.rsel.autre .rselfl{position:absolute;top:50%;right:6px;transform:translateY(-50%);width:28px;height:28px;padding:0;border:none;background:transparent;justify-content:center;gap:0}
.rsel.autre .rselfl:hover{background:var(--panel2)}
.rsel.ouvert .rselin{border-color:var(--tx);box-shadow:0 0 0 3px rgba(0,0,0,.07)}
.rselpan .autreopt{margin-top:5px;border-top:1px solid var(--line);border-radius:0 0 10px 10px;padding-top:12px}
.rselpan{position:absolute;top:calc(100% + 8px);left:0;z-index:60;min-width:100%;width:max-content;
  padding:7px;border:1px solid var(--line);border-radius:15px;background:var(--panel);
  box-shadow:0 16px 44px rgba(0,0,0,.14),0 2px 6px rgba(0,0,0,.05);animation:pop .14s ease}
.rselpan[hidden]{display:none}
/* la liste defile, avec une barre fine aux couleurs de la fiche */
.rselpan{max-height:262px;overflow-y:auto;overscroll-behavior:contain}
.rselpan::-webkit-scrollbar{width:12px}
.rselpan::-webkit-scrollbar-track{background:transparent;margin:10px 0}
.rselpan::-webkit-scrollbar-thumb{background:#DAD7CE;border-radius:12px;border:4px solid var(--panel)}
.rselpan::-webkit-scrollbar-thumb:hover{background:#C4C1B7}
.rselpan::-webkit-scrollbar-button{display:none;height:0}
@supports not selector(::-webkit-scrollbar){.rselpan{scrollbar-width:thin;scrollbar-color:#DAD7CE transparent}}

.it.ajout{border-style:dashed;background:transparent}
.it.ajout .im{display:flex;align-items:center;justify-content:center;background:transparent}
.it.ajout .im span{font-size:44px;line-height:1;color:var(--tx3)}
.it.ajout:hover .im span{color:var(--tx)}
.slot{position:relative}
.slot .sx{position:absolute;top:2px;right:0;width:24px;height:24px;padding:0;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--tx3);font-size:15px;line-height:1;cursor:pointer}
.slot .sx:hover{color:#B3261E;border-color:#E6C4C0}
button.mood.place{cursor:pointer;color:var(--tx2)}
button.mood.place:hover{border-color:var(--tx);color:var(--tx)}
.aideperso{margin:10px 0 4px;font-size:12.5px;color:var(--tx3)}
.gvide{grid-column:1/-1;padding:40px 16px;text-align:center;font-size:13.5px;color:var(--tx3)}
.railhint{font-size:12.5px;color:var(--tx3);min-height:18px}
.railhint b{font-weight:500;color:var(--tx2)}
.railhint.ko{color:#B3261E}
.it.mood-on{border-color:#4d94ff;box-shadow:0 0 0 2px #4d94ff}
.it.mood-on .cap{background:#4d94ff;color:#fff;border-top-color:#4d94ff}
.it .rank{position:absolute;top:8px;right:8px;z-index:1;width:24px;height:24px;border-radius:50%;background:#4d94ff;color:#fff;
  font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center}
@media(max-width:900px){.line{grid-template-columns:minmax(0,1fr) 38px}.line .rsel{grid-column:1/-1}}
@media(prefers-reduced-motion:reduce){.pin,.slot .n,.rselpan,.selpan{transition:none;animation:none}}

/* ============ 14/10 : DA KREATIVE (couleurs et polices du site) ============ */
.bar1 h1,.htitle b,.ov b,.prevhead b{font-family:"Inter Tight","Inter",sans-serif}
.htitle b{font-size:22px;letter-spacing:-.02em}
button{border-radius:999px;padding:10px 18px}
button.p{background:var(--blue);border-color:var(--blue);color:#fff}
button.p:hover:not(:disabled){background:var(--blue-h);border-color:var(--blue-h)}
.chip{border-radius:12px}
.chip.on{background:var(--tx);border-color:var(--tx);color:#fff}
.mode button{border-radius:9px}
.af .x,.mood .x,.line .x{border-radius:999px}
.selbtn,.rselbtn,.fld input,.fld textarea,.line input,.repr select,.rsel.autre .rselin{border-radius:14px}
.sel.ouvert .selbtn,.fld input:focus,.fld textarea:focus,.line input:focus,.rsel.ouvert .rselbtn{border-color:var(--blue);box-shadow:0 0 0 3px rgba(77,148,255,.18)}
.selopt.on{background:var(--blue)}
.selopt.on:hover,.selopt.on.actif{background:var(--blue-h)}
.it{border-radius:16px}
.it.on{border-color:var(--blue);box-shadow:0 0 0 2px var(--blue)}
.it.on .cap{background:var(--blue);border-top-color:var(--blue)}
.vchoix button.on{background:var(--blue);border-color:var(--blue)}
.prog .jauge i{background:var(--blue)}
.drop:hover,.drop:focus-visible,.drop.over{border-color:var(--blue)}
.retour .rvoir{border-radius:999px;background:var(--blue)}
.retour .rvoir:hover{opacity:1;background:var(--blue-h)}
.prev,.refbox,.vide-ref,.drop{border-radius:16px}
.ov{background:rgba(31,31,31,.55)}
.ov .box{border-radius:24px}
.foot .msg.ok{color:var(--blue)}
#reprsel{display:block}
#reprsel .selbtn{width:100%;min-width:0;max-width:none;border-radius:14px;background:var(--panel)}
#reprsel .selpan{width:100%;max-width:none}
#reprsel.ouvert .selbtn{border-color:var(--blue);box-shadow:0 0 0 3px rgba(77,148,255,.18)}
.bar1 h1{font-size:27px;font-weight:500;letter-spacing:-.025em;line-height:1.1}
.bar1 h1::after{display:none}
</style>
</head>
<body>
<header>
  <div class="bar1">
    <h1>Fiche créas</h1>
    <div class="sel" id="sel">
      <button class="selbtn rien" id="selbtn" type="button" aria-haspopup="listbox" aria-expanded="false">
        <span class="lab" id="sellab">Chargement des projets…</span>
        <svg class="fl" viewBox="0 0 12 8" fill="none" aria-hidden="true"><path d="M1 1.5 6 6.5l5-5"
          stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div class="selpan" id="selpan" role="listbox" hidden></div>
    </div>
    <select id="projet"><option value="">Chargement des projets...</option></select>
    <input id="custom" type="number" min="1" max="60" placeholder="nb de créas" style="width:128px;display:none">
    <div class="prog">
      <span class="cnt" id="count">0 / 0</span>
      <div class="jauge"><i id="jauge"></i></div>
    </div>
  </div>
  <div class="reprise" id="reprise" hidden></div>
  <div class="strip" id="strip"></div>
  <div class="aucun" id="aucun">Choisis un projet dans le menu ci-dessus pour commencer. La banque de références reste consultable.</div>
</header>

<main>
  <section class="pane left">
    <div class="lin">
      <div class="htitle"><b id="ctitle">Créa 01</b><span id="cst">en cours</span></div>
      <div class="options" id="options" hidden></div>
      <details class="retour" id="retour" hidden></details>
      <div class="deja" id="deja"></div>
      <div class="mode" id="mode" role="tablist" aria-label="Façon de remplir la créa">
        <button type="button" id="m-inspi" role="tab">Reprendre une créa d'inspiration</button>
        <button type="button" id="m-libre" role="tab">Partir d'une nouvelle idée</button>
      </div>
      <div class="form">
        <div id="zone" class="form"></div>
        <div class="fld">
          <label for="idee" id="ideelab">Idée du visuel</label>
          <textarea id="idee" rows="4"></textarea>
        </div>
        <div class="fld">
          <label>Assets de cette créa</label>
          <div class="drop" id="drop" tabindex="0">
            <b id="dropt">Glisse ici les assets de la créa 01</b>
            <span>Seulement ce qui sert a ce visuel : photo produit, logo, capture d avis</span>
          </div>
          <input type="file" id="file" multiple accept="image/*,.pdf,.svg" style="display:none">
          <div class="ass" id="assets"></div>
        </div>
      </div>
      <div class="nav">
        <button id="effacer">Effacer cette créa</button>
        <button id="prev">Précédente</button>
        <button class="p" id="next">Suivante</button>
        <button class="p" id="send" style="display:none">Envoyer la fiche</button>
      </div>
    </div>
  </section>

  <aside class="pane rail">
    <div class="railhead">
      <div class="tabs" id="fams"></div>
      <div class="tabs" id="fmts"></div>
    </div>
    <div class="grid" id="grid"></div>
    <input type="file" id="persofile" accept="image/png,image/jpeg,image/webp" hidden>
  </aside>
</main>

<div class="foot">
  <button id="reset">Vider tout le projet</button>
  <button id="dl">Télécharger la fiche</button>
  <span class="msg" id="msg"></span>
</div>

<div class="ov" id="done" hidden>
  <div class="box">
    <div class="tick">&#10003;</div>
    <b>Projet terminé</b>
    <p class="fn" id="donef"></p>
    <div class="ovn">
      <button class="p" id="back">Fermer</button>
    </div>
  </div>
</div>

/* 13/10 : declinaisons de texte. Une crea « inspi » peut porter 2 a 4
   versions de son texte sur le meme visuel : elle compte alors pour 2 a
   4 creas. nb() reste le nombre de creas commandees ; nc() est le
   nombre de cartes a remplir (les versions en prennent la place). */
const MAX_VERSIONS = 4;
const LETTRES = "ABCD";
/* 22/10 : variations de texte payees par le client : chaque crea a 2 ou 3 textes
   par defaut (PRJ.opts.textes) ; la strategiste peut quand meme changer une crea */
const textesParDefaut = () => (PRJ && PRJ.opts && PRJ.opts.textes > 1) ? PRJ.opts.textes : 1;
const versionsDe = i => { const d = data[i]; if (d && d.mode === "libre") return 1; if (d && d.versions >= 1) return Math.min(MAX_VERSIONS, d.versions); return textesParDefaut(); };
const nc = () => { if (EN_REPRISE) return REPRISE.length; const tot = nb(); let used = 0, cartes = 0;
  while (used < tot) { cartes++; used += Math.min(versionsDe(cartes), tot - used); }
  return cartes; };
const placeDe = i => { let avant = 0; for (let j = 1; j < i; j++) avant += versionsDe(j); return avant; };

function coupe(txt){
  const i=txt.indexOf(" · ");
  return i<0 ? {nom:txt,meta:""} : {nom:txt.slice(0,i),meta:txt.slice(i+3)};
}
function majLabel(){
  const s=$("projet"), o=s.options[s.selectedIndex];
  $("sellab").textContent=o?o.textContent:"Choisis un projet";
  $("selbtn").classList.toggle("rien",!s.value);
}
function dessineSel(){
  const s=$("projet"), pan=$("selpan");
  const ligne=o=>{
    const c=coupe(o.textContent);
    return '<div class="selopt'+(o.value===s.value?" on":"")+'" role="option" data-v="'+esc(o.value)+'">'+
      '<span class="nm">'+esc(c.nom)+'</span>'+
      (c.meta?'<span class="meta">'+esc(c.meta)+'</span>':'')+'</div>';
  };
  let h="";
  let vides=0;
  for(const c of s.children){
    if(c.tagName==="OPTGROUP"){
      h+='<div class="selgrp">'+esc(c.label)+'</div>';
      for(const o of c.children) h+=ligne(o);
    } else if(c.value){            // l option vide sert de titre au bouton,
      h+=ligne(c);                 // elle n a rien a faire dans la liste
    } else vides++;
  }
  if(!h) h='<div class="selrien">'+esc(s.options[0]?s.options[0].textContent:"Aucun projet")+'</div>';
  if(s.value) h+='<div class="selferm" data-v="">Fermer le projet</div>';
  pan.innerHTML=h;
  pan.querySelectorAll(".selopt,.selferm").forEach(el=>el.onclick=()=>{
    s.value=el.dataset.v; fermeSel(); majLabel(); s.onchange();
  });
  majLabel();
}

function fermeSel(){

}
$("selbtn").onclick=e=>{e.stopPropagation();$("selpan").hidden?ouvreSel():fermeSel()};

document.addEventListener("keydown",e=>{
  if($("selpan").hidden)return;
  const opts=[...$("selpan").querySelectorAll(".selopt")];
  let i=opts.findIndex(o=>o.classList.contains("actif"));
  if(e.key==="Escape"){e.preventDefault();fermeSel();$("selbtn").focus();return}
  if(e.key==="ArrowDown"||e.key==="ArrowUp"){
    e.preventDefault();
    i=e.key==="ArrowDown"?Math.min(i+1,opts.length-1):Math.max(i-1,0);
    opts.forEach(o=>o.classList.remove("actif"));
    if(opts[i]){opts[i].classList.add("actif");opts[i].scrollIntoView({block:"nearest"})}
    return;
  }
  if(e.key==="Enter"&&i>=0){e.preventDefault();opts[i].click()}
});

/* une crea : {mode:"inspi"|"libre", ref, tx:{ref:{k:texte}}, idee, moods:[], lignes:[{role,t}]}
   Les anciens brouillons (titre, sous, cta) sont repris tels quels. */
const MIGRES = new Set();
function crea(i){
  const d = data[i] = data[i] || {};
  if (!d.mode) d.mode = "inspi";
  if (!d.tx) {
    d.tx = {};
    if (d.titre || d.sous || d.cta) {
      const sl = slotsDe(d.ref || ""), t = {};
      const pose = (role, v) => { const k = sl.findIndex(x => x.role === role); if (v && k >= 0) t[k] = v; };
      pose("Titre", d.titre); pose("Sous-titre", d.sous); pose("CTA", d.cta);
      d.tx[d.ref || "_"] = t;
    }
  }
  if (!Array.isArray(d.moods)) d.moods = [];
  if (!Array.isArray(d.lignes)) d.lignes = [];
  /* Les anciens brouillons sont remis d aplomb UNE fois, a la premiere
     ouverture de la crea. Le faire a chaque affichage annulait le choix
     « Autre » sur une ligne encore vide : elle redevenait « Titre ». */
  const cle = (PRJ ? PRJ.dossier : "") + ":" + i;
  if (!MIGRES.has(cle)) {
    MIGRES.add(cle);
    d.lignes.forEach(l => {
      if (l.role === "Puce") l.role = "Liste à puces";
      else if (l.role === AUTRE && !(l.lib || "").trim() && !(l.t || "").trim()) l.role = "Titre";
      else if (l.role !== AUTRE && !ROLES.includes(l.role)) { l.lib = l.role; l.role = AUTRE; }
    });
  }
  return d;
}
const textesDe = d => (d.tx[d.ref] = d.tx[d.ref] || {});
function full(i){
  const d = data[i]; if (!d) return false;
  crea(i);
  if (d.mode === "libre")
    return d.moods.length > 0 && d.lignes.some(l => (l.t || "").trim()) && !!(d.idee || "").trim();
  if (!d.ref) return false;
  const t = textesDe(d), V = versionsDe(i);
  for (let v = 0; v < V; v++) {
    const ok = Object.keys(t).some(k => (v ? k.endsWith("@" + v) : !k.includes("@")) && (t[k] || "").trim());
    if (!ok) return false;
  }
  return true;
}

/* ---------- les fichiers deposes vivent dans IndexedDB ---------- */
let DB=null;
function db(){return new Promise((res,rej)=>{
  if(DB)return res(DB);
  let r;try{r=indexedDB.open("kreative_assets",1)}catch(e){return rej(e)}
  r.onupgradeneeded=()=>{const d=r.result;
    if(!d.objectStoreNames.contains("files"))d.createObjectStore("files",{keyPath:"id"})};
  r.onsuccess=()=>{DB=r.result;res(DB)};
  r.onerror=()=>rej(r.error)})}
function store(mode){return db().then(d=>d.transaction("files",mode).objectStore("files"))}
async function dbAll(){try{const s=await store("readonly");
  return await new Promise(r=>{const q=s.getAll();q.onsuccess=()=>r(q.result||[]);q.onerror=()=>r([])})}
  catch(e){return []}}
async function dbPut(rec){try{const s=await store("readwrite");
  return await new Promise(r=>{const q=s.put(rec);q.onsuccess=()=>r(1);q.onerror=()=>r(0)})}
  catch(e){return 0}}
async function dbDel(id){try{const s=await store("readwrite");
  return await new Promise(r=>{const q=s.delete(id);q.onsuccess=()=>r(1);q.onerror=()=>r(0)})}
  catch(e){return 0}}
async function dbDelDossier(d){const all=await dbAll();
  for(const a of all)if(a.dossier===d)await dbDel(a.id)}

function mini(f){return new Promise(res=>{
  if(!/^image\//.test(f.type)||/svg/.test(f.type))return res(null);
  const fr=new FileReader();
  fr.onload=()=>{const im=new Image();
    im.onload=()=>{const m=120,r=Math.min(m/im.width,m/im.height,1);
      const c=document.createElement("canvas");
      c.width=Math.max(1,Math.round(im.width*r));c.height=Math.max(1,Math.round(im.height*r));
      c.getContext("2d").drawImage(im,0,0,c.width,c.height);
      try{res(c.toDataURL("image/jpeg",.7))}catch(e){res(null)}};
    im.onerror=()=>res(null);im.src=fr.result};
  fr.onerror=()=>res(null);fr.readAsDataURL(f)})}

async function addFiles(list){

  const fs=[...list];if(!fs.length)return;
  say("Ajout de "+fs.length+" fichier"+(fs.length>1?"s":"")+"...");
  let bad=0;
  for(const f of fs){
    if(asOf(cur).some(a=>a.name===f.name&&a.size===f.size))continue;
    const rec={id:"a"+Date.now()+Math.random().toString(36).slice(2,7),
      dossier:cleDossier(),crea:cur,

}

async function ouvre(dossier){
  PRJ=PROJETS.find(p=>p.dossier===dossier)||null;
  if(!PRJ)return;
  charge();
  let n=PRJ.nb_creas||0;
  try{
    const r=await fetchT(urlDonnees(dossier),{cache:"no-store"});
    if(r.ok){const d=await r.json();if(d&&d.nb_creas)n=d.nb_creas;
      if(d&&d.brand_name)PRJ.brand_name=d.brand_name}
  }catch(e){/* donnees.json absent : on garde ce que dit projets.json */}
  /* 10/11 : le compte d envois vient du serveur (envois.json), pas seulement du navigateur :
     quand Kreative remet le compteur d un projet, la fiche se debloque toute seule (Podmax) */
  try{
    const r=await fetchT("../"+dossier+"/envois.json",{cache:"no-store"});
    if(r.ok){const e=await r.json();if(e&&Array.isArray(e.envois)){NBENV[dossier]=e.envois.length;saveNb();}}
  }catch(e){/* pas encore envoyee : rien a lire */}
  /* 17/10 : les options payees par le client (variations de texte, express ;
     anciennes commandes : A/B tests), lues dans le portail. Les variations
     multiplient les textes de chaque crea, les A/B tests ajoutent des creas. */
  const o=await optionsClient(dossier);
  PRJ.opts=o;
  PRJ.nb_creas=n?n*o.textes+o.abv+o.abt:0;
  if(!n)$("custom").value="";
  montreOptions();
  await chargeRetour(dossier);
  majEtat();
  const all=await dbAll();
  AS=all.filter(a=>a.dossier===cleDossier());
  if(EN_REPRISE)await chargeReprise(dossier);
  cur=1;
  const dn=nc();for(let i=1;i<=dn;i++)if(!full(i)){cur=i;break}
  form();grid();strip();
  if(EN_REPRISE)
    say(RETOURS&&RETOURS.length?"Reprise : "+REPRISE.length+" créa"+(REPRISE.length>1?"s":"")+" à refaire.":"Aucune créa à refaire sur ce projet.",RETOURS&&RETOURS.length?"ok":"ko");
  else if(estEnvoyee(dossier))
    say("Cette fiche a déjà été reçue.","ko");
  else
    say("Projet "+(PRJ.brand_name||dossier)+" ouvert.","ok");
}

/* 17/10 : les options du client. Un Custom livre en plusieurs fois les
   repartit entre ses livraisons (comme l espace strategiste). */
async function optionsClient(dossier){
  const o={abv:0,abt:0,textes:1,express:false};
  let r=null,d=null;
  try{const x=await fetchT("/api/equipe/etats",{cache:"no-store",credentials:"same-origin"});if(x.ok)r=await x.json()}catch(e){r=null}
  if(!r||!r.options)return o;
  try{const y=await fetchT(urlDonnees(dossier),{cache:"no-store"});if(y.ok)d=await y.json()}catch(e){d=null}
  const l=d&&d.livraison, base=(l&&l.projet)||dossier.replace(/_L\d+$/,"");
  const s=r.options[dossier]||r.options[base]||"";
  const part=t=>!(l&&l.sur>1)?t:Math.floor(t/l.sur)+((l.n||1)<=t%l.sur?1:0);
  s.split(",").forEach(x=>{const [id,q]=x.split(":");
    if(id==="express")o.express=true;else if(id==="variations")o.textes=1+Math.min(2,Math.max(1,+q||1));
    else if(id==="ab_visuel")o.abv=part(+q||0);else if(id==="ab_texte")o.abt=part(+q||0);});
  return o;
}
function montreOptions(){
  const b=$("options"), o=(PRJ&&PRJ.opts)||{};

  if(o.abv)t.push("<b>A/B test visuel sur "+o.abv+" créa"+(o.abv>1?"s":"")+"</b> : "+o.abv+" créa"+(o.abv>1?"s":"")+" en plus, qui reprennent les textes d'une autre (« Reprendre les textes ») avec une autre inspiration.");

}
/* 15/10 : le nom du brief selon le type de projet :
   sur-mesure -> « Brief de la livraison 2/4 », abonnement -> « Brief de novembre » */
function nomBrief(d){
  const M=["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
  const l=d&&d.livraison;
  if(d&&(d.abonnement||(l&&l.type==="abonnement"))){
    const m=M[new Date(Date.parse(d.deadline||"")||Date.now()).getMonth()];
    return "Brief "+(/^[aeiouâ]/.test(m)?"d'":"de ")+m;
  }
  if(l&&l.sur>1) return "Brief de la livraison "+l.n+"/"+l.sur;
  return "Brief du client";
}

/* ---------- 10/11 : ajouter sa propre image d inspiration ---------- */
let TESS = null;
function chargeTess(){
  if (TESS) return TESS;
  TESS = new Promise((ok, ko) => {
    if (window.Tesseract) return ok(window.Tesseract);
    const sc = document.createElement("script");
    sc.src = "https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js";
    sc.onload = () => ok(window.Tesseract); sc.onerror = () => { TESS = null; ko(new Error("ocr")); };
    document.head.appendChild(sc);
  });
  return TESS;
}
// lecture des textes d'une créa (fiche : « ajouter ma propre image ») : des lignes de Tesseract aux emplacements
function emplacementsOCR(data, W, H) {
  const lignes = [];
  for (const l of (data.lines || [])) {
    const mots = (l.words || []).filter(w => w.confidence >= 50 && /[A-Za-zÀ-ÿ0-9]/.test(w.text) && !/^[^A-Za-zÀ-ÿ0-9]*[A-Za-zÀ-ÿ0-9][^A-Za-zÀ-ÿ0-9]{2,}$/.test(w.text));
    if (!mots.length) continue;
    const t = mots.map(w => w.text).join(' ').replace(/^[^A-Za-zÀ-ÿ0-9«"“]+/, '').trim();
    const lettres = (t.match(/[A-Za-zÀ-ÿ]/g) || []).length;
    const conf = mots.reduce((a, w) => a + w.confidence, 0) / mots.length;
    if (!mots.some(w => /[A-Za-zÀ-ÿ]{3,}/.test(w.text))) continue;
    if (lettres < 3 || conf < 65 || lettres / Math.max(1, t.replace(/\s/g, '').length) < 0.6) continue;
    if (/^\d{1,2}[:h]\d{2}\b/.test(t) && t.length < 12) continue;
    const b = { x0: Math.min(...mots.map(w => w.bbox.x0)), x1: Math.max(...mots.map(w => w.bbox.x1)), y0: l.bbox.y0, y1: l.bbox.y1 };
    const hs = mots.map(w => w.bbox.y1 - w.bbox.y0).sort((a, b) => a - b);
    lignes.push({ t, b, h: hs[Math.floor(hs.length / 2)] });
  }
  lignes.sort((a, b) => a.b.y0 - b.b.y0);
  const blocs = [];
  for (const l of lignes) {
    const p = blocs[blocs.length - 1], d = p && p.lignes[p.lignes.length - 1];
    const meme = d && (l.b.y0 - d.b.y1) < 0.75 * Math.min(l.h, d.h) && Math.max(l.h, d.h) / Math.min(l.h, d.h) < 1.3 &&
      !(l.b.x0 > d.b.x1 || l.b.x1 < d.b.x0);
    if (meme) { p.lignes.push(l); p.b = { x0: Math.min(p.b.x0, l.b.x0), x1: Math.max(p.b.x1, l.b.x1), y0: p.b.y0, y1: l.b.y1 }; }
    else blocs.push({ lignes: [l], b: { ...l.b } });
  }
  blocs.forEach(k => { k.t = k.lignes.map(l => l.t).join(' ').replace(/\s+/g, ' ').trim(); k.h = k.lignes.reduce((a, l) => a + l.h, 0) / k.lignes.length; });
  const bons = blocs.filter(k => k.t.length >= 3).slice(0, 8);
  if (!bons.length) return [];
  const titre = bons.reduce((a, k) => k.h > a.h ? k : a, bons[0]);
  const it = bons.indexOf(titre);
  return bons.map((k, i) => {
    let role = 'Texte';
    if (k === titre) role = 'Titre';
    else if (i === it + 1 && k.h < titre.h) role = 'Sous-titre';
    else if (i === bons.length - 1 && k.t.split(' ').length <= 8 && k.b.y0 > H * 0.6) role = 'CTA';
    return { role, ex: k.t.slice(0, 160), x: Math.round((k.b.x0 + k.b.x1) / 2 * 100 / W), y: Math.round((k.b.y0 + k.b.y1) / 2 * 100 / H), p: 1 };
  });
}

async function lireTextes(blob, W, H){
  const T = await chargeTess();
  const w = await T.createWorker("fra", 1, { langPath: "https://cdn.jsdelivr.net/npm/@tesseract.js-data/fra/4.0.0_best_int" });
  try {
    const r = await Promise.race([w.recognize(blob), new Promise((_, ko) => setTimeout(() => ko(new Error("lent")), 60000))]);
    return emplacementsOCR(r.data, W, H);
  } finally { try { w.terminate(); } catch (e) {} }
}
const enJpeg = (bmp, cote, q) => new Promise(r => {
  const f = Math.min(1, cote / Math.max(bmp.width, bmp.height));
  const cv = document.createElement("canvas"); cv.width = Math.max(1, Math.round(bmp.width * f)); cv.height = Math.max(1, Math.round(bmp.height * f));
  const cx = cv.getContext("2d"); cx.fillStyle = "#fff"; cx.fillRect(0, 0, cv.width, cv.height); cx.drawImage(bmp, 0, 0, cv.width, cv.height);
  cv.toBlob(b => r({ blob: b, w: cv.width, h: cv.height }), "image/jpeg", q);
});
async function ajoutePerso(f){
  if (!PRJ) return say("Choisis d abord un projet.", "ko");
  if (!f || !/^image\/(png|jpeg|webp)$/.test(f.type)) return say("Choisis une image JPG, PNG ou WEBP.", "ko");
  const natif = confirm("Cette image est-elle un meme, une capture d'écran, une note ou une conversation ?\n\nOK : on garde son style natif, comme une ugly ad.\nAnnuler : on l'adapte à la charte du client.");
  let bmp; try { bmp = await createImageBitmap(f); } catch (e) { return say("Cette image ne s'ouvre pas.", "ko"); }
  say("Ajout de ton image…");
  const grand = await enJpeg(bmp, 1600, 0.9), petit = await enJpeg(bmp, 520, 0.8);
  bmp.close && bmp.close();
  let id = "";
  if (PORTAIL && !TEST) {
    try {
      const r = await fetchT("/api/equipe/inspiration?style=" + (natif ? "natif" : "marque"), { method: "POST", headers: { "Content-Type": "image/jpeg" }, body: grand.blob, credentials: "same-origin" }, 30000);
      const j = await r.json().catch(() => ({}));
      if (!r.ok || !j.id) return say(r.status === 401 ? "Ta session a expiré : reconnecte-toi au portail, puis réessaie." : (r.status === 403 || r.status === 404 ? "Le portail n'est pas encore à jour pour ajouter tes images. Préviens Kreative." : j.erreur || "L'image n'a pas pu être ajoutée. Préviens Kreative."), "ko");
      id = j.id;
    } catch (e) { return say("L'image n'a pas pu être ajoutée (connexion). Réessaie.", "ko"); }
  } else {
    const h = [...new Uint8Array(await crypto.subtle.digest("SHA-256", await grand.blob.arrayBuffer()))].map(x => x.toString(16).padStart(2, "0")).join("").slice(0, 12);
    id = (natif ? "UGX-" : "PRX-") + h;
  }
  const src = await b64(petit.blob);
  say("Lecture des textes de ton image…");
  let slots = [];
  try { slots = await lireTextes(grand.blob, grand.w, grand.h); } catch (e) { slots = []; }
  const lus = slots.length;
  if (!lus) slots = [{role:"Titre", ex:"", x:null, y:null, p:1}];
  PERSOS[id] = { src, slots, dossier: PRJ.dossier, natif, le: Date.now() };
  savePersos();
  const c = crea(cur);
  if (c.mode === "libre") {
    if (!c.moods.includes(id)) { if (c.moods.length < MAX_INSPI) c.moods.push(id); else say("3 inspirations maximum : retires-en une pour ajouter ton image.", "ko"); }
  } else { c.ref = id; selK = -1; }
  save(); grid(); form(); strip();
  if (c.mode !== "libre") say(lus ? lus + " texte" + (lus > 1 ? "s repérés" : " repéré") + " sur ton image. Vérifie les emplacements, puis écris tes textes." : "Aucun texte repéré sur ton image : ajoute les emplacements toi-même.", lus ? "" : "ko");
  else if (c.moods.includes(id)) say("Ton image est ajoutée aux inspirations de la créa.");
}
$("persofile").onchange = () => { const f = $("persofile").files[0]; if (f) ajoutePerso(f); };

function strip(){
  const n=nb(),cartes=nc();let h="";
  for(let i=1;i<=cartes;i++){const v=versionsDe(i);
    h+='<button class="chip '+(v>1?'v ':'')+(i===cur?'on ':'')+(full(i)?'full':'')+'" data-i="'+i+'">'+String(numDe(i)).padStart(2,"0")+(v>1?'<sup>×'+v+'</sup>':'')+'</button>';}
  $("strip").innerHTML=h;
  $("strip").querySelectorAll(".chip").forEach(c=>c.onclick=()=>{cur=+c.dataset.i;selK=-1;form();grid();strip()});
  let c=0;for(let i=1;i<=cartes;i++)if(full(i))c+=versionsDe(i);
  c=Math.min(c,n);
  $("count").textContent=c+" / "+n;
  $("jauge").style.width=(n?Math.round(c*100/n):0)+"%";
}

const FL = '<svg class="fl" viewBox="0 0 12 8" fill="none" aria-hidden="true"><path d="M1 1.5 6 6.5l5-5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>';

const cleV = (k, v) => v ? k + "@" + v : String(k);
function champ(s, k, t, V, suppr){
  V = V || 1;
  const un = vi => '<input id="s' + k + (vi ? '_' + vi : '') + '" data-k="' + k + '" data-v="' + vi + '" value="' + esc(t[cleV(k, vi)] || "") +
    '" placeholder="' + (vi ? 'Vide = même texte que A' : esc(s.role)) + '">';
  let ins = '';
  if (V === 1) ins = un(0);
  else { ins = '<div class="vins">'; for (let vi = 0; vi < V; vi++) ins += '<div class="vin"><i>' + LETTRES[vi] + '</i>' + un(vi) + '</div>'; ins += '</div>'; }
  return '<div class="slot' + (s.p ? '' : ' sec') + (k === selK ? ' sel' : '') + '" data-k="' + k + '">' +
    '<button type="button" class="n" data-k="' + k + '" tabindex="-1" aria-label="Emplacement ' + (k + 1) + '">' + (k + 1) + '</button>' +

    (suppr ? '<button type="button" class="x sx" data-sdel="' + k + '" aria-label="Retirer cet emplacement">&times;</button>' : '') + '</div>';
}

/* reprendre les textes d une autre crea : meme type de texte, meme place */
function zoneReprendre(){
  const n = nc(); let o = '', li = '';
  for (let i = 1; i <= n; i++) {
    if (i === cur || !data[i]) continue;
    const tx = textesPourEnvoi(crea(i)).filter(x => x.texte);
    if (!tx.length) continue;
    o += '<option value="' + i + '">Créa ' + String(i).padStart(2, "0") + ' · ' + esc(tx[0].texte.slice(0, 50)) + '</option>';
    li += '<div class="selopt" role="option" data-v="' + i + '"><span class="nm">Créa ' + String(i).padStart(2, "0") + '</span>' +
      '<span class="meta">' + esc(tx[0].texte.slice(0, 44)) + (tx[0].texte.length > 44 ? '…' : '') + '</span></div>';
  }
  if (!o) return '';
  /* 14/10 : le select reste la source (son « change » recopie les textes),
     mais il est cache ; on affiche le meme menu maison que celui des projets */
  return '<div class="repr"><span class="lbl"><b>Même texte qu\'une autre créa ?</b></span>' +
    '<select id="repr" hidden><option value="">Reprendre les textes de…</option>' + o + '</select>' +
    '<div class="sel" id="reprsel"><button class="selbtn rien" id="reprbtn" type="button" aria-haspopup="listbox" aria-expanded="false">' +
    '<span class="lab">Reprendre les textes de…</span>' +
    '<svg class="fl" viewBox="0 0 12 8" fill="none" aria-hidden="true"><path d="M1 1.5 6 6.5l5-5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>' +
    '</button><div class="selpan" id="reprpan" role="listbox" hidden>' + li + '</div></div></div>';

function zoneVersions(d){
  const V = versionsDe(cur);
  let b = '';
  for (let v = 1; v <= MAX_VERSIONS; v++) b += '<button type="button" data-ver="' + v + '" class="' + (v === V ? 'on' : '') + '">' + (v === 1 ? '1 texte' : v + ' textes') + '</button>';
  return '<div class="vers"><span class="lbl"><b>Déclinaisons de texte</b> · le même visuel, avec plusieurs textes</span>' +
    '<div class="vchoix">' + b + '</div>' +
    (V > 1 ? '<div class="vaide">Cette créa compte pour ' + V + ' créas. Le visuel est fait une seule fois, sans texte, et chaque version de texte est posée dessus. Un champ B, C ou D laissé vide reprend le texte de A.</div>' : '') +
    '</div>';
}

function zoneInspi(d){
  if (!d.ref) return '<div class="vide-ref">Choisis une inspiration à droite.</div>';
  const bk = bkDe(d.ref) || {}, perso = estPerso(d.ref);
  const sl = slotsDe(d.ref), t = textesDe(d), analysee = !!SLOTS[d.ref] || perso;
  let dup = false; const n = nc();
  for (let i = 1; i <= n; i++) if (i !== cur && data[i] && data[i].mode !== "libre" && data[i].ref === d.ref) dup = true;
  const pins = analysee ? sl.map((x, k) => x.x == null ? '' :
    '<button type="button" class="pin' + (x.p ? '' : ' sec') + (k === selK ? ' sel' : '') + '" data-k="' + k + '" style="left:' + x.x + '%;top:' + x.y + '%" aria-label="' + esc(x.role) + '">' + (k + 1) + '</button>').join("") : '';
  let h = '<div class="prev"><div class="prevhead"><b>' + esc(d.ref) + '</b><small>' + esc(perso ? "Ton image" : nomFmt(bk.fmt)) + '</small>' +
    (dup ? '<span class="dup">déjà utilisée dans ce batch</span>' : '') + '</div>' +
    '<div class="stage"><div class="pinbox"><img src="' + esc(urlHD(d.ref) || bk.src) + '" data-mini="' + esc(bk.src || "") + '" alt="Inspiration ' + esc(d.ref) + '">' + pins + '</div></div></div>';
  const prin = [], autres = [], V = versionsDe(cur);
  sl.forEach((x, k) => (x.p ? prin : autres).push(champ(x, k, t, V, perso)));
  h += '<div class="grp"><span class="lbl"><b>Copywriting</b> · laisse vide si tu ne souhaites pas l\'afficher</span><div class="slots">' + prin.join("") + '</div>' +
    (perso ? '<div class="aideperso">Textes repérés sur ton image. Retire ceux qui ne servent pas (×), ou ajoute un emplacement.</div><button type="button" class="addline" id="addslot">+ Ajouter un emplacement</button>' : '') + '</div>';
  if (autres.length) h += '<div class="grp"><span class="lbl"><b>Autres textes</b></span><div class="slots">' + autres.join("") + '</div></div>';
  h += zoneVersions(d) + zoneReprendre();
  return h;
}

const zone = $("zone");
zone.addEventListener("input", e => {
  if (!PRJ) return;
  const c = crea(cur), t = e.target;
  if (t.dataset.k !== undefined) textesDe(c)[cleV(t.dataset.k, +(t.dataset.v || 0))] = t.value;
  else if (t.dataset.t !== undefined) c.lignes[+t.dataset.t].t = t.value;
  else if (t.dataset.lib !== undefined) c.lignes[+t.dataset.lib].lib = t.value;

});
document.addEventListener("mousedown", e => { if (selK >= 0 && !e.target.closest(".pin, .slot .n")) choisitK(-1, false); });
zone.addEventListener("click", e => {
  if (!PRJ) return;
  const c = crea(cur);
  const pin = e.target.closest(".pin, .slot .n");
  if (pin) { choisitK(+pin.dataset.k, false); return; }
  const vb = e.target.closest("[data-ver]");
  if (vb) { changeVersions(+vb.dataset.ver); return; }
  const rm = e.target.closest("[data-rm]");
  if (rm) { c.moods = c.moods.filter(m => m !== rm.dataset.rm); save(); form(); grid(); strip(); return; }
  if (e.target.closest("[data-perso]")) { $("persofile").value = ""; $("persofile").click(); return; }
  const sdel = e.target.closest("[data-sdel]");
  if (sdel && PERSOS[c.ref]) {
    const k = +sdel.dataset.sdel, sl = PERSOS[c.ref].slots, t = textesDe(c), nt = {};
    sl.splice(k, 1);
    /* les textes deja ecrits suivent leur emplacement */
    Object.keys(t).forEach(cle => { const [a, v] = cle.split("@"), j = +a; if (j === k) return; nt[(j > k ? j - 1 : j) + (v ? "@" + v : "")] = t[cle]; });
    c.tx[c.ref] = nt; selK = -1; savePersos(); save(); form(); strip(); return;
  }
  if (e.target.closest("#addslot") && PERSOS[c.ref]) {
    PERSOS[c.ref].slots.push({role:"Texte", ex:"", x:null, y:null, p:1}); savePersos(); form();
    const all = zone.querySelectorAll(".slot input"); if (all.length) all[all.length - 1].focus();
    return;
  }
  const del = e.target.closest("[data-del]");
  if (del) { c.lignes.splice(+del.dataset.del, 1); save(); form(); strip(); return; }
  if (e.target.closest("#addline")) {

    const all = zone.querySelectorAll("[data-t]"); if (all.length) all[all.length - 1].focus();

  const opt = e.target.closest(".rsel .selopt");
  if (opt) {
    const r = opt.closest(".rsel"), i = +r.dataset.i, l = c.lignes[i], v = opt.dataset.v;
    const avant = l.role; l.role = v; save(); fermeRoles();
    if (v === AUTRE || avant === AUTRE) {
      form();

      const cible = nv && (nv.querySelector(".rselin") || nv.querySelector(".rselbtn"));

      r.querySelectorAll(".selopt").forEach(o => o.classList.toggle("on", o === opt));
      r.querySelector(".rselbtn").focus();
    }

});

function changeVersions(v){
  const c = crea(cur), avant = c.versions || 1;
  if (v === avant) return;
  c.versions = v;
  /* les cartes poussees hors du total doivent etre vides */
  const n = nc(), tot = (() => { let x = 0; for (let i = 1; i <= n; i++) x += versionsDe(i); return x; })();
  let perdues = [];
  for (let i = n + 1; i <= nb(); i++) if (data[i] && full(i)) perdues.push(String(i).padStart(2, "0"));
  if (perdues.length || placeDe(cur) + v > nb()) {
    c.versions = avant;
    say(perdues.length ? "Pas assez de place : la créa " + perdues.join(", ") + " n'est pas vide. Vide-la d'abord." :
      "Pas assez de créas restantes pour " + v + " textes.", "ko");
    form(); return;
  }
  save(); form(); strip();
  say(v > 1 ? "Créa " + String(cur).padStart(2, "0") + " : " + v + " versions de texte, elle compte pour " + v + " créas." : "");
}
zone.addEventListener("change", e => {
  if (e.target.id !== "repr" || !e.target.value || !PRJ) return;
  const src = crea(+e.target.value), c = crea(cur);
  const tx = textesPourEnvoi(src).filter(x => x.texte);
  if (c.mode === "libre") {
    c.lignes = tx.map(x => ROLES.includes(x.role) ? {role:x.role, t:x.texte} : {role:AUTRE, lib:x.role, t:x.texte});
  } else {
    if (!c.ref) { say("Choisis d'abord l'inspiration de cette créa.", "ko"); e.target.value = ""; return; }
    const sl = slotsDe(c.ref), t = textesDe(c), pris = new Set(); let mis = 0;
    sl.forEach((s, k) => {
      const j = tx.findIndex((x, n) => !pris.has(n) && x.role === s.role);
      if (j >= 0) { pris.add(j); t[k] = tx[j].texte; mis++; }
    });
    const reste = tx.filter((x, n) => !pris.has(n)).map(x => x.role);
    say(mis + " texte" + (mis > 1 ? "s" : "") + " repris" + (reste.length ? ". Sans place équivalente ici : " + reste.join(", ") : "."), reste.length ? "ko" : "ok");
  }
  save(); form(); strip();
});

function ouvreRole(r){
  fermeRoles();
  r.classList.add("ouvert");
  const p = r.querySelector(".rselpan"); p.hidden = false;
  p.scrollIntoView({block:"nearest", behavior:"smooth"});
  r.querySelector(".rselbtn").setAttribute("aria-expanded", "true");
  const on = p.querySelector(".selopt.on") || p.querySelector(".selopt");
  if (on) { on.classList.add("actif"); on.scrollIntoView({block:"nearest"}); }
}
function fermeRoles(){
  document.querySelectorAll(".rsel.ouvert").forEach(r => {
    r.classList.remove("ouvert"); r.querySelector(".rselpan").hidden = true;
    r.querySelector(".rselbtn").setAttribute("aria-expanded", "false");
    r.querySelectorAll(".actif").forEach(o => o.classList.remove("actif"));
  });
}
document.addEventListener("click", e => { if (!e.target.closest(".rsel")) fermeRoles(); });
document.addEventListener("keydown", e => {
  const r = document.querySelector(".rsel.ouvert"); if (!r) return;
  const opts = [...r.querySelectorAll(".selopt")];
  let i = opts.findIndex(o => o.classList.contains("actif"));
  if (e.key === "Escape") { e.preventDefault(); fermeRoles(); (r.querySelector(".rselin") || r.querySelector(".rselbtn")).focus(); return; }
  if (e.key === "ArrowDown" || e.key === "ArrowUp") {
    e.preventDefault();
    i = e.key === "ArrowDown" ? Math.min(i + 1, opts.length - 1) : Math.max(i - 1, 0);
    opts.forEach(o => o.classList.remove("actif"));
    if (opts[i]) { opts[i].classList.add("actif"); opts[i].scrollIntoView({block:"nearest"}); }
    return;
  }
  if (e.key === "Enter" && i >= 0) { e.preventDefault(); opts[i].click(); }
});

/* ============================================================
   ENVOI
   Le texte part en JSON, les assets en pieces jointes du meme
   POST. Le telechargement reste disponible en secours.
   ============================================================ */
/* Chaque crea part avec la liste de ses textes, emplacement par
   emplacement. titre, sous_titre et cta restent remplis tant que
   VISUELS n a pas ete mis a jour. */
function textesPourEnvoi(c, vi){
  vi = vi || 0;
  if (c.mode === "libre")
    return c.lignes.filter(l => (l.t || "").trim()).map((l, k) => ({n:k + 1,
      role:l.role === AUTRE ? ((l.lib || "").trim() || "Autre") : l.role,
      autre:l.role === AUTRE, texte:l.t.trim()}));
  if (!c.ref) return [];
  const t = textesDe(c);
  /* une version vide a un emplacement reprend le texte de la version A */
  return slotsDe(c.ref).map((s, k) => ({n:k + 1, role:s.role, texte:((vi ? (t[cleV(k, vi)] || "").trim() || t[k] : t[k]) || "").trim(),
    sur_inspi:s.ex || "", x:s.x == null ? null : s.x, y:s.y == null ? null : s.y}));
}
function lignes(){
  const n = nc(), rows = [];
  for (let i = 1; i <= n; i++){
    const c = data[i] ? crea(i) : {mode:"inspi", moods:[], lignes:[], tx:{}};
    const libre = c.mode === "libre";
    const ref = libre ? (c.moods[0] || "") : (c.ref || "");
    const bk = ref ? bkDe(ref) : null;
    const tx = textesPourEnvoi(c);
    const role = r => (tx.find(t => t.role === r && t.texte) || {}).texte || "";
    const V = versionsDe(i), vers = [];
    if (V > 1) for (let v = 0; v < V; v++) vers.push({lettre:LETTRES[v], textes:textesPourEnvoi(c, v)});
    rows.push({n:numDe(i), mode:libre ? "libre" : "inspi",
      versions:V, sans_texte:V > 1, textes_versions:vers,
      reference:ref, inspirations:libre ? c.moods.slice() : [],
      textes:tx, idee_visuel:c.idee || "",
      titre:role("Titre"), sous_titre:role("Sous-titre"), cta:role("CTA"),
      famille:bk && FAMS[bk.fam] ? FAMS[bk.fam] : "", format:bk && !bk.perso ? nomFmt(bk.fmt) : "",
      assets:asOf(i).map(a => a.name)});
  }
  return rows;
}

    nb_creas:nb(),date:new Date().toISOString().slice(0,10),creas:lignes()};
}

/* ---------- l envoi ----------
   Les fichiers voyagent en base64 A L INTERIEUR du JSON, et non plus
   en pieces jointes d un FormData. Raison : en multipart, n8n range
   les fichiers dans son stockage binaire, et quand ce stockage est
   sur disque un noeud Code ne peut plus les relire. Les 19 assets
   repartaient donc vides. En JSON, il n y a aucun binaire, donc rien
   a relire : la donnee est deja la.
   Limite du webhook n8n : N8N_PAYLOAD_SIZE_MAX, reglee a 64 Mo sur le
   serveur (01/10). On s arrete a 48 Mo utiles pour garder de la marge.
   Avant l envoi, chaque image lourde est allegee (voir allege). */
const MAX_ENVOI = 48 * 1024 * 1024;

/* ---------- alleger les images lourdes avant l envoi ----------
   Une photo produit peut peser 8 Mo (Kotor Pharma). Au-dessus de
   1,5 Mo ou de 2400 px, l image est redessinee a 2400 px maximum
   (1600 px si elle depasse encore 2 Mo),
   dans son format : JPEG reste JPEG (qualite 0,88), PNG reste PNG
   (la transparence d un logo est gardee), WEBP reste WEBP. Si le
   resultat n est pas plus leger, on garde l original. Une meme image
   deposee sur plusieurs creas n est traitee qu une fois. */
const COTE_MAX_ENVOI = 2400;
const POIDS_LEGER = 1.5 * 1024 * 1024;
const allegees = new Map();
async function allege(blob){
  if(allegees.has(blob)) return allegees.get(blob);
  const p = (async()=>{
    const type = blob.type || "";
    if(!/^image\/(jpeg|png|webp)$/.test(type)) return blob;
    let bmp;
    try{ bmp = await createImageBitmap(blob); }catch(e){ return blob; }
    const grand = Math.max(bmp.width, bmp.height);
    if(blob.size <= POIDS_LEGER && grand <= COTE_MAX_ENVOI){ bmp.close&&bmp.close(); return blob; }
    /* un PNG photo (packshot detoure) reste lourd a 2400 px : on
       redescend a 1600 px s il depasse encore 2 Mo */
    let sortie = null;
    for(const cote of [COTE_MAX_ENVOI, 1600]){
      const f = Math.min(1, cote / grand);
      const w = Math.max(1, Math.round(bmp.width * f)), h = Math.max(1, Math.round(bmp.height * f));
      const cv = document.createElement("canvas"); cv.width = w; cv.height = h;
      const cx = cv.getContext("2d");
      cx.imageSmoothingQuality = "high";
      cx.drawImage(bmp, 0, 0, w, h);
      sortie = await new Promise(r => cv.toBlob(r, type, type === "image/png" ? undefined : 0.88));
      if(!sortie || sortie.size <= 2 * 1024 * 1024) break;
    }
    bmp.close&&bmp.close();
    return (sortie && sortie.size < blob.size) ? sortie : blob;
  })();
  allegees.set(blob, p);
  return p;
}

async function envoie(code){
  const n=nc();
  const charge=charge_utile();
  charge.fichiers={};
  charge.code=code||"";

  let poids=0;
  const trop=[];

  for(let i=1;i<=n;i++){
    const list=asOf(i);
    for(let k=0;k<list.length;k++){
      const a=list[k];
      if(!a.blob)continue;
      const leger=await allege(a.blob);
      const d=await b64(leger);               /* data:image/png;base64,AAAA... */
      if(!d)continue;
      const v=d.indexOf(",");
      if(v<0)continue;
      const brut=d.slice(v+1);
      if(poids+brut.length>MAX_ENVOI){ trop.push(a.name); continue; }
      poids+=brut.length;
      (charge.fichiers[numDe(i)]||=[]).push({
        nom:a.name,
        mime:(leger.type||a.blob.type||"application/octet-stream"),
        b64:brut
      });
    }
  }

  if(trop.length) throw new Error(
    "Trop de fichiers pour un seul envoi. Non joints : "+trop.join(", ")+
    ". Allege ou retire quelques pieces et renvoie.");

  /* projet de démonstration (TEST_DEMO_*) : rien ne part vers n8n, personne n est prevenu */
  if(/^TEST_DEMO_/.test(charge.dossier||"")&&!EN_REPRISE)return {ok:true,demo:true};
  /* dans le portail : le Worker ajoute le code. S il ne sait pas encore le faire
     (ancienne version, code pas regle), on repasse par l ancien chemin, avec le code. */
  let r=null,viaPortail=false;
  if(PORTAIL){
    r=await fetch(ENVOI,{method:"POST",headers:{"Content-Type":"application/json"},credentials:"same-origin",body:JSON.stringify(charge)});
    if([401,403,404,405,503].includes(r.status)){
      /* 30/10 : plus jamais de fenetre qui demande le code. Un code deja garde dans ce
         navigateur sert encore en secours ; sinon un message clair, et rien a taper. */
      let garde="";try{garde=localStorage.getItem(CLE_CODE)||""}catch(e){}
      if(!TEST&&!garde){
        const e=new Error(r.status===401||r.status===403
          ?"Ta session a expiré : reconnecte-toi au portail, puis renvoie la fiche (rien n'est perdu)."
          :"Envoi pas encore possible : le portail n'a pas le code Kreative. Préviens Dario, puis renvoie la fiche (rien n'est perdu).");
        e.bloque=true;throw e;
      }
      r=null;charge.code=garde;
    } else viaPortail=true;
  }
  if(!r)r=await fetch(WEBHOOK,{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify(charge)
  });
  if(r.status===413)throw new Error("envoi trop lourd pour le serveur (413) : retire quelques pieces et renvoie");
  if(r.status===409){
    let rep={};try{rep=await r.json()}catch(e){}
    if(rep.code_invalide){if(viaPortail){const e=new Error("Envoi refusé : le code de la fiche réglé dans le portail n'est pas le bon. Préviens Kreative.");e.bloque=true;throw e;}oublieCode();const e=new Error(PORTAIL?"Envoi pas encore possible : le portail n'a pas le code Kreative. Préviens Dario, puis renvoie la fiche (rien n'est perdu).":"Code Kreative incorrect. Clique sur Envoyer et entre le bon code.");e.bloque=true;throw e;}
    const e=new Error(TEST&&rep.message?rep.message:rep.envois>=MAX_ENVOIS?MSG_BLOQUE:"Un envoi de cette fiche vient de partir. Attends quelques minutes, puis contacte Kreative si besoin.");e.bloque=true;e.envois=rep.envois;throw e;
  }
  if(!r.ok)throw new Error("le webhook a repondu "+r.status);
  let rep={};try{rep=await r.json()}catch(e){}
  return rep;
}

$("send").onclick=async()=>{
  if(!PRJ)return say("Choisis d abord un projet.","ko");
  const dejaNb=EN_REPRISE?0:nbEnvois(PRJ.dossier);
  if(dejaNb>=MAX_ENVOIS)return say(MSG_BLOQUE,"ko");
  if(EN_REPRISE&&!(RETOURS&&RETOURS.length))return say("Aucune créa à refaire sur ce projet.","ko");
  if(!EN_REPRISE&&estEnvoyee(PRJ.dossier)&&
     !confirm("Cette fiche a déjà été reçue le "+jourFr(ENVOYEES[PRJ.dossier])+
              ".\nLa renvoyer relancera la production une deuxième fois."+
              "\n\nC'est le seul renvoi possible : après, seule Kreative pourra la débloquer.\n\nContinuer ?"))return;
  const n=nc();let miss=[];
  for(let i=1;i<=n;i++)if(!full(i))miss.push(String(i).padStart(2,"0"));
  if(miss.length&&!confirm("Créa "+miss.join(", ")+" incomplète(s).\nEnvoyer quand même ?"))return;
  const DEMO=/^TEST_DEMO_/.test(PRJ.dossier||"");
  const code=TEST||DEMO||PORTAIL?"":codeKreative();
  if(!TEST&&!DEMO&&!PORTAIL&&!code)return say("Il faut le code Kreative pour envoyer la fiche.","ko");
  $("send").disabled=true;say("Envoi en cours...");
  try{
    const rep=await envoie(code);
    say("");
    if(EN_REPRISE){
      /* la reprise est partie : le brouillon a part est vide, la page revient aux retouches */
      data={};save();await dbDelDossier(cleDossier());
      $("donef").textContent=(PRJ.brand_name||PRJ.dossier)+" · "+REPRISE.length+" créa"+(REPRISE.length>1?"s":"")+" à refaire";
      $("done").hidden=false;
      try{if(window.parent!==window)window.parent.postMessage({kreativeReprise:PRJ.dossier},location.origin)}catch(e){}
      $("send").disabled=false;return;
    }
    ENVOYEES[PRJ.dossier]=new Date().toISOString();
    saveEnvois();
    NBENV[PRJ.dossier]=(rep&&rep.envoi)||(dejaNb+1);
    saveNb();
    $("donef").textContent=(PRJ.brand_name||PRJ.dossier)+" · "+n+" créas";
    $("done").hidden=false;
    if(DEMO)say("Démo : la fiche n'est partie nulle part, personne n'est prévenu.","ok");
    accueil();
    menu();
  }catch(e){
    if(e.bloque){
      if(e.envois>=MAX_ENVOIS){NBENV[PRJ.dossier]=e.envois;saveNb();}
      say(e.message,"ko");
    }
    else say("Envoi impossible : "+e.message+". Télécharge la fiche et contacte Kreative.","ko");
  }
  $("send").disabled=false;
};

/* ---------- secours : la fiche en un fichier ---------- */
function b64(blob){return new Promise(r=>{const f=new FileReader();
  f.onload=()=>r(f.result);f.onerror=()=>r(null);f.readAsDataURL(blob)})}
/* 08/11 : les vignettes sont des fichiers (fiche/mini/) : la fiche téléchargée les embarque */
async function miniData(bk){try{const r=await fetchT(bk.src,{},8000);if(r.ok)return(await b64(await r.blob()))||bk.src}catch(e){}return bk.src}

async function buildFiche(){
  const n=nc(),client=(PRJ&&PRJ.brand_name)||"Client",
        dt=new Date().toLocaleDateString("fr-FR",{day:"2-digit",month:"long",year:"numeric"});
  let cards="";
  for(let i=1;i<=n;i++){
    const c=data[i]?crea(i):{mode:'inspi',moods:[],lignes:[],tx:{}},rf=c.mode==='libre'?(c.moods[0]||''):c.ref,bk=rf?bkDe(rf):null,as=asOf(i),tx=textesPourEnvoi(c).filter(t=>t.texte);
    const bkSrc=bk?await miniData(bk):'';
    const files=[];
    for(const a of as)files.push({name:a.name,size:a.size,src:a.blob?await b64(a.blob):a.prev});
    cards+='<article class="c'+(full(i)?"":" inc")+'">'+
      '<header><span class="num">Créa '+String(i).padStart(2,"0")+'</span>'+
      (bk?'<span class="tag">'+esc(FAMS[bk.fam])+' &middot; '+esc(bk.fmt.replace(/^\d+ - /,""))+'</span>'
         :'<span class="tag warn">sans reference</span>')+
      '</header><div class="body"><div class="txt">'+
      (c.mode==='libre'?'<h3>Nouvelle idée · inspirations '+esc(c.moods.join(', '))+'</h3>':'')+
      (versionsDe(i)>1?[...Array(versionsDe(i)).keys()].map(v=>'<h3>Version '+LETTRES[v]+'</h3>'+textesPourEnvoi(c,v).filter(t=>t.texte).map(t=>'<p><b>'+t.n+' · '+esc(t.role)+'</b> : '+esc(t.texte)+'</p>').join('')).join(''):
      (tx.length?tx.map(t=>'<p><b>'+t.n+' · '+esc(t.role)+'</b> : '+esc(t.texte)+'</p>').join(''):'<p><i>aucun texte</i></p>'))+
      '<h3>Idée du visuel</h3><p>'+(c.idee?esc(c.idee):"<i>à définir</i>")+'</p>'+
      '<h3>Assets de cette créa</h3>'+
      (files.length?'<div class="as">'+files.map(f=>'<figure>'+
        (f.src&&/^data:image/.test(f.src)?'<img src="'+f.src+'" alt="'+esc(f.name)+'">'
          :'<div class="nf">'+esc((f.name.split(".").pop()||"?").toUpperCase())+'</div>')+
        '<figcaption>'+esc(f.name)+'<br><small>'+ko(f.size)+'</small></figcaption></figure>').join("")+'</div>'
        :'<p class="none">aucun asset joint</p>')+
      '</div><aside class="ref">'+
      (bk?('<img src="'+bkSrc+'" alt="'+esc(bk.id)+'"><span>'+esc(bk.id)+'</span>')
         :'<div class="nf">ref.</div>')+
      '</aside></div></article>';
  }
  const meta=JSON.stringify(charge_utile()).replace(/</g,"\\u003c");
  return '<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8">'+
  '<meta name="viewport" content="width=device-width,initial-scale=1">'+
  '<title>Fiche creas - '+esc(client)+'</title><style>'+
  'body{margin:0;background:#f9f6f4;color:#000000;font:15px/1.55 "Inter",-apple-system,"Segoe UI",sans-serif}'+
  '.w{max-width:1000px;margin:0 auto;padding:40px 28px 60px}'+
  'h1{font-size:26px;margin:0 0 4px}.meta{color:#4f4f4f;font-size:14px;margin:0 0 30px}'+
  '.c{background:#fff;border:1px solid #ebe5df;border-radius:16px;margin-bottom:20px;overflow:hidden}'+
  '.c.inc{border-color:#E8C9A6}'+
  '.c>header{display:flex;align-items:center;gap:12px;padding:14px 22px;border-bottom:1px solid #ebe5df;background:#fcfaf8}'+
  '.num{font-weight:600}.tag{font-size:12.5px;color:#4f4f4f}.tag.warn{color:#B3261E}'+
  '.body{display:flex;gap:26px;padding:22px}.txt{flex:1;min-width:0}'+
  '.txt h2{font-size:20px;margin:0 0 6px;line-height:1.3}.sub{margin:0 0 10px;color:#333333}'+
  '.cta{display:inline-block;margin:0 0 6px;padding:6px 14px;background:#000000;color:#fff;border-radius:8px;font-size:13px}'+
  '.txt h3{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:#8b8580;margin:18px 0 5px}'+
  '.txt p{margin:0}.none{color:#8b8580;font-size:13.5px}'+
  '.as{display:flex;flex-wrap:wrap;gap:12px;margin-top:8px}.as figure{width:120px;margin:0}'+
  '.as img{width:120px;height:120px;object-fit:cover;border-radius:9px;border:1px solid #ebe5df;display:block}'+
  '.nf{width:120px;height:120px;border-radius:9px;background:#efebe7;display:flex;align-items:center;justify-content:center;color:#8b8580;font-size:13px}'+
  '.as figcaption{font-size:11px;color:#4f4f4f;margin-top:5px;word-break:break-word}'+
  '.ref{flex:none;width:190px;text-align:center}'+
  '.ref img{width:190px;border-radius:10px;border:1px solid #ebe5df;display:block}'+
  '.ref span{display:block;font-size:12px;color:#4f4f4f;margin-top:6px}'+
  '@media(max-width:720px){.body{flex-direction:column}.ref,.ref img{width:100%}}'+
  '</style></head><body><div class="w">'+
  '<h1>Fiche creas - '+esc(client)+'</h1>'+
  '<p class="meta">'+nb()+' creas &middot; '+esc(dt)+'</p>'+cards+'</div>'+
  '<script type="application/json" id="fiche-creas">'+meta+'<\/script>'+
  '</body></html>';
}

$("dl").onclick=async()=>{
  if(!PRJ)return say("Choisis d abord un projet.","ko");
  $("dl").disabled=true;say("Preparation du fichier...");
  try{
    const html=await buildFiche();
    const slug=(PRJ.dossier||"client").toLowerCase()
      .normalize("NFD").replace(/[̀-ͯ]/g,"")
      .replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")||"client";
    const a=document.createElement("a");
    a.href=URL.createObjectURL(new Blob([html],{type:"text/html"}));
    a.download="fiche-creas-"+slug+"-"+new Date().toISOString().slice(0,10)+".html";
    a.click();URL.revokeObjectURL(a.href);
    say("Fiche telechargee.","ok");
  }catch(e){say("Telechargement impossible : "+e.message,"ko")}
  $("dl").disabled=false;
};
